<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScobbBucks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800;900&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EEF0F3;
  --card: #FFFFFF;
  --card-2: #F2F3F6;
  --ink: #15171C;
  --soft: #676D78;
  --line: #E1E4E9;
  --grape: #4A3AE0;
  --grape-deep: #3527B8;
  --grape-tint: #ECEAFD;
  --on-grape: #FFFFFF;
  --lime: #4A3AE0;
  --lime-deep: #3527B8;
  --on-lime: #FFFFFF;
  --tomato: #E5484D;
  --tomato-deep: #B8353A;
  --shadow: rgba(21, 23, 28, .14);
  --scrim: rgba(15, 17, 21, .45);
  --rt0: #6B7280; --rt1: #1D8F60; --rt2: #2563D9; --rt3: #7445DB; --rt4: #B86E0A; --rt5: #D23A73;
  --rb0: #E1E4E9; --rb1: #CDEBDD; --rb2: #D3E1FB; --rb3: #E2D7FA; --rb4: #F6E0BD; --rb5: #F7CFDD;
  --rs0: #8F96A3; --rs1: #23A26F; --rs2: #2F74E8; --rs3: #7C4DEB; --rs4: #E39424; --rs5: #E0457F;
  --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0F1115; --card: #181B21; --card-2: #20242B; --ink: #F2F4F7; --soft: #9AA1AD; --line: #2A2F37;
    --grape: #8E83FF; --grape-deep: #6A5EE8; --grape-tint: #26233F; --on-grape: #FFFFFF;
    --lime: #8E83FF; --lime-deep: #6A5EE8; --on-lime: #FFFFFF;
    --tomato: #FF6B6F; --tomato-deep: #C9474B;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
    --rt0: #AEB4BE; --rt1: #4FCB96; --rt2: #6EA2FF; --rt3: #A98BFF; --rt4: #F2B356; --rt5: #F27AA6;
    --rb0: #2A2F37; --rb1: #1E4A38; --rb2: #23385E; --rb3: #372A5C; --rb4: #4E3816; --rb5: #4E2235;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F1115; --card: #181B21; --card-2: #20242B; --ink: #F2F4F7; --soft: #9AA1AD; --line: #2A2F37;
  --grape: #8E83FF; --grape-deep: #6A5EE8; --grape-tint: #26233F; --on-grape: #FFFFFF;
  --lime: #8E83FF; --lime-deep: #6A5EE8; --on-lime: #FFFFFF;
  --tomato: #FF6B6F; --tomato-deep: #C9474B;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
  --rt0: #AEB4BE; --rt1: #4FCB96; --rt2: #6EA2FF; --rt3: #A98BFF; --rt4: #F2B356; --rt5: #F27AA6;
  --rb0: #2A2F37; --rb1: #1E4A38; --rb2: #23385E; --rb3: #372A5C; --rb4: #4E3816; --rb5: #4E2235;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
[hidden] { display: none !important; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { max-width: 480px; margin: 0 auto; padding: 14px 18px 40px; }
body.has-tabs #app { padding-bottom: 120px; }
h1 { font-size: 32px; line-height: 1.05; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 20px; line-height: 1.2; font-weight: 800; margin: 26px 0 8px; }
h3 { font-size: 16px; line-height: 1.2; font-weight: 800; margin: 20px 0 8px; }
p { margin: 0; }
.soft { color: var(--soft); }
.small { font-size: 14px; line-height: 1.4; }
.mt { margin-top: 22px; }
.rc0 { color: var(--rt0); } .rc1 { color: var(--rt1); } .rc2 { color: var(--rt2); } .rc3 { color: var(--rt3); } .rc4 { color: var(--rt4); } .rc5 { color: var(--rt5); }
.ic { width: 22px; height: 22px; display: block; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 16px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 16px; }
.link { border: 0; background: none; padding: 0; color: var(--grape); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* buttons: gummy */
.btn { border: 0; border-radius: 16px; height: 52px; padding: 0 20px; font: 800 17px/1 var(--font); transition: transform .08s ease, box-shadow .08s ease; margin-bottom: 5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-grape { background: var(--grape); color: var(--on-grape); box-shadow: 0 5px 0 var(--grape-deep); }
.btn-lime { background: var(--lime); color: var(--on-lime); box-shadow: 0 5px 0 var(--lime-deep); }
.btn-ghost { background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn-danger { background: var(--tomato); color: #fff; box-shadow: 0 5px 0 var(--tomato-deep); }
.btn:active:not(:disabled) { transform: translateY(4px); }
.btn-grape:active:not(:disabled) { box-shadow: 0 1px 0 var(--grape-deep); }
.btn-lime:active:not(:disabled) { box-shadow: 0 1px 0 var(--lime-deep); }
.btn-ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn-danger:active:not(:disabled) { box-shadow: 0 1px 0 var(--tomato-deep); }
.btn-block { display: block; width: 100%; }
.btn-sm { height: 40px; padding: 0 14px; font-size: 15px; border-radius: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.icon-btn { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--ink); }

/* message screens */
.msg { min-height: 72vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; padding: 0 10px; }
.msg h1 { font-size: 28px; }
.msg p { max-width: 34ch; color: var(--soft); }
.blob { width: 110px; height: 110px; }
.blob .av { width: 100%; height: 100%; }

/* forms */
.field { margin-top: 18px; }
.field > label, .field > .label { display: block; font-weight: 800; font-size: 15px; margin-bottom: 6px; }
.hint { font-size: 14px; color: var(--soft); margin-top: 6px; }
.err { font-size: 14px; color: var(--tomato); margin-top: 6px; font-weight: 700; }
.err[hidden] { display: none; }
input[type="text"], input[type="tel"], input[type="password"] { width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 17px; font-weight: 600; outline: none; }
input::placeholder { color: var(--soft); opacity: .75; font-weight: 500; }
input:focus { border-color: var(--grape); }
.at { position: relative; }
.at > span { position: absolute; left: 14px; top: 50%; transform: translateY(-52%); font-weight: 800; color: var(--soft); pointer-events: none; font-size: 18px; }
.at input { padding-left: 32px; }

/* setup */
.odds { margin-top: 16px; border-top: 2px solid var(--line); }
.odds div { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 2px solid var(--line); font-weight: 700; }
.odds div b { margin-left: auto; font-weight: 800; }
.odds div span.small { min-width: 52px; text-align: right; }

/* wallet */
.me-chip { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 14px 3px 3px; font-weight: 800; min-width: 0; }
.me-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb { flex: none; display: inline-block; border-radius: 50%; background: var(--card-2); overflow: hidden; }
.hb .av { width: 100%; height: 100%; display: block; }
.bal-label { font-weight: 800; color: var(--soft); }
.bal-num { font: 800 58px/1 var(--font); letter-spacing: -0.02em; margin: 6px 0 14px; display: flex; align-items: center; gap: 10px; }
.rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rcell { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 6px; row-gap: 2px; background: var(--card-2); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.rcell .rval { font-size: 19px; font-weight: 800; line-height: 1.1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcell .rn { grid-column: 1 / -1; font-size: 12.5px; font-weight: 800; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bal .small { margin-top: 10px; }
.banner { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 14px; padding: 14px; border-radius: 20px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; }
.banner.gift { background: var(--grape-tint); border-color: transparent; }
.banner .bt { flex: 1; min-width: 0; }
.banner .pill { flex: none; background: var(--grape); color: var(--on-grape); border-radius: 999px; padding: 6px 14px; font-weight: 800; box-shadow: 0 3px 0 var(--grape-deep); }
.farm-card { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 20px; background: linear-gradient(120deg, #DFF5C8, #FFF1B8); border: 2px solid #CDE8B0; color: #1F2A14; text-decoration: none; font-weight: 700; }
.farm-card .fe { font-size: 34px; line-height: 1; }
.farm-card .ft { flex: 1; min-width: 0; }
.farm-card .ft b { display: block; font-size: 18px; line-height: 1.2; }
.farm-card .ft span { font-size: 14px; color: #4E5E3E; }
.farm-card .go { flex: none; background: #6C2BD9; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; box-shadow: 0 3px 0 #4A16A6; }
.scard .thumb .fsk, .wthumb .fsk, .it-tag .tb .fsk { width: 100%; height: 100%; display: block; }
.fprev svg { width: 100%; max-width: 320px; display: block; margin: 6px auto 0; border-radius: 18px; }
.dm-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; margin-top: 8px; color: var(--ink); font: inherit; }
.dm-row .dt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dm-row .dt span { font-size: 14.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-row .dt .un { font-weight: 800; color: var(--ink); }
.dm-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.dm-dot { min-width: 20px; height: 20px; border-radius: 10px; background: var(--tomato); color: #fff; font-size: 12px; font-weight: 800; font-style: normal; display: grid; place-items: center; padding: 0 6px; }
.dm-pick { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); min-width: 66px; padding: 4px; }
.dm-thread { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 4px 0 12px; min-height: calc(100vh - 250px); min-height: calc(100dvh - 250px); }
.bub { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; }
.bub.them { align-self: flex-start; background: var(--card); border: 2px solid var(--line); border-bottom-left-radius: 6px; }
.bub.me { align-self: flex-end; background: var(--grape); color: var(--on-grape); border-bottom-right-radius: 6px; }
.bub.pend { opacity: .6; }
.dm-time { text-align: center; font-size: 12.5px; color: var(--soft); margin: 8px 0 2px; }
.dm-compose { position: sticky; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding: 8px 0; background: var(--bg); }
.dm-compose input { flex: 1; min-width: 0; }
.top-right { display: flex; gap: 8px; }
a.icon-btn { text-decoration: none; font-size: 22px; }
.press-top { display: flex; gap: 12px; align-items: center; }
#arc-root { position: fixed; inset: 0; z-index: 70; background: var(--bg); color: var(--ink); overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
#arc-root > * { max-width: 640px; margin-left: auto; margin-right: auto; }
.arc-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.crate { text-align: center; padding-top: 8vh; }
.crate-win { position: relative; overflow: hidden; border-radius: 22px; border: 3px solid var(--line); background: var(--card); padding: 16px 0; margin-top: 18px; }
.crate-strip { display: flex; gap: 8px; width: max-content; will-change: transform; }
.crate-card { width: 116px; height: 124px; flex: none; border-radius: 16px; background: var(--bg); border: 2px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 13px; padding: 6px; }
.crate-card span { font-size: 46px; line-height: 1; }
.crate-card.won { border-color: var(--grape); box-shadow: 0 0 0 4px var(--grape); }
.crate-mark { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; margin-left: -2px; background: #E9453C; box-shadow: 0 0 12px #E9453C; }
.crate-result { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 24px; animation: wig .9s ease 1; }
.arc-em { font-size: 32px; line-height: 1; }
.crate-result .arc-em { font-size: 64px; }
.arc-now { margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--bg); border: 2px solid var(--line); }
.arc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.arc-tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 700; font-size: 13.5px; text-align: center; }
.arc-tile.done { opacity: .55; }
.arc-result { text-align: center; padding: 30px 10px; }
.arc-result .ag-big { font-size: 64px; }
.press-ic { font-size: 34px; line-height: 1; }
.wiggle-in { animation: wig .9s ease 1; }
@keyframes wig { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(1deg); } }

/* lists */
.ev { display: flex; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--line); align-items: flex-start; }
.ev:last-child { border-bottom: 0; }
.ev .main { flex: 1; min-width: 0; }
.ev .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.ev .t b { font-weight: 800; }
.ev .s { color: var(--soft); font-size: 14px; overflow-wrap: anywhere; }
.ev .note { margin-top: 2px; font-size: 15px; overflow-wrap: anywhere; }
.ev .when { flex: none; color: var(--soft); font-size: 13px; white-space: nowrap; padding-top: 2px; }
.ev.hot { background: linear-gradient(90deg, rgba(255, 45, 122, .10), transparent 70%); border-radius: 14px; padding-left: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.cc { display: inline-flex; align-items: center; gap: 4px; background: var(--card-2); border-radius: 999px; padding: 2px 10px 2px 2px; font-weight: 800; font-size: 14px; }
.cc .tok { flex: none; }
.it-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--card-2); border-radius: 999px; padding: 2px 10px 2px 2px; font-weight: 700; font-size: 14px; }
.it-tag .tb { width: 26px; height: 26px; border-radius: 50%; background: var(--card); overflow: hidden; }
.it-tag .tb .av { width: 100%; height: 100%; }
.empty { padding: 18px 0; color: var(--soft); }

/* shop */
.mini-bal { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; color: var(--ink); }
.cat.on { background: var(--grape); border-color: var(--grape); color: var(--on-grape); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.scard { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; border-radius: 20px; border: 2px solid var(--rb0); background: var(--card); color: var(--ink); }
.rb0 { border-color: var(--rb0); } .rb1 { border-color: var(--rb1); } .rb2 { border-color: var(--rb2); } .rb3 { border-color: var(--rb3); } .rb4 { border-color: var(--rb4); }
.rb5 { border-color: transparent; background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(120deg, #FF4F8B, #FFB347, #5BE38A, #3EC1FF, #9B5CFF) border-box; }
.scard .thumb { position: relative; display: block; aspect-ratio: 1; border-radius: 14px; background: var(--card-2); overflow: hidden; }
.scard .thumb .av { width: 100%; height: 100%; display: block; }
.scard .nm { font-weight: 800; line-height: 1.15; margin-top: 4px; }
.scard .pr { display: flex; align-items: center; gap: 4px; font-weight: 800; }
.scard .pr .rt { font-size: 13px; }
.scard .own { position: absolute; top: 14px; right: 14px; background: var(--lime); color: var(--on-lime); border-radius: 999px; padding: 0 9px; font-size: 13px; font-weight: 800; }
.play { position: absolute; bottom: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--grape); color: #fff; display: grid; place-items: center; }
.play .ic { width: 14px; height: 14px; }

/* closet */
.stage { display: grid; place-items: center; }
.stage-btn { border: 0; padding: 6px 0 0; width: 100%; border-radius: 28px; background: radial-gradient(closest-side, var(--card) 0%, var(--card) 55%, transparent 100%); display: grid; place-items: center; }
.av.big { width: min(270px, 70vw); height: auto; display: block; }
.stage-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.wchip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 96px; padding: 8px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 13.5px; line-height: 1.15; text-align: center; }
.wchip.on { border-color: var(--grape); box-shadow: inset 0 0 0 2px var(--grape); }
.wchip.none { justify-content: center; min-height: 104px; color: var(--soft); }
.wthumb { width: 64px; height: 64px; border-radius: 12px; background: var(--card-2); overflow: hidden; display: block; }
.wthumb .av { width: 100%; height: 100%; display: block; }
.echip { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--ink); }
.echip.on { background: var(--grape); border-color: var(--grape); color: var(--on-grape); }

/* trades */
.offer { margin-top: 12px; }
.offer-head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.offer-head .bt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.offer-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.offer-cols > div { background: var(--card-2); border-radius: 16px; padding: 10px; min-width: 0; }
.offer-cols .lbl { font-weight: 800; font-size: 14px; color: var(--soft); }
.offer .note { margin-top: 10px; overflow-wrap: anywhere; }
.offer .warn { margin-top: 10px; color: var(--tomato); font-weight: 700; font-size: 14px; }
.status { display: inline-block; border-radius: 999px; padding: 0 10px; font-size: 13px; font-weight: 800; background: var(--card-2); color: var(--soft); }
.status.done { background: var(--lime); color: var(--on-lime); }

/* feed */
.players { margin-top: 4px; }
.pl { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 74px; border: 0; background: none; padding: 0; color: var(--ink); font-weight: 700; font-size: 13px; }
.pl span:last-child { max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .hb { border: 2px solid var(--line); }

/* look editor */
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--card); background: var(--sw); box-shadow: 0 0 0 2px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 3px var(--grape); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 14px; }
.opt.on { border-color: var(--grape); box-shadow: inset 0 0 0 2px var(--grape); }
.opt .face { width: 100%; aspect-ratio: 100 / 66; display: block; }
.opt .face .av { width: 100%; height: 100%; display: block; }

/* sheets */
.sheet-root { position: fixed; inset: 0; z-index: 40; }
.sheet-root[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 18px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 40px var(--shadow); animation: rise .3s cubic-bezier(.2, .9, .25, 1.05) both; outline: none; }
.grabber { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.sheet-head h2 { margin: 2px 0 0; font-size: 24px; overflow-wrap: anywhere; }
.sheet-head .sub { color: var(--soft); margin-top: 2px; }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--ink); }
.x .ic { width: 18px; height: 18px; }
@keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.results { margin-top: 6px; }
.res { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 14px; background: none; text-align: left; color: var(--ink); }
.res:hover, .res:focus-visible { background: var(--card-2); }
.picked { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border: 2px solid var(--grape); border-radius: 16px; background: var(--card); }
.picked[hidden] { display: none; }
.picked b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.step { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 2px solid var(--line); }
.step .sn { flex: 1; min-width: 0; font-weight: 800; line-height: 1.15; }
.step .sn .small { display: block; font-weight: 600; color: var(--soft); }
.sb { flex: none; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 22px; font-weight: 800; line-height: 1; padding: 0; color: var(--ink); }
.sv { flex: none; width: 64px; height: 40px; text-align: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font: 800 18px/1 var(--font); outline: none; }
.sv:focus { border-color: var(--grape); }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.qchip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; font-weight: 800; color: var(--ink); }
.ipick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.ichip { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; padding: 8px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 13px; line-height: 1.15; text-align: center; }
.ichip[aria-pressed="true"] { border-color: var(--grape); box-shadow: inset 0 0 0 2px var(--grape); background: var(--grape-tint); }
.side-card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 12px 14px; margin-top: 14px; }
.side-card h3 { margin-top: 0; }
.result { margin-top: 16px; text-align: center; }
.result .chips { justify-content: center; }
.preview-av { display: grid; place-items: center; margin: 4px 0 0; }
.preview-av .stage-btn { max-width: 300px; }
.price-row { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; margin-top: 8px; }
.tag { display: inline-block; border-radius: 999px; padding: 0 10px; font-size: 13px; font-weight: 800; background: var(--card-2); }
.tbl { margin-top: 10px; border-top: 2px solid var(--line); }
.tbl div { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 2px solid var(--line); font-weight: 700; }
.tbl div span:nth-child(2) { flex: 1; }
.tbl div b { min-width: 54px; text-align: right; }

/* reveal */
.rv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
.rv { position: relative; aspect-ratio: 1; border: 0; background: none; padding: 0; perspective: 600px; }
.rv .face { position: absolute; inset: 0; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .55s cubic-bezier(.3, .7, .3, 1.25); }
.rv .face .tok { width: 100%; height: 100%; }
.rv .back { transform: rotateY(180deg); }
.rv.flipped .front { transform: rotateY(-180deg); }
.rv.flipped .back { transform: rotateY(0deg); }
.rv.flipped.r4 .back, .rv.flipped.r5 .back { filter: drop-shadow(0 0 8px rgba(255, 180, 60, .8)); }
.rv.flipped.r5 .back { filter: drop-shadow(0 0 10px rgba(255, 45, 122, .9)); }
.rv-sum { margin-top: 16px; text-align: center; }
.rv-sum .chips { justify-content: center; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.confetti i { position: absolute; top: -16px; width: 10px; height: 14px; border-radius: 3px; animation: conf 1.9s cubic-bezier(.2, .6, .4, 1) forwards; }
@keyframes conf { to { transform: translate(var(--dx), 108vh) rotate(var(--rot)); } }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 2px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(6, 1fr); }
.tabs[hidden] { display: none; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 0; background: none; padding: 4px 0; color: var(--soft); font-weight: 800; font-size: 12.5px; }
.tab .ib { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; }
.tab[aria-current="page"] { color: var(--grape); }
.tab[aria-current="page"] .ib { background: var(--grape-tint); }
.badge { position: absolute; top: 0; left: calc(50% + 10px); min-width: 19px; height: 19px; border-radius: 10px; background: var(--tomato); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; padding: 0 5px; }
.badge[hidden] { display: none; }

/* toast */
.toast-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; justify-content: center; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.toast { max-width: 420px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 15px; line-height: 1.35; padding: 12px 16px; border-radius: 16px; box-shadow: 0 10px 30px var(--shadow); animation: toast-in .25s cubic-bezier(.2, .9, .3, 1.3) both; }
.toast[hidden] { display: none; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }

/* coin tokens */
.tok { display: block; flex: none; }
.tok-my { filter: drop-shadow(0 0 3px rgba(255, 45, 122, .55)); }

/* avatar motion */
.av .av-all, .av .av-jelly, .av .av-arm, .av .av-shadow, .av .av-fx { transform-box: view-box; }
.av .av-jelly { transform-origin: 100px 232px; animation: av-jelly 2.6s ease-in-out infinite; }
.av .av-arm-l { transform-origin: 62px 128px; animation: av-sway-l 2.6s ease-in-out infinite; }
.av .av-arm-r { transform-origin: 138px 128px; animation: av-sway-r 2.6s ease-in-out infinite; }
.av .av-all { transform-origin: 100px 232px; }
.av .av-shadow { transform-origin: 100px 234px; }
.av .av-fx { opacity: 0; transform-origin: 100px 110px; }
.av.still .av-jelly, .av.still .av-arm { animation: none; }
@keyframes av-jelly { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.022, .978); } }
@keyframes av-sway-l { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }
@keyframes av-sway-r { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }

.av.emote-wave .av-arm-r { animation: em-wave 1.8s ease-in-out; }
@keyframes em-wave { 0% { transform: rotate(0); } 18% { transform: rotate(-150deg); } 32% { transform: rotate(-118deg); } 46% { transform: rotate(-150deg); } 60% { transform: rotate(-118deg); } 74% { transform: rotate(-150deg); } 100% { transform: rotate(0); } }
.av.emote-hop .av-all { animation: em-hop 1.2s cubic-bezier(.3, .7, .4, 1); }
.av.emote-hop .av-shadow { animation: em-hop-sh 1.2s cubic-bezier(.3, .7, .4, 1); }
@keyframes em-hop { 0% { transform: translateY(0) scale(1, 1); } 14% { transform: translateY(0) scale(1.1, .88); } 34% { transform: translateY(-56px) scale(.94, 1.08); } 54% { transform: translateY(0) scale(1.12, .86); } 70% { transform: translateY(-24px) scale(.97, 1.04); } 86% { transform: translateY(0) scale(1.05, .95); } 100% { transform: translateY(0) scale(1, 1); } }
@keyframes em-hop-sh { 0%, 14%, 54%, 86%, 100% { transform: scale(1); opacity: 1; } 34% { transform: scale(.55); opacity: .5; } 70% { transform: scale(.8); opacity: .8; } }
.av.emote-wiggle .av-all { animation: em-wiggle 1.6s ease-in-out; }
.av.emote-wiggle .av-arm-l { animation: em-flail-l .4s ease-in-out 4; }
.av.emote-wiggle .av-arm-r { animation: em-flail-r .4s ease-in-out 4; }
@keyframes em-wiggle { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-9deg); } 35% { transform: rotate(9deg); } 55% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
@keyframes em-flail-l { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(40deg); } }
@keyframes em-flail-r { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-40deg); } }
.av.emote-spin .av-all { transform-origin: 100px 130px; animation: em-spin 1.2s ease-in-out; }
@keyframes em-spin { 0% { transform: scale(1, 1); } 25% { transform: scale(.08, 1.02); } 50% { transform: scale(-1, 1); } 75% { transform: scale(.08, 1.02); } 100% { transform: scale(1, 1); } }
.av.emote-flex .av-arm-l { animation: em-flex-l 1.8s ease-in-out; }
.av.emote-flex .av-arm-r { animation: em-flex-r 1.8s ease-in-out; }
.av.emote-flex .av-jelly { animation: em-pump 1.8s ease-in-out; }
@keyframes em-flex-l { 0%, 100% { transform: rotate(0); } 20%, 50%, 80% { transform: rotate(118deg); } 35%, 65% { transform: rotate(102deg); } }
@keyframes em-flex-r { 0%, 100% { transform: rotate(0); } 20%, 50%, 80% { transform: rotate(-118deg); } 35%, 65% { transform: rotate(-102deg); } }
@keyframes em-pump { 0%, 100% { transform: scale(1, 1); } 25%, 50%, 75% { transform: scale(1.07, .95); } 37%, 62% { transform: scale(.98, 1.03); } }
.av.emote-splat .av-all { animation: em-splat 2.2s cubic-bezier(.3, .7, .3, 1); }
@keyframes em-splat { 0% { transform: translateY(0) scale(1, 1); } 18% { transform: translateY(-40px) scale(.9, 1.12); } 34% { transform: translateY(0) scale(1.55, .32); } 62% { transform: translateY(0) scale(1.5, .34); } 78% { transform: translateY(-14px) scale(.86, 1.18); } 90% { transform: translateY(0) scale(1.06, .95); } 100% { transform: translateY(0) scale(1, 1); } }
.av.emote-dance .av-all { animation: em-dance 2.4s ease-in-out; }
.av.emote-dance .av-arm-l { animation: em-dance-l .6s ease-in-out 4; }
.av.emote-dance .av-arm-r { animation: em-dance-r .6s ease-in-out 4; }
.av.emote-dance .av-fx { animation: em-fx 2.4s ease-out; }
@keyframes em-dance { 0%, 25%, 50%, 75%, 100% { transform: translateY(0) rotate(0); } 12.5%, 62.5% { transform: translateY(-16px) rotate(-6deg); } 37.5%, 87.5% { transform: translateY(-16px) rotate(6deg); } }
@keyframes em-dance-l { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(130deg); } }
@keyframes em-dance-r { 0%, 100% { transform: rotate(-130deg); } 50% { transform: rotate(0); } }
@keyframes em-fx { 0% { opacity: 0; transform: scale(.6) rotate(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.2) rotate(40deg); } }

/* item effects */
.fx-twinkle { transform-box: fill-box; transform-origin: center; animation: fx-tw 1.8s ease-in-out infinite; }
@keyframes fx-tw { 0%, 100% { opacity: .3; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
.fx-flicker { transform-box: fill-box; transform-origin: 50% 100%; animation: fx-fl .5s ease-in-out infinite alternate; }
@keyframes fx-fl { from { transform: scaleY(1); } to { transform: scale(.98, 1.07); } }
.fx-jet { transform-box: fill-box; transform-origin: 50% 0%; animation: fx-jt .18s linear infinite alternate; }
@keyframes fx-jt { from { transform: scaleY(.82); opacity: .85; } to { transform: scaleY(1.1); opacity: 1; } }
.fx-pulse { animation: fx-pu 1.6s ease-in-out infinite; }
@keyframes fx-pu { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
.fx-float { animation: fx-fo 2.4s ease-in-out infinite; }
@keyframes fx-fo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.fx-scan { animation: fx-sc 1.6s ease-in-out infinite alternate; }
@keyframes fx-sc { from { transform: translateX(0); } to { transform: translateX(54px); } }
.fx-wing-l { transform-box: view-box; transform-origin: 64px 128px; animation: fx-wl 1.8s ease-in-out infinite; }
.fx-wing-r { transform-box: view-box; transform-origin: 136px 128px; animation: fx-wr 1.8s ease-in-out infinite; }
@keyframes fx-wl { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
@keyframes fx-wr { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }

/* ===== sleek theme ===== */
.av.big { filter: drop-shadow(0 20px 18px rgba(21,23,28,.22)); }
body { font: 400 16px/1.45 var(--font); letter-spacing: -0.005em; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 18px; font-weight: 700; margin: 28px 0 10px; letter-spacing: -0.01em; }
h3 { font-size: 15px; font-weight: 700; }
b, strong { font-weight: 600; }
.card { border: 1px solid var(--line); border-radius: 20px; }
.link { color: var(--grape); font-weight: 600; text-decoration: none; }
.btn { border-radius: 14px; height: 48px; font: 600 16px/1 var(--font); margin-bottom: 0; box-shadow: none !important; transition: transform .08s ease, background-color .15s ease; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-grape { background: var(--ink); color: var(--bg); }
.btn-lime { background: var(--grape); color: #fff; }
.btn-ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
.btn-danger { background: var(--tomato); color: #fff; }
.btn-sm { height: 38px; font-size: 14.5px; border-radius: 11px; }
.row2 { gap: 8px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); }
.icon-btn .ic { width: 20px; height: 20px; }
.me-chip { border: 0; background: none; padding: 0; font-weight: 600; gap: 10px; }
input[type="text"], input[type="tel"], input[type="password"] { height: 48px; border-radius: 12px; border: 1px solid var(--line); font-weight: 500; font-size: 16px; }
input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--grape-tint); }
.field > label, .field > .label { font-weight: 600; font-size: 14px; color: var(--soft); }
.err { font-weight: 600; }
.odds, .odds div, .tbl, .tbl div, .step { border-width: 1px; }
.odds div, .tbl div { font-weight: 500; }
.ev { border-bottom: 1px solid var(--line); }
.ev .t { font-weight: 500; }
.ev .t b { font-weight: 600; }
.ev.hot { background: linear-gradient(90deg, var(--grape-tint), transparent 70%); }
.cc, .it-tag { background: var(--card-2); font-weight: 600; }
.banner { border: 1px solid var(--line); border-radius: 16px; font-weight: 500; }
.banner.gift { background: var(--grape-tint); border-color: transparent; }
.banner .pill { box-shadow: none; background: var(--grape); color: #fff; font-weight: 600; border-radius: 10px; }
.cat, .echip, .qchip { border: 1px solid var(--line); font-weight: 600; }
.cat.on, .echip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.scard { border: 1px solid var(--line); border-radius: 18px; }
.rb0, .rb1, .rb2, .rb3, .rb4 { border-width: 1px; }
.rb5 { border: 1px solid var(--rb5); background: var(--card); }
.scard .thumb { border-radius: 12px; }
.scard .nm, .scard .pr { font-weight: 600; }
.scard .own { background: var(--ink); color: var(--bg); font-weight: 600; }
.play { background: var(--ink); color: var(--bg); }
.wchip, .ichip, .opt { border: 1px solid var(--line); font-weight: 500; }
.wchip.on, .opt.on, .ichip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); background: var(--card); }
.sw.on { box-shadow: 0 0 0 3px var(--ink); }
.sheet { border-radius: 24px 24px 0 0; }
.sheet-head h2 { font-size: 22px; font-weight: 700; }
.x { border: 1px solid var(--line); border-radius: 12px; }
.sb, .sv { border: 1px solid var(--line); }
.sv { font: 600 18px/1 var(--font); }
.sb { font-weight: 500; }
.step { border-bottom: 1px solid var(--line); }
.step .sn { font-weight: 600; }
.picked { border: 1px solid var(--ink); }
.side-card, .dm-row { border: 1px solid var(--line); }
.offer-cols .lbl, .status { font-weight: 600; }
.status.done { background: #E3F4EC; color: #147A52; }
.bub.them { border: 1px solid var(--line); }
.bub.me { background: var(--ink); color: var(--bg); }
.price-row { font-weight: 700; }
.tabs { background: color-mix(in srgb, var(--card) 92%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-top: 8px; }
.tab { font-weight: 500; font-size: 11.5px; gap: 2px; }
.tab .ib { width: auto; height: 26px; background: none !important; }
.tab .ic { width: 22px; height: 22px; stroke-width: 1.75; }
.tab[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -8px; left: 50%; width: 22px; margin-left: -11px; height: 2px; border-radius: 2px; background: var(--ink); }
.badge { font-weight: 700; }
.toast { font-weight: 500; border-radius: 14px; }
.ic { stroke-width: 1.85; }

/* wallet */
.w-lab { font-size: 14px; color: var(--soft); margin-top: 10px; }
.w-big { font-size: 64px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.w-big small { font-size: 20px; font-weight: 500; letter-spacing: 0; color: var(--soft); margin-left: 6px; }
.spec { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin-top: 18px; background: var(--line); }
.leg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; margin-top: 14px; }
.leg div { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.leg span { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 13px; color: var(--soft); }
.leg b { color: var(--ink); font-weight: 600; font-size: 17px; padding-left: 15px; font-variant-numeric: tabular-nums; }
.rdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.w-note { font-size: 13.5px; color: var(--soft); margin-top: 12px; }
.acts { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 8px; margin-top: 20px; }
.acts .btn { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 8px; font-size: 15px; }
.acts .btn .ic { width: 18px; height: 18px; }
.lpanel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; margin-top: 16px; overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; background: none; border: 0; border-radius: 0; color: var(--ink); font: inherit; text-decoration: none; }
.lrow + .lrow { border-top: 1px solid var(--line); }
.lrow .sq { width: 38px; height: 38px; border-radius: 11px; background: var(--card-2); display: grid; place-items: center; flex: none; }
.lrow .sq .ic { width: 20px; height: 20px; }
.lrow .lt { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; }
.lrow .lt b { display: block; font-weight: 600; font-size: 15.5px; }
.lrow .lt span { display: block; font-size: 13px; color: var(--soft); }
.chipbtn { flex: none; font-size: 13.5px; font-weight: 600; padding: 8px 12px; border-radius: 10px; background: var(--card-2); color: var(--ink); border: 0; }
.chipbtn.go { background: var(--grape); color: #fff; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 3px; margin: -4px 0 10px; }

    }
    const lq = q.replace(/^@/, '').toLowerCase();
    if (!lq) return [];
    const starts = others.filter(u => (players[u].uname || '').startsWith(lq));
    const inc = others.filter(u => !(players[u].uname || '').startsWith(lq) && (players[u].uname || '').includes(lq));
    return starts.concat(inc).slice(0, 6).map(u => ({ u }));
  }

      case 'auth/invalid-credential': case 'auth/invalid-login-credentials': case 'auth/wrong-password': case 'auth/user-not-found': return 'That username and password don’t match.';
      case 'auth/too-many-requests': return 'Too many tries. Wait a minute, then try again.';
      case 'auth/network-request-failed': return 'No connection. Check your internet and try again.';

  const FARM_PRIZES = [25];
  const prizeKeys = new Set();
  function payPrizes() {
    if (!FARM_LIVE || !L || !meDoc || !config || uid !== L.issuer || readOnly) return;
    const mine = myEntries();
    let pool = availOf(uid);
    for (const rid of Object.keys(farmResults)) {
      const r = farmResults[rid];
      if (!r || r.by !== uid || !Array.isArray(r.places)) continue;
      r.places.slice(0, FARM_PRIZES.length).forEach((winner, i) => {
        const key = rid + ':' + i;
        if (prizeKeys.has(key) || mine.some(e => e.pz === key)) return;
        if (!winner || winner === uid || !players[winner]) { prizeKeys.add(key); return; }
        if (sumC(pool) < FARM_PRIZES[i]) return;
        prizeKeys.add(key);
        const c = drawRandom(FARM_PRIZES[i], pool);
        pool = pool.map((n, k) => n - c[k]);
        newEntry('send', { to: winner, c, n: `Scobb Farm round ${r.n || ''} prize, ${['1st', '2nd', '3rd'][i]} place`, pz: key });
        toast(`Paid ${nameOf(winner)} ${bucks(FARM_PRIZES[i])} for Scobb Farm`);
      });
    }
  }
  function drawRandom(n, pool) {
    const p = pool.slice(), out = z();
    for (let k = 0; k < n; k++) {
      const tot = sumC(p);
      if (!tot) break;
      let x = Math.random() * tot;
      for (let r = 0; r < 6; r++) { if (x < p[r]) { out[r]++; p[r]--; break; } x -= p[r]; }
    }
    return out;
  }

  /* ---- direct messages ---- */
  let dmFrom = {}, dmTo = {}, dmKnown = null, lastDmT = 0;
  const dmPending = new Map();
  const msgTime = x => (x.st && typeof x.st.toMillis === 'function' ? x.st.toMillis() : (typeof x.ct === 'number' ? x.ct : 0));
  function onDmSnap(which, qs) {
    const next = {};
    qs.forEach(d => {
      const x = d.data({ serverTimestamps: 'estimate' });
      if (!x || typeof x.text !== 'string' || typeof x.a !== 'string' || typeof x.to !== 'string') return;
      next[d.id] = { id: d.id, a: x.a, to: x.to, text: x.text.slice(0, 500), t: msgTime(x) };

  function onDmError(err) { if (err && err.code === 'permission-denied') { ui.dmBlocked = true; recompute(); } }
  function threads() {
    const all = Object.assign({}, dmFrom, dmTo);
    for (const [id, m] of dmPending) if (!all[id]) all[id] = m;
    const by = {};
    for (const m of Object.values(all)) {
      const other = m.a === uid ? m.to : m.a;
      if (!other || other === uid) continue;
      (by[other] = by[other] || []).push(m);
    }
    for (const k in by) by[k].sort((x, y) => x.t - y.t || (x.id < y.id ? -1 : 1));
    return by;
  }
  const dmReadOf = u => (priv.dmRead && priv.dmRead[u]) || 0;
  const unreadFrom = (u, list) => list.filter(m => m.a === u && m.t > dmReadOf(u)).length;
  function unreadDMs() { const th = threads(); let n = 0; for (const u in th) n += unreadFrom(u, th[u]); return n; }
  function markRead(u, list) {
    if (!privLoaded) return;
    const last = list.filter(m => m.a === u).reduce((mx, m) => Math.max(mx, m.t), 0);
    if (last > dmReadOf(u)) { priv.dmRead = Object.assign({}, priv.dmRead || {}, { [u]: last }); savePriv(); }
  }
  function sendDM(to, text) {
    text = String(text || '').trim().slice(0, 500);
    if (!text || !to || to === uid || !players[to] || !guardWrite()) return false;
    const i = rid(), id = uid + '_' + i, ct = Math.max(Date.now(), lastDmT + 1);
    lastDmT = ct;
    dmPending.set(id, { id, a: uid, to, text, t: ct, pending: true });

  function chatsTab() {

    if (friends.length) h += `<h3 style="margin-top:0">Start a chat</h3><div class="hscroll">${friends.map(u => `<button type="button" class="dm-pick" data-act="dm-open" data-u="${esc(u)}">${headBubble(u, 50)}<span>${esc(nameOf(u))}</span></button>`).join('')}</div>`;

    else if (friends.length) h += `<p class="small soft mt">No messages yet. Tap a friend to say hi.</p>`;

  function chatView(u) {
    const list = threads()[u] || [];
    markRead(u, list);
    let h = `<header class="top"><button type="button" class="icon-btn" data-act="dm-back" aria-label="Back to chats" style="font-size:26px;font-weight:800">‹</button><button type="button" class="me-chip" data-act="profile" data-u="${esc(u)}" style="flex:1">${headBubble(u, 36)}<span>${esc(nameOf(u))}</span></button></header>`;
    h += `<div class="dm-thread">`;
    if (!list.length) h += `<p class="small soft" style="text-align:center;margin-top:24px">This is the start of your chat with ${esc(nameOf(u))}. Only the two of you can see it.</p>`;
    let prev = 0;
    for (const m of list) {
      if (m.t - prev > 15 * 60000) h += `<p class="dm-time">${dmStamp(m.t)}</p>`;
      prev = m.t;
      h += `<div class="bub ${m.a === uid ? 'me' : 'them'}${m.pending ? ' pend' : ''}">${esc(m.text)}</div>`;
    }
    h += `</div><div class="dm-compose"><input id="dm-input" type="text" maxlength="500" placeholder="Message ${esc(nameOf(u))}" autocomplete="off" enterkeyhint="send" aria-label="Message ${esc(nameOf(u))}"><button type="button" class="btn btn-grape" data-act="dm-send">Send</button></div>`;
    return h;
  }
  document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.target && e.target.id === 'dm-input') { e.preventDefault(); doSendDM(); } });

  /* ---- wallet ---- */
  function walletTab() {
    const bal = balOf(uid), res = reservedOf(uid).c;
    const owner = uid === L.issuer;
    const supply = sumC(L.total);
    const out = supply - sumC(balOf(L.issuer));
    const un = unopened();
    const inc = incomingOpen();
    const tot = sumC(bal);
    let h = `<header class="top"><button type="button" class="me-chip" data-act="tab" data-tab="closet" aria-label="Open your closet">${headBubble(uid, 38)}<span>@${esc(meDoc.username)}</span></button><span class="top-right">${farmVisible() ? `<a class="icon-btn" href="./farm.html" aria-label="Play Scobb Farm">${icon('sprout')}</a>` : ''}<button type="button" class="icon-btn" data-act="settings" aria-label="Settings">${icon('gear')}</button></span></header>`;
    h += `<p class="w-lab">${owner ? 'In your vault' : 'Your ScobbBucks'}</p><div class="w-big">${fmtInt(tot)}<small>${tot === 1 ? 'coin' : 'coins'}</small></div>`;

    if (sumC(res)) h += `<p class="w-note">${plural(sumC(res), 'coin is', 'coins are')} held for your open trade offers.</p>`;
    if (owner) h += `<p class="w-note">You’re the bank. ${fmtInt(out)} of ${fmtInt(supply)} are out with friends.</p>`;
    else if (tot === 0) h += `<p class="w-note">Ask ${esc(nameOf(L.issuer))}, the bank, to send you some ScobbBucks.</p>`;
    h += `<div class="acts"><button type="button" class="btn btn-grape" data-act="send">${icon('send')}Send</button><button type="button" class="btn btn-ghost" data-act="new-trade">${icon('trades')}Trade</button>${owner ? `<button type="button" class="btn btn-ghost" data-act="mint-more">${icon('plus')}Mint</button>` : `<button type="button" class="btn btn-ghost" data-act="swap">${icon('up')}Upgrade</button>`}</div>`;
    if (un.count) {
      const from = [...new Set(un.list.map(ev => ev.a))].map(nameOf);
      h += `<button type="button" class="banner gift" data-act="reveal">${icon('gift')}<span class="bt">You got ${bucks(un.count)} from ${esc(joinWords(from))}</span><span class="pill">Open</span></button>`;
    }
    if (inc.length) h += `<button type="button" class="banner" data-act="tab" data-tab="trades">${headBubble(inc[0].from, 34)}<span class="bt">${inc.length === 1 ? `${esc(nameOf(inc[0].from))} sent you a trade offer` : `${inc.length} trade offers are waiting on you`}</span><span class="pill">View</span></button>`;
    h += `<div class="lpanel">${owner ? '' : pressRow()}${arcadeRow()}${casinoRow()}${farmVisible() ? `<a class="lrow" href="./farm.html"><span class="sq">${icon('sprout')}</span><span class="lt"><b>Scobb Farm</b><span>${FARM_LIVE ? 'Build, raid and win 25 ScobbBucks' : 'Build a farm and raid your friends. In preview.'}</span></span><span class="chipbtn">Play</span></a>` : ''}</div>`;
    h += `<h2>Activity</h2>${activityHTML()}`;
    return h;
  }
  function pressRow() {
    const pr = L.press[uid];
    const sq = `<span class="sq">${icon('press')}</span>`;
    if (!pr) {
      if (!L.funded[uid]) return `<div class="lrow">${sq}<span class="lt"><b>Coin press</b><span>Unlocks after your first ScobbBucks from the bank</span></span></div>`;
      return `<div class="lrow">${sq}<button type="button" class="lt" data-act="press-open"><b>Coin press</b><span>Makes ${PRESS[0].rate} coins a day for you</span></button><button type="button" class="chipbtn go" data-act="press-start"${readOnly ? ' disabled' : ''}>Start</button></div>`;
    }
    const lv = PRESS[pr.lvl - 1], have = pressAt(pr, Date.now()), whole = Math.floor(have + 1e-9), full = have >= lv.cap - 1e-9;
    const nextIn = full ? 0 : Math.ceil((1 - (have % 1)) * DAY / lv.rate);
    const sub = full ? 'Full. Collect so it keeps going' : `${fmtInt(whole)} ready. Next in ${pressWait(nextIn)}`;
    return `<div class="lrow">${sq}<button type="button" class="lt" data-act="press-open"><b>Coin press</b><span>${sub}</span></button>${whole >= 1 ? `<button type="button" class="chipbtn go" data-act="press-claim"${readOnly ? ' disabled' : ''}>Collect</button>` : `<button type="button" class="chipbtn" data-act="press-open">Level ${pr.lvl}</button>`}</div>`;
  }
  function arcadeRow() {
    const owner = uid === L.issuer, st = arcState();

    return `<button type="button" class="lrow" data-act="tab" data-tab="arcade"><span class="sq">${icon('game')}</span><span class="lt"><b>Arcade</b><span>${sub}</span></span><span class="chipbtn${st.active && !owner ? ' go' : ''}">${st.active && !owner ? 'Resume' : 'Play'}</span></button>`;

  function openPress() {
    const draw = () => { $('#sheet-body').innerHTML = sheetHead('Coin press', 'Makes ScobbBucks for you while you’re away') + pressCard(); };

  function evCoins(c) { return `<div class="chips">${coinChips(c)}</div>`; }
  function itemTags(list, owner) { return list.map(it => CAT[it] ? `<span class="it-tag"><span class="tb">${thumbSVG(it, lookOf(owner))}</span>${esc(CAT[it].name)}</span>` : '').join(''); }

  function activityHTML() {
    const seen = new Set(priv.seen || []);
    const rows = [];
    for (const ev of L.events) {
      if (ev.k === 'send' && (ev.a === uid || ev.to === uid)) rows.push(ev);
      else if (ev.k === 'buy' && ev.a === uid) rows.push(ev);
      else if (ev.k === 'trade' && (ev.a === uid || ev.to === uid)) rows.push(ev);
      else if (ev.k === 'mint' && ev.a === uid) rows.push(ev);
      else if (ev.k === 'swap' && ev.a === uid) rows.push(ev);
      else if (ev.k === 'press' && ev.a === uid && ev.op !== 'start') rows.push(ev);
      else if (ev.k === 'arc' && ev.a === uid) rows.push(ev);
      else if (ev.k === 'cas' && ev.a === uid) rows.push(ev);
    }
    for (const e of myEntries()) { const key = uid + ':' + e.i; if (L.bad[key] && (e.k === 'send' || e.k === 'buy' || e.k === 'swap')) rows.push({ k: 'bad', e, t: e.t }); }
    rows.sort((a, b) => b.t - a.t);
    if (!rows.length) return `<p class="empty">Nothing here yet. Coins you send and get will show up here.</p>`;
    return `<div class="list">${rows.slice(0, 40).map(ev => {
      let other = ev.a === uid ? ev.to : ev.a, t = '', more = '';
      if (ev.k === 'send' && ev.a === uid) { t = `You sent <b>${esc(nameOf(ev.to))}</b> ${bucks(sumC(ev.c))}`; more = evCoins(ev.c); }
      else if (ev.k === 'send') { t = `<b>${esc(nameOf(ev.a))}</b> sent you ${bucks(sumC(ev.c))}`; more = seen.has(ev.key) ? evCoins(ev.c) : '<p class="s">Open it on your wallet to see what you got.</p>'; }
      else if (ev.k === 'buy') { other = uid; t = `You bought the <b>${esc(CAT[ev.it].name)}</b>`; more = `<div class="chips">${coinChips(priceOf(CAT[ev.it]))}</div>`; }
      else if (ev.k === 'trade') {
        const mineGive = ev.a === uid ? { c: ev.gc, i: ev.gi } : { c: ev.wc, i: ev.wi };
        const mineGet = ev.a === uid ? { c: ev.wc, i: ev.wi } : { c: ev.gc, i: ev.gi };
        t = `You traded with <b>${esc(nameOf(other))}</b>`;
        more = `<p class="s">You gave</p><div class="chips">${coinChips(mineGive.c)}${itemTags(mineGive.i, other)}</div><p class="s" style="margin-top:4px">You got</p><div class="chips">${coinChips(mineGet.c)}${itemTags(mineGet.i, uid)}</div>`;
      } else if (ev.k === 'mint') {
        other = uid;
        t = `You minted ${bucks(sumC(ev.c))}`;
        more = evCoins(ev.c);
      } else if (ev.k === 'cas') {
        other = uid;
        t = `${CAS_GAMES[ev.g].name}: ${ev.ret > ev.bet ? `you won ${coinsAmt(ev.r, ev.ret - ev.bet)}` : ev.ret === ev.bet ? 'you broke even' : `you lost ${coinsAmt(ev.r, ev.bet - ev.ret)}`}`;
        more = `<p class="s">You bet ${coinsAmt(ev.r, ev.bet)}.</p>`;
      } else if (ev.k === 'arc') {
        other = uid;
        t = `You beat ${ARC_NAME[ev.g][1]} and won ${bucks(sumC(ev.c))}`;
        more = evCoins(ev.c);
      } else if (ev.k === 'press') {
        other = uid;
        t = ev.op === 'claim' ? `Your coin press made you ${bucks(sumC(ev.c))}` : `You upgraded your coin press to level ${ev.lvl}`;
        more = ev.op === 'claim' ? evCoins(ev.c) : `<div class="chips">${coinChips(PRESS[ev.lvl - 1].cost)}</div>`;
      } else if (ev.k === 'swap') {
        other = uid;
        t = `You upgraded ${fmtInt(SWAP[ev.r] * ev.n)} ${RN[ev.r]} into ${fmtInt(ev.n)} ${RN[ev.r + 1]}`;
        const g = z(), w = z(); g[ev.r] = SWAP[ev.r] * ev.n; w[ev.r + 1] = ev.n;
        more = `<p class="s">You gave</p><div class="chips">${coinChips(g)}</div><p class="s" style="margin-top:4px">You got</p><div class="chips">${coinChips(w)}</div>`;
      } else if (ev.k === 'bad') {
        other = ev.e.to || uid;
        const why = L.bad[uid + ':' + ev.e.i];
        t = ev.e.k === 'send' ? `Your send to <b>${esc(nameOf(ev.e.to))}</b> didn’t go through` : ev.e.k === 'swap' ? 'Your coin upgrade didn’t go through' : `Your ${esc((CAT[ev.e.it] || { name: 'item' }).name)} purchase didn’t go through`;
        more = `<p class="s">${why === 'gone' ? 'That item had already left the shop, so nothing moved.' : why === 'vault' ? 'The bank’s vault ran out of that rarity, so nothing moved.' : 'You didn’t have enough coins when it reached everyone, so nothing moved.'}</p>`;
      }
      const note = ev.n ? `<p class="note">“${esc(ev.n)}”</p>` : '';
      return `<div class="ev">${headBubble(other, 40)}<div class="main"><div class="t">${t}</div>${note}${more}</div><span class="when">${ago(ev.t)}</span></div>`;
    }).join('')}</div>`;
  }

  /* ---- shop ---- */
  function shopTab() {

  /* ---- closet ---- */
  function uniqueItems(list) { const seen = new Map(); for (const x of list) { if (!seen.has(x.it)) seen.set(x.it, Object.assign({ count: 0 }, x)); seen.get(x.it).count++; } return [...seen.values()]; }
  function closetTab() {
    const eq = equipIds(uid);
    const mine = itemsOf(uid);

    if (emotes.length === 1) h += `<p class="small soft">More emotes are in the shop.</p>`;

  /* ---- trades ---- */
  function sideHTML(c, items, owner) {
    const parts = coinChips(c) + itemTags(items.map(id => (L.items[id] ? L.items[id].it : null)).filter(Boolean), owner);
    return parts ? `<div class="chips">${parts}</div>` : '<p class="small soft">Nothing</p>';
  }
  function offerProblem(o) {
    const fromBal = balOf(o.from), toAv = availOf(o.to);
    if (!o.gc.every((n, r) => fromBal[r] >= n)) return `${nameOf(o.from)} doesn’t have those coins anymore.`;
    if (!o.gi.every(id => validInst(o.from, id))) return `${nameOf(o.from)} doesn’t have those items anymore.`;
    if (o.to === uid) {
      const bal = balOf(uid);
      if (!o.wc.every((n, r) => bal[r] >= n)) return 'You don’t have the coins they asked for.';
      if (!o.wc.every((n, r) => toAv[r] >= n)) return 'Some of those coins are held for your other offers. Cancel one first.';
      if (!o.wi.every(id => validInst(uid, id))) return 'You don’t have the items they asked for anymore.';
    }
    return '';
  }
  function offerCard(o) {
    const incoming = o.to === uid;
    const other = incoming ? o.from : o.to;
    const give = incoming ? sideHTML(o.wc, o.wi, uid) : sideHTML(o.gc, o.gi, uid);
    const get = incoming ? sideHTML(o.gc, o.gi, other) : sideHTML(o.wc, o.wi, other);
    const stat = { done: 'Traded', declined: 'Declined', cancelled: 'Cancelled', failed: 'Didn’t go through' }[o.status];
    const head = o.status === 'open' ? (incoming ? `<b>${esc(nameOf(other))}</b> wants to trade` : `Waiting on <b>${esc(nameOf(other))}</b>`) : `Trade with <b>${esc(nameOf(other))}</b>`;
    const prob = o.status === 'open' ? offerProblem(o) : '';
    let btns = '';
    if (o.status === 'open' && !readOnly) {
      btns = incoming
        ? `<div class="row2"><button type="button" class="btn btn-ghost" data-act="decline" data-o="${esc(o.key)}">Decline</button><button type="button" class="btn btn-lime" data-act="accept" data-o="${esc(o.key)}"${prob ? ' disabled' : ''}>Accept</button></div>`
        : `<div class="row2" style="grid-template-columns:1fr"><button type="button" class="btn btn-ghost" data-act="cancel" data-o="${esc(o.key)}">Cancel offer</button></div>`;
    }
    return `<div class="card offer"><div class="offer-head">${headBubble(other, 38)}<span class="bt">${head}</span>${stat ? `<span class="status${o.status === 'done' ? ' done' : ''}">${stat}</span>` : `<span class="small soft">${ago(o.t)}</span>`}</div>
      <div class="offer-cols"><div><div class="lbl">You give</div>${give}</div><div><div class="lbl">You get</div>${get}</div></div>
      ${o.n ? `<p class="note">“${esc(o.n)}”</p>` : ''}${prob ? `<p class="warn">${esc(prob)}</p>` : ''}${o.status === 'failed' ? '<p class="small soft" style="margin-top:8px">Someone was missing coins or items when it was accepted, so nothing moved.</p>' : ''}${btns}</div>`;
  }
  function tradesTab() {
    const all = Object.values(L.offers).filter(o => o.from === uid || o.to === uid);
    const inc = all.filter(o => o.status === 'open' && o.to === uid).sort((a, b) => b.t - a.t);
    const out = all.filter(o => o.status === 'open' && o.from === uid).sort((a, b) => b.t - a.t);
    const done = all.filter(o => o.status !== 'open').sort((a, b) => b.end - a.end).slice(0, 20);
    let h = `<header class="top"><h1>Trades</h1><button type="button" class="btn btn-grape btn-sm" data-act="new-trade">New trade</button></header>`;
    h += `<p class="small soft">Swap coins for better rarities, or trade coins and items with anyone by username or phone number.</p>`;
    h += `<h2>Waiting on you</h2>${inc.length ? inc.map(offerCard).join('') : '<p class="empty">No offers right now.</p>'}`;
    h += `<h2>Waiting on them</h2>${out.length ? out.map(offerCard).join('') : '<p class="empty">You haven’t sent any offers.</p>'}`;
    if (done.length) h += `<h2>Finished</h2>${done.map(offerCard).join('')}`;
    return h;
  }

  /* ---- feed ---- */
  function feedTab() {
    const seen = new Set(priv.seen || []);
    const list = Object.keys(players).filter(u => players[u] && players[u].username && players[u].avatar).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
    let h = `<header class="top"><h1>Feed</h1></header>`;
    h += `<h3 style="margin-top:0">Players</h3><div class="hscroll players">${list.map(u => `<button type="button" class="pl" data-act="profile" data-u="${esc(u)}">${headBubble(u, 58)}<span>${esc(nameOf(u))}</span></button>`).join('')}</div>`;
    const evs = L.events.filter(ev => (ev.k !== 'press' || ev.op === 'up' || (ev.op === 'claim' && (ev.c[4] || ev.c[5]))) ).sort((a, b) => b.t - a.t).slice(0, 100);
    if (!evs.length) return h + '<p class="empty">Nothing has happened yet. Sends, trades and shop buys show up here.</p>';

      h += `<div class="felt"><div class="dealer"><span class="small">Dealer${reveal ? ` · ${bjVal(T.dealer)}` : ''}</span><div class="hand">${T.dealer.map(c => pcard(c)).join('')}${reveal ? '' : pcard(null, true)}</div></div><div class="seats">`;
      for (const s of T.seats) {
        const v = bjVal(s.cards), mine = s.u === uid;
        const st = T.phase === 'done' ? (s.out === 'win' ? 'Won' : s.out === 'push' ? 'Push' : 'Lost') : v > 21 ? 'Bust' : s.done ? (bjNatural(s.cards) ? 'Blackjack!' : 'Stands') : mine ? 'Your move' : 'Thinking';
        h += `<div class="seat${mine ? ' me' : ''}"><span class="small">${esc(casName(s.u))}${mine ? ' (you)' : ''} · ${v}</span><div class="hand">${s.cards.map(c => pcard(c)).join('')}</div><span class="tag-s ${T.phase === 'done' ? s.out : ''}">${st}</span></div>`;
      }
      h += `</div></div>`;
      if (me && T.phase === 'play' && !me.done) h += `<div class="acts" style="grid-template-columns:1fr 1fr 1fr"><button type="button" class="btn btn-grape" data-act="cas-act" data-op="hit"${casPending() ? ' disabled' : ''}>Hit</button><button type="button" class="btn btn-ghost" data-act="cas-act" data-op="stand"${casPending() ? ' disabled' : ''}>Stand</button><button type="button" class="btn btn-ghost" data-act="cas-act" data-op="double"${me.cards.length !== 2 || (!P && availOf(uid)[T.r] < T.n) || casPending() ? ' disabled' : ''}>Double</button></div>${P ? '' : '<p class="small soft mt">If you don’t move in time, you stand.</p>'}`;
    } else {
      const done = T.phase === 'done';
      const pot = T.seats.reduce((x, s) => x + s.in, 0);
      h += `<div class="felt"><div class="dealer"><span class="small">Board · Pot ${fmtInt(pot)} ${RN[T.r]}</span><div class="hand">${T.board.map(c => pcard(c)).join('')}${Array.from({ length: 5 - T.board.length }, () => pcard(null, true)).join('')}</div></div><div class="seats">`;
      for (const s of T.seats) {
        const mine = s.u === uid, show = mine || (done && !s.fold && T.board.length === 5);
        const st = s.fold ? 'Folded' : done ? (T.winners.includes(s.u) ? `Won ${fmtInt(s.ret)}` : 'Lost') : s.acted ? 'Called' : s.cpu ? 'Thinking' : mine ? 'Your move' : 'Deciding';
        const hand = done && !s.fold && T.board.length === 5 ? PK_NAMES[pkCat(best7(s.hole.concat(T.board)))] : '';
        h += `<div class="seat${mine ? ' me' : ''}${s.fold ? ' out' : ''}"><span class="small">${esc(casName(s.u))}${mine ? ' (you)' : ''}</span><div class="hand">${s.hole.map(c => pcard(c, !show)).join('')}</div><span class="tag-s ${done && T.winners.includes(s.u) ? 'win' : ''}">${st}${hand ? ` · ${hand}` : ''}</span></div>`;
      }
      h += `</div></div>`;
      if (done && T.board.length < 5 && T.seats.filter(x => !x.fold).length === 1) h += `<p class="small soft mt" style="text-align:center">Everyone else folded, so ${esc(casName(T.seats.find(x => !x.fold).u))} took the pot without a showdown.</p>`;
      if (me && (T.phase === 'pre' || T.phase === 'flop') && !me.fold && !me.acted) h += `<div class="row2"><button type="button" class="btn btn-grape" data-act="cas-act" data-op="call"${(!P && availOf(uid)[T.r] < T.n) || casPending() ? ' disabled' : ''}>Call ${casAmt(T.r, T.n, P)}</button><button type="button" class="btn btn-ghost" data-act="cas-act" data-op="fold"${casPending() ? ' disabled' : ''}>Fold</button></div><p class="small soft mt">${T.phase === 'pre' ? 'Calling puts in another bet and shows you the flop.' : 'Calling puts in one more bet and deals the turn and river.'} If you don’t move in time, you fold.</p>`;
      else if (me && !me.fold && !done) h += `<p class="small soft mt">Waiting for everyone else.</p>`;
    }
    if (T.phase === 'done' && me) {
      const d = (me.ret || 0) - (T.g === 'poker' ? me.in : me.bet);
      h += `<p class="cas-out ${d > 0 ? 'won' : ''}">${T.cancel ? 'Nobody could play, so you got your bet back.' : d > 0 ? `You won ${casAmt(T.r, d, P)}!` : d === 0 ? 'You broke even.' : `You lost ${casAmt(T.r, -d, P)}.`}${T.g === 'poker' && T.rake ? ` <span class="small soft">The house took ${fmtInt(T.rake)} in rake.</span>` : ''}</p><button type="button" class="btn btn-grape btn-block mt" data-act="cas-again" data-g="${T.g}">Play again</button>`;
    }
    return h;
  }

  /* ---- arcade ---- */

    else if (st.left.length) h += `<p>You get ${ARC_DAILY} crates a day. Each one picks a random minigame from the ${ARC_IDS.length} in the pool. Beat it to win ${ARC_PRIZE} ScobbBucks. You get ${ARC_HEARTS} hearts.</p><button type="button" class="btn btn-grape btn-block mt" data-act="arc-spin"${readOnly ? ' disabled' : ''}>Open a crate</button>`;

  function arcRoot() {
    let r = $('#arc-root');

  function arcOpen() { const r = arcRoot(); r.hidden = false; document.body.style.overflow = 'hidden'; return r; }
  function arcClose() { const r = arcRoot(); if (ui.arcRun && ui.arcRun.ctl) { const run = ui.arcRun; ui.arcRun = null; run.ctl.quit(); } r.hidden = true; r.innerHTML = ''; document.body.style.overflow = ''; render(); }
  async function arcSpin() {
    if (!guardWrite() || uid === L.issuer || !L.funded[uid]) return;
    const st = arcState();
    if (st.active || !st.left.length) return render();
    const mod = await loadArcade();
    if (!mod) return;
    const before = arcState();
    const e = newEntry('arc', { op: 'spin' });
    const key = uid + ':' + e.i, d = arcDay(e.t);
    const prior = ((L.arc[uid] && L.arc[uid].days[d]) || []).filter(s => s.key !== key);
    const g = arcPick(uid, d, prior);
    if (!g) return;
    const pool = before.left.length ? before.left : [g];
    const N = 50, WIN = 42, CW = 124;
    const strip = Array.from({ length: N }, (_, i) => (i === WIN ? g : pool[Math.floor(Math.random() * pool.length)]));
    const root = arcOpen();
    root.innerHTML = `<div class="crate"><h2 id="crate-h">Opening a crate…</h2><div class="crate-win"><div class="crate-strip">${strip.map(id => `<div class="crate-card">${arcIcon(id)}<b>${ARC_NAME[id][1]}</b></div>`).join('')}</div><i class="crate-mark" aria-hidden="true"></i></div><div id="crate-out" aria-live="polite"></div></div>`;
    const win = root.querySelector('.crate-win'), s = root.querySelector('.crate-strip');
    const target = WIN * CW + 58 - win.clientWidth / 2 + (Math.random() * 64 - 32);
    const done = () => {
      s.children[WIN].classList.add('won');
      $('#crate-h').textContent = 'You got…';
      $('#crate-out').innerHTML = `<div class="crate-result"><span class="arc-gi">${arcIcon(g)}</span><b>${ARC_NAME[g][1]}</b></div><button type="button" class="btn btn-grape btn-block mt" data-act="arc-play">Play now</button><button type="button" class="btn btn-ghost btn-block mt" data-act="arc-close">Later (you have 30 minutes)</button>`;
    };
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { s.style.transform = `translateX(${-target}px)`; done(); return; }
    s.addEventListener('transitionend', done, { once: true });
    requestAnimationFrame(() => requestAnimationFrame(() => { s.style.transition = 'transform 5.5s cubic-bezier(.1,.7,.12,1)'; s.style.transform = `translateX(${-target}px)`; }));
  }
  async function arcPlay(practiceId) {
    const mod = await loadArcade();

  function pressWait(ms) { const m = Math.ceil(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; }
  function openSwap() {

  /* trade */
