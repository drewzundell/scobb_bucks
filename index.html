      <div class="rgrid">${RN.map((n, r) => `<div class="rcell">${coinSVG(r, 24)}<div class="rval">${fmtInt(bal[r])}</div><div class="rn rc${r}">${n}</div></div>`).join('')}</div>
      ${sumC(res) ? `<p class="small soft">${plural(sumC(res), 'coin is', 'coins are')} held for your open trade offers.</p>` : ''}
      ${owner ? `<p class="small soft">You’re the bank. ${fmtInt(out)} of ${fmtInt(supply)} are out with friends.</p>` : (sumC(bal) === 0 ? `<p class="small soft">Ask ${esc(nameOf(L.issuer))}, the bank, to send you some ScobbBucks.</p>` : '')}
      <div class="row2"><button type="button" class="btn btn-grape" data-act="send">Send</button><button type="button" class="btn btn-ghost" data-act="new-trade">Trade</button></div>${owner ? '<button type="button" class="btn btn-ghost btn-block" style="margin-top:12px" data-act="mint-more">Mint more ScobbBucks</button>' : '<button type="button" class="btn btn-ghost btn-block" style="margin-top:12px" data-act="swap">⬆️ Upgrade coins</button>'}</section>`;
    if (un.count) {
      const from = [...new Set(un.list.map(ev => ev.a))].map(nameOf);
      h += `<button type="button" class="banner gift wiggle-in" data-act="reveal">${icon('gift')}<span class="bt">You got ${bucks(un.count)} from ${esc(joinWords(from))}</span><span class="pill">Open</span></button>`;
    }
    if (inc.length) h += `<button type="button" class="banner" data-act="tab" data-tab="trades">${headBubble(inc[0].from, 34)}<span class="bt">${inc.length === 1 ? `${esc(nameOf(inc[0].from))} sent you a trade offer` : `${inc.length} trade offers are waiting on you`}</span><span class="pill">View</span></button>`;
    if (farmVisible()) h += `<a class="farm-card" href="./farm.html"><span class="fe" aria-hidden="true">🌾</span><span class="ft"><b>Scobb Farm</b><span>Build a farm, raid your friends and take over the map.${FARM_LIVE ? ' The winner gets 25 ScobbBucks.' : ' In preview.'}</span></span><span class="go">Play</span></a>`;
    h += `<h2>Your activity</h2>${activityHTML()}`;
    return h;
  }

  function evCoins(c) { return `<div class="chips">${coinChips(c)}</div>`; }
  function itemTags(list, owner) { return list.map(it => CAT[it] ? `<span class="it-tag"><span class="tb">${thumbSVG(it, lookOf(owner))}</span>${esc(CAT[it].name)}</span>` : '').join(''); }

  function activityHTML() {
    const seen = new Set(priv.seen || []);
    const rows = [];
    for (const ev of L.events) {
      if (ev.k === 'send' && (ev.a === uid || ev.to === uid)) rows.push(ev);
      else if (ev.k === 'buy' && ev.a === uid) rows.push(ev);
      else if (ev.k === 'trade' && (ev.a === uid || ev.to === uid)) rows.push(ev);
      else if (ev.k === 'mint' && ev.a === uid) rows.push(ev);
      else if (ev.k === 'swap' && ev.a === uid) rows.push(ev);
    }
    for (const e of myEntries()) { const key = uid + ':' + e.i; if (L.bad[key] && (e.k === 'send' || e.k === 'buy' || e.k === 'swap')) rows.push({ k: 'bad', e, t: e.t }); }
    rows.sort((a, b) => b.t - a.t);
    if (!rows.length) return `<p class="empty">Nothing here yet. Coins you send and get will show up here.</p>`;
    return `<div class="list">${rows.slice(0, 40).map(ev => {
      let other = ev.a === uid ? ev.to : ev.a, t = '', more = '';
      if (ev.k === 'send' && ev.a === uid) { t = `You sent <b>${esc(nameOf(ev.to))}</b> ${bucks(sumC(ev.c))}`; more = evCoins(ev.c); }
      else if (ev.k === 'send') { t = `<b>${esc(nameOf(ev.a))}</b> sent you ${bucks(sumC(ev.c))}`; more = seen.has(ev.key) ? evCoins(ev.c) : '<p class="s">Open it on your wallet to see what you got.</p>'; }
      else if (ev.k === 'buy') { other = uid; t = `You bought the <b>${esc(CAT[ev.it].name)}</b>`; more = `<div class="chips">${coinChips(priceOf(CAT[ev.it]))}</div>`; }
      else if (ev.k === 'trade') {
        const mineGive = ev.a === uid ? { c: ev.gc, i: ev.gi } : { c: ev.wc, i: ev.wi };
        const mineGet = ev.a === uid ? { c: ev.wc, i: ev.wi } : { c: ev.gc, i: ev.gi };
        t = `You traded with <b>${esc(nameOf(other))}</b>`;
        more = `<p class="s">You gave</p><div class="chips">${coinChips(mineGive.c)}${itemTags(mineGive.i, other)}</div><p class="s" style="margin-top:4px">You got</p><div class="chips">${coinChips(mineGet.c)}${itemTags(mineGet.i, uid)}</div>`;
      } else if (ev.k === 'mint') {
        other = uid;
        t = `You minted ${bucks(sumC(ev.c))}`;
        more = evCoins(ev.c);
      } else if (ev.k === 'swap') {
        other = uid;
        t = `You upgraded ${fmtInt(SWAP[ev.r] * ev.n)} ${RN[ev.r]} into ${fmtInt(ev.n)} ${RN[ev.r + 1]}`;
        const g = z(), w = z(); g[ev.r] = SWAP[ev.r] * ev.n; w[ev.r + 1] = ev.n;
        more = `<p class="s">You gave</p><div class="chips">${coinChips(g)}</div><p class="s" style="margin-top:4px">You got</p><div class="chips">${coinChips(w)}</div>`;
      } else if (ev.k === 'bad') {
        other = ev.e.to || uid;
        const why = L.bad[uid + ':' + ev.e.i];
        t = ev.e.k === 'send' ? `Your send to <b>${esc(nameOf(ev.e.to))}</b> didn’t go through` : ev.e.k === 'swap' ? 'Your coin upgrade didn’t go through' : `Your ${esc((CAT[ev.e.it] || { name: 'item' }).name)} purchase didn’t go through`;
        more = `<p class="s">${why === 'gone' ? 'That item had already left the shop, so nothing moved.' : why === 'vault' ? 'The bank’s vault ran out of that rarity, so nothing moved.' : 'You didn’t have enough coins when it reached everyone, so nothing moved.'}</p>`;
      }
      const note = ev.n ? `<p class="note">“${esc(ev.n)}”</p>` : '';
      return `<div class="ev">${headBubble(other, 40)}<div class="main"><div class="t">${t}</div>${note}${more}</div><span class="when">${ago(ev.t)}</span></div>`;
    }).join('')}</div>`;
  }

  /* ---- shop ---- */
  function shopTab() {
    const av = availOf(uid);
    const now = Date.now();
    const mode = farmVisible() && ui.shopMode === 'farm' ? 'farm' : 'avatar';
    let h = `<header class="top"><h1>Shop</h1><div class="mini-bal">${coinChipsCompact(av) || '<span class="small soft">No coins yet</span>'}</div></header>`;
    if (farmVisible()) h += `<div class="hscroll" style="margin-top:-6px">${[['avatar', 'Avatar shop'], ['farm', 'Farm shop']].map(([k, l]) => `<button type="button" class="cat${mode === k ? ' on' : ''}" data-act="shop-mode" data-m="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div>`;
    if (mode === 'farm') {
      const d = FSK.dayOf(now), ids = FSK.farmShopFor(d, config.salt);
      h += `<p class="small soft" style="margin:2px 0 10px">Today’s farm skins, one for each building. New ones in ${timeLeft(FSK.DAY0 + (d + 1) * FSK.DAY_MS - now)}.</p>`;
      h += `<div class="grid">${ids.map(id => shopCard(CAT[id])).join('')}</div>`;
      h += `<p class="small soft" style="margin-top:16px">There are ${fmtInt(FSK.TOTAL)} farm skins. They change how your farm looks in Scobb Farm, not how it plays. Use them from your closet.</p>`;
      return h;
    }
    const sh = avatarShopNow(now);
    h += `<p class="small soft" style="margin:2px 0 10px">${sh.daily ? 'Today’s shop' : 'This week’s shop'}. New items in ${timeLeft(sh.next - now)}.</p>`;
    h += `<div class="grid">${sh.ids.map(id => shopCard(CAT[id])).join('')}</div>`;
    h += `<p class="small soft" style="margin-top:16px">There are ${fmtInt(TOTAL_ITEMS)} cosmetics in ScobbBucks, and the shop only carries ${sh.ids.length} of them ${sh.daily ? 'each day' : 'each week'}. Missed something? Trade a friend for it.</p>`;
    return h;
  }
  function shopCard(it) {
    const owned = ownedCount(uid, it.id);
    return `<button type="button" class="scard rb${it.r}" data-act="item" data-id="${it.id}"><span class="thumb">${thumbSVG(it.id, meDoc.avatar, it.name)}${it.slot === 'emote' ? `<span class="play">${icon('play')}</span>` : ''}</span><span class="nm">${esc(it.name)}</span><span class="pr">${coinSVG(it.r, 20)}<span>×${it.n}</span><span class="rt rc${it.r}">${RN[it.r]}</span></span>${owned ? `<span class="own">Owned${owned > 1 ? ' ×' + owned : ''}</span>` : ''}</button>`;
  }

  /* ---- closet ---- */
  function uniqueItems(list) { const seen = new Map(); for (const x of list) { if (!seen.has(x.it)) seen.set(x.it, Object.assign({ count: 0 }, x)); seen.get(x.it).count++; } return [...seen.values()]; }
  function closetTab() {
    const eq = equipIds(uid);
    const mine = itemsOf(uid);
    const cur = meDoc.equip || {};
    let h = `<header class="top"><h1>Closet</h1><button type="button" class="btn btn-ghost btn-sm" data-act="edit-look">Edit look</button></header>`;
    h += `<div class="stage"><button type="button" class="stage-btn" id="closet-av" data-act="emote-me" aria-label="Play your emote">${avatarSVG(meDoc.avatar, eq, { back: ui.closetBack, cls: 'big', label: 'Your avatar' })}</button></div>`;
    h += `<div class="stage-tools"><span class="small soft">Tap your avatar to play your emote.</span><button type="button" class="link" data-act="turn">${ui.closetBack ? 'Face front' : 'Turn around'}</button></div>`;
    const emotes = [{ id: 'wave', it: 'emote_wave', count: 1 }].concat(uniqueItems(mine.filter(x => CAT[x.it].slot === 'emote')));
    const curE = validInst(uid, cur.emote) ? L.items[cur.emote].it : 'emote_wave';
    h += `<h2>Emotes</h2><div class="hscroll">${emotes.map(e => `<button type="button" class="echip${curE === e.it ? ' on' : ''}" data-act="emote-pick" data-inst="${e.id}" aria-pressed="${curE === e.it}">${esc(CAT[e.it].name)}</button>`).join('')}</div>`;
    if (emotes.length === 1) h += `<p class="small soft">More emotes are in the shop.</p>`;
    const fmine = mine.filter(x => CAT[x.it] && CAT[x.it].farm);
    if (farmVisible() || fmine.length) {
      const fe = meDoc.farmEquip || {};
      h += `<h2>Farm skins</h2>`;
      if (!fmine.length) h += `<p class="small soft">None yet. <button type="button" class="link" data-act="shop-farm">Open the farm shop</button></p>`;
      for (const [b, bn] of FSK.BUILDINGS) {
        const list = uniqueItems(fmine.filter(x => CAT[x.it].b === b));
        if (!list.length) continue;
        const cur = list.some(x => x.it === fe[b]) ? fe[b] : null;
        h += `<h3>${bn}</h3><div class="hscroll"><button type="button" class="wchip none${!cur ? ' on' : ''}" data-act="farm-equip" data-b="${b}" data-id="" aria-pressed="${!cur}">Default</button>${list.map(x => `<button type="button" class="wchip${cur === x.it ? ' on' : ''}" data-act="farm-equip" data-b="${b}" data-id="${esc(x.it)}" aria-pressed="${cur === x.it}"><span class="wthumb">${thumbSVG(x.it)}</span><span>${esc(CAT[x.it].name.replace(' ' + bn, ''))}${x.count > 1 ? ' ×' + x.count : ''}</span></button>`).join('')}</div>`;
      }
    }
    for (const s of SLOTS) {
      if (s === 'emote') continue;
      const list = uniqueItems(mine.filter(x => CAT[x.it].slot === s));
      h += `<h3>${SLOT_NAME[s]}</h3>`;
      if (!list.length) { h += `<p class="small soft">None yet. <button type="button" class="link" data-act="shop-cat" data-cat="${s}">Shop ${SLOT_NAME[s].toLowerCase()}</button></p>`; continue; }
      const curIt = validInst(uid, cur[s]) ? L.items[cur[s]].it : null;
      h += `<div class="hscroll"><button type="button" class="wchip none${!curIt ? ' on' : ''}" data-act="equip" data-slot="${s}" data-inst="" aria-pressed="${!curIt}">None</button>${list.map(x => `<button type="button" class="wchip${curIt === x.it ? ' on' : ''}" data-act="equip" data-slot="${s}" data-inst="${esc(x.id)}" aria-pressed="${curIt === x.it}"><span class="wthumb">${thumbSVG(x.it, meDoc.avatar)}</span><span>${esc(CAT[x.it].name)}${x.count > 1 ? ' ×' + x.count : ''}</span></button>`).join('')}</div>`;
    }
    return h;
  }

  /* ---- trades ---- */
  function sideHTML(c, items, owner) {
    const parts = coinChips(c) + itemTags(items.map(id => (L.items[id] ? L.items[id].it : null)).filter(Boolean), owner);
    return parts ? `<div class="chips">${parts}</div>` : '<p class="small soft">Nothing</p>';
  }
  function offerProblem(o) {
    const fromBal = balOf(o.from), toAv = availOf(o.to);
    if (!o.gc.every((n, r) => fromBal[r] >= n)) return `${nameOf(o.from)} doesn’t have those coins anymore.`;
    if (!o.gi.every(id => validInst(o.from, id))) return `${nameOf(o.from)} doesn’t have those items anymore.`;
    if (o.to === uid) {
      const bal = balOf(uid);
      if (!o.wc.every((n, r) => bal[r] >= n)) return 'You don’t have the coins they asked for.';
      if (!o.wc.every((n, r) => toAv[r] >= n)) return 'Some of those coins are held for your other offers. Cancel one first.';
      if (!o.wi.every(id => validInst(uid, id))) return 'You don’t have the items they asked for anymore.';
    }
    return '';
  }
  function offerCard(o) {
    const incoming = o.to === uid;
    const other = incoming ? o.from : o.to;
    const give = incoming ? sideHTML(o.wc, o.wi, uid) : sideHTML(o.gc, o.gi, uid);
    const get = incoming ? sideHTML(o.gc, o.gi, other) : sideHTML(o.wc, o.wi, other);
    const stat = { done: 'Traded', declined: 'Declined', cancelled: 'Cancelled', failed: 'Didn’t go through' }[o.status];
    const head = o.status === 'open' ? (incoming ? `<b>${esc(nameOf(other))}</b> wants to trade` : `Waiting on <b>${esc(nameOf(other))}</b>`) : `Trade with <b>${esc(nameOf(other))}</b>`;
    const prob = o.status === 'open' ? offerProblem(o) : '';
    let btns = '';
    if (o.status === 'open' && !readOnly) {
      btns = incoming
        ? `<div class="row2"><button type="button" class="btn btn-ghost" data-act="decline" data-o="${esc(o.key)}">Decline</button><button type="button" class="btn btn-lime" data-act="accept" data-o="${esc(o.key)}"${prob ? ' disabled' : ''}>Accept</button></div>`
        : `<div class="row2" style="grid-template-columns:1fr"><button type="button" class="btn btn-ghost" data-act="cancel" data-o="${esc(o.key)}">Cancel offer</button></div>`;
    }
    return `<div class="card offer"><div class="offer-head">${headBubble(other, 38)}<span class="bt">${head}</span>${stat ? `<span class="status${o.status === 'done' ? ' done' : ''}">${stat}</span>` : `<span class="small soft">${ago(o.t)}</span>`}</div>
      <div class="offer-cols"><div><div class="lbl">You give</div>${give}</div><div><div class="lbl">You get</div>${get}</div></div>
      ${o.n ? `<p class="note">“${esc(o.n)}”</p>` : ''}${prob ? `<p class="warn">${esc(prob)}</p>` : ''}${o.status === 'failed' ? '<p class="small soft" style="margin-top:8px">Someone was missing coins or items when it was accepted, so nothing moved.</p>' : ''}${btns}</div>`;
  }
  function tradesTab() {
    const all = Object.values(L.offers).filter(o => o.from === uid || o.to === uid);
    const inc = all.filter(o => o.status === 'open' && o.to === uid).sort((a, b) => b.t - a.t);
    const out = all.filter(o => o.status === 'open' && o.from === uid).sort((a, b) => b.t - a.t);
    const done = all.filter(o => o.status !== 'open').sort((a, b) => b.end - a.end).slice(0, 20);
    let h = `<header class="top"><h1>Trades</h1><button type="button" class="btn btn-grape btn-sm" data-act="new-trade">New trade</button></header>`;
    h += `<p class="small soft">Swap coins for better rarities, or trade coins and items with anyone by username or phone number.</p>`;
    h += `<h2>Waiting on you</h2>${inc.length ? inc.map(offerCard).join('') : '<p class="empty">No offers right now.</p>'}`;
    h += `<h2>Waiting on them</h2>${out.length ? out.map(offerCard).join('') : '<p class="empty">You haven’t sent any offers.</p>'}`;
    if (done.length) h += `<h2>Finished</h2>${done.map(offerCard).join('')}`;
    return h;
  }

  /* ---- feed ---- */
  function feedTab() {
    const seen = new Set(priv.seen || []);
    const list = Object.keys(players).filter(u => players[u] && players[u].username && players[u].avatar).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
    let h = `<header class="top"><h1>Feed</h1></header>`;
    h += `<h3 style="margin-top:0">Players</h3><div class="hscroll players">${list.map(u => `<button type="button" class="pl" data-act="profile" data-u="${esc(u)}">${headBubble(u, 58)}<span>${esc(nameOf(u))}</span></button>`).join('')}</div>`;
    const evs = L.events.slice().sort((a, b) => b.t - a.t).slice(0, 80);
    if (!evs.length) return h + '<p class="empty">Nothing has happened yet. Sends, trades and shop buys show up here.</p>';
    h += `<div class="list">${evs.map(ev => {
      let t = '', more = '', hot = false, face = ev.a;
      if (ev.k === 'send') {
        t = `<b>${esc(nameOf(ev.a))}</b> sent <b>${esc(nameOf(ev.to))}</b> ${bucks(sumC(ev.c))}`;
        const spoiler = ev.to === uid && !seen.has(ev.key);
        if (ev.drop && !spoiler && (ev.c[4] || ev.c[5])) {
          hot = true;
          more = `<p class="s"><b class="${ev.c[5] ? 'rc5' : 'rc4'}">${esc(nameOf(ev.to))} pulled ${ev.c[5] ? (ev.c[5] > 1 ? ev.c[5] + ' Mythics' : 'a Mythic') : (ev.c[4] > 1 ? ev.c[4] + ' Legendaries' : 'a Legendary')}!</b></p>`;
        }
      } else if (ev.k === 'buy') {
        t = `<b>${esc(nameOf(ev.a))}</b> got the <b>${esc(CAT[ev.it].name)}</b>`;
        more = `<div class="chips">${itemTags([ev.it], ev.a)}</div>`;
        hot = CAT[ev.it].r >= 4;
      } else if (ev.k === 'trade') {
        t = `<b>${esc(nameOf(ev.a))}</b> and <b>${esc(nameOf(ev.to))}</b> made a trade`;
      } else if (ev.k === 'swap') {
        t = `<b>${esc(nameOf(ev.a))}</b> upgraded ${fmtInt(SWAP[ev.r] * ev.n)} ${RN[ev.r]} into ${ev.n > 1 ? fmtInt(ev.n) + ' ' + RN[ev.r + 1] : (ev.r + 1 === 1 ? 'an ' : 'a ') + RN[ev.r + 1]}`;
        hot = ev.r + 1 >= 4;
      } else if (ev.k === 'mint') {
        t = `<b>${esc(nameOf(ev.a))}</b> minted ${bucks(sumC(ev.c))}`;
        more = `<div class="chips">${coinChips(ev.c)}</div>`;
        hot = !!(ev.c[4] || ev.c[5]);
      }
      return `<div class="ev${hot ? ' hot' : ''}">${headBubble(face, 40)}<div class="main"><div class="t">${t}</div>${ev.n ? `<p class="note">“${esc(ev.n)}”</p>` : ''}${more}</div><span class="when">${ago(ev.t)}</span></div>`;
    }).join('')}</div>`;
    return h;
  }

  /* ================= sheets ================= */
  let sheet = null;
  let lastFocus = null;
  function sheetHead(title, sub, extraClass) {
    return `<div class="sheet-head"><div><h2 id="sheet-title"${extraClass ? ` class="${extraClass}"` : ''}>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}</div><button type="button" class="x" data-act="close-sheet" aria-label="Close">${icon('close')}</button></div>`;
  }
  function openSheet(kind, html, wire, extra) {
    closeSheet(true);
    lastFocus = document.activeElement;
    $('#sheet-body').innerHTML = html;
    $('#sheet-root').hidden = false;
    document.body.style.overflow = 'hidden';
    sheet = Object.assign({ kind }, extra || {});
    if (wire) wire();
    const focusEl = $('#sheet-body [data-autofocus]');
    setTimeout(() => { (focusEl || $('#sheet')).focus({ preventScroll: true }); }, 60);
  }
  function closeSheet(silent) {
    const root = $('#sheet-root');
    if (root.hidden) return;
    const s = sheet;
    sheet = null;
    root.hidden = true;
    $('#sheet-body').innerHTML = '';
    document.body.style.overflow = '';
    if (s && s.onClose) s.onClose();
    if (!silent && lastFocus && document.contains(lastFocus) && lastFocus.offsetParent !== null) lastFocus.focus({ preventScroll: true });
  }

  /* person picker (username or phone) */
  function toFieldHTML(label) {
    return `<div class="field"><label for="to-in">${label}</label><div class="picked" id="to-pick" hidden></div><input id="to-in" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="@username or phone number" data-autofocus><div class="results" id="to-res"></div></div>`;
  }
  function wireTo(onPick, pref) {
    const inp = $('#to-in'), res = $('#to-res'), pick = $('#to-pick');
    let seq = 0, timer = 0;
    const set = u => {
      if (u) {
        pick.innerHTML = `${headBubble(u, 38)}<b>${esc(nameOf(u))}</b><button type="button" class="link" id="to-change">Change</button>`;
        pick.hidden = false; inp.hidden = true; res.innerHTML = '';
        $('#to-change').addEventListener('click', () => set(null));
      } else { pick.hidden = true; inp.hidden = false; inp.value = ''; inp.focus(); }
      onPick(u);
    };
    const search = async () => {
      const my = ++seq;
      const q = inp.value.trim();
      const list = await findPeople(q);
      if (my !== seq) return;
      if (list.length) res.innerHTML = list.map(x => `<button type="button" class="res" data-u="${esc(x.u)}">${headBubble(x.u, 38)}<span><b>${esc(nameOf(x.u))}</b>${x.phone ? '<span class="small soft"> matches that number</span>' : ''}</span></button>`).join('');
      else if (q.replace(/^@/, '').length >= 2) res.innerHTML = `<p class="small soft" style="padding:8px 4px">${/^[\d\s()+.\-]+$/.test(q) ? (normPhone(q) ? 'Nobody has added that number.' : 'Keep typing the full number.') : 'Nobody by that name. Check the spelling, or try their phone number.'}</p>`;
      else res.innerHTML = '';
    };
    inp.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 180); });
    res.addEventListener('click', e => { const b = e.target.closest('.res'); if (b) set(b.dataset.u); });
    if (pref && players[pref]) set(pref);
  }

  function stepperHTML(prefix, avail, verb) {
    const rows = RN.map((n, r) => (avail[r] > 0 ? `<div class="step">${coinSVG(r, 30)}<span class="sn"><span class="rc${r}">${n}</span><span class="small">${fmtInt(avail[r])} available</span></span><button type="button" class="sb" data-act="step" data-p="${prefix}" data-r="${r}" data-d="-1" aria-label="One fewer ${n}">−</button><input class="sv" id="${prefix}-${r}" type="text" inputmode="numeric" value="0" data-max="${avail[r]}" aria-label="${n} coins to ${verb}"><button type="button" class="sb" data-act="step" data-p="${prefix}" data-r="${r}" data-d="1" aria-label="One more ${n}">+</button></div>` : '')).join('');
    return rows || '<p class="small soft">No coins available.</p>';
  }
  function readSteps(prefix) {
    return RN.map((_, r) => {
      const el = $('#' + prefix + '-' + r);
      if (!el) return 0;
      const v = parseInt(el.value.replace(/\D/g, ''), 10);
      return Number.isFinite(v) && v > 0 ? Math.min(v, Number(el.dataset.max) || 0) : 0;
    });
  }
  function itemPickHTML(prefix, list, owner) {
    if (!list.length) return '<p class="small soft">No items to trade.</p>';
    return `<div class="ipick">${list.map(x => `<button type="button" class="ichip" data-act="ipick" data-p="${prefix}" data-inst="${esc(x.id)}" aria-pressed="false"><span class="wthumb">${thumbSVG(x.it, lookOf(owner))}</span><span>${esc(CAT[x.it].name)}</span></button>`).join('')}</div>`;
  }
  const readPicks = prefix => $$(`.ichip[data-p="${prefix}"][aria-pressed="true"]`).map(b => b.dataset.inst);

  /* send */
  function openSwap() {
    if (!guardWrite()) return;
    const draw = () => {
      const av = availOf(uid), vault = availOf(L.issuer);
      if (ui.swapR == null) { const r0 = [0, 1, 2, 3, 4].find(r => av[r] >= SWAP[r]); ui.swapR = r0 == null ? 0 : r0; }
      const r = ui.swapR, cost = SWAP[r];
      const maxN = Math.max(0, Math.min(1000, Math.floor(av[r] / cost), vault[r + 1]));
      const n = Math.max(1, Math.min(ui.swapN || 1, Math.max(1, maxN)));
      ui.swapN = n;
      let h = sheetHead('Upgrade coins', 'Trade lower coins to the bank’s vault for higher ones');
      h += `<div class="list">${[0, 1, 2, 3, 4].map(k => `<button type="button" class="step" style="width:100%;text-align:left;border:2px solid ${k === r ? 'var(--grape)' : 'var(--line)'};border-radius:16px;padding:8px 10px;margin-bottom:8px;background:var(--card);font:inherit;color:inherit" data-act="swap-r" data-r="${k}" aria-pressed="${k === r}">${coinSVG(k, 26)}<span class="sn"><span><b>${SWAP[k]} <span class="rc${k}">${RN[k]}</span></b> → <b>1 <span class="rc${k + 1}">${RN[k + 1]}</span></b></span><span class="small">You have ${fmtInt(av[k])}. The vault has ${fmtInt(vault[k + 1])} ${RN[k + 1]}.</span></span>${coinSVG(k + 1, 26)}</button>`).join('')}</div>`;
      h += `<div class="field"><span class="label">How many ${RN[r + 1]} do you want?</span><div class="step"><button type="button" class="sb" data-act="swap-n" data-d="-1" aria-label="One fewer">−</button><b class="sv" style="display:grid;place-items:center">${n}</b><button type="button" class="sb" data-act="swap-n" data-d="1" aria-label="One more">+</button><button type="button" class="qchip" data-act="swap-n" data-d="max">Max</button></div></div>`;
      h += `<div class="price-row" style="font-size:20px;gap:6px;flex-wrap:nowrap;white-space:nowrap">${coinSVG(r, 26)}${fmtInt(cost * n)} ${RN[r]} <span aria-hidden="true">→</span> ${coinSVG(r + 1, 26)}${fmtInt(n)} ${RN[r + 1]}</div>`;
      const why = av[r] < cost ? `You need at least ${cost} ${RN[r]} to upgrade.` : vault[r + 1] < 1 ? `The vault is out of ${RN[r + 1]} right now.` : '';
      h += why ? `<p class="small err">${why}</p>` : `<p class="small soft">Your ${RN[r]} go to the bank’s vault, and you get ${RN[r + 1]} from it right away.</p>`;
      h += `<button type="button" class="btn btn-grape btn-block mt" data-act="swap-go"${why || readOnly ? ' disabled' : ''}>Upgrade</button>`;
      $('#sheet-body').innerHTML = h;
    };
    ui.swapR = null; ui.swapN = 1;
    openSheet('swap', '', draw, { refresh: draw });
  }
  function openSend(prefTo) {
    if (!guardWrite()) return;
    const owner = uid === L.issuer;
    const av = availOf(uid);
    let to = null;
    const total = sumC(av);
    const body = owner
      ? `<div class="field"><label for="s-amt">How many</label><input id="s-amt" type="text" inputmode="numeric" placeholder="0" value=""><div class="qchips">${[1, 5, 10, 25, 100].map(n => `<button type="button" class="qchip" data-act="qamt" data-v="${n}">${n}</button>`).join('')}</div><p class="hint">Each coin lands on a random rarity. Right now the odds are ${joinWords(av.map((n, r) => (n ? `${RN[r]} ${((n / Math.max(1, total)) * 100).toFixed(1).replace('.0', '')}%` : '')).filter(Boolean))}.</p></div>`
      : `<div class="field"><span class="label">Which coins</span>${stepperHTML('sg', av, 'send')}</div>`;
    const html = sheetHead('Send ScobbBucks', owner ? `${fmtInt(total)} in your vault` : `${fmtInt(total)} available`)
      + toFieldHTML('To') + body
      + `<div class="field"><label for="s-note">Note (optional)</label><input id="s-note" type="text" maxlength="80" autocomplete="off" placeholder="What’s it for?"></div>`
      + `<p class="err" id="s-err" hidden></p><button type="button" class="btn btn-grape btn-block mt" id="s-go">Send</button><div id="s-result"></div>`;
    openSheet('send', html, () => {
      wireTo(u => { to = u; }, prefTo);
      const err = $('#s-err');
      const fail = m => { err.textContent = m; err.hidden = false; };
      $('#s-go').addEventListener('click', () => {
        err.hidden = true;
        if (!guardWrite()) return;
        if (!to || !players[to]) return fail('Pick who to send to.');
        const note = $('#s-note').value.trim().slice(0, 80);
        const nowAv = availOf(uid);
        let c;
        if (uid === L.issuer) {
          const n = parseInt(($('#s-amt').value || '').replace(/\D/g, ''), 10);
          if (!(n > 0)) return fail('Enter how many to send.');
          if (n > sumC(nowAv)) return fail(`You only have ${fmtInt(sumC(nowAv))} in your vault.`);
          c = drawRandom(n, nowAv);
        } else {
          c = readSteps('sg');
          if (!sumC(c)) return fail('Add at least one coin.');
          if (!c.every((n, r) => n <= nowAv[r])) return fail('You don’t have that many available.');
        }
        newEntry('send', { to, c, n: note });
        if (uid === L.issuer) {
          $('#s-go').hidden = true;
          $('#s-result').innerHTML = `<div class="result"><h3>${esc(nameOf(to))} got</h3><div class="chips">${coinChips(c)}</div><button type="button" class="btn btn-grape btn-block mt" data-act="close-sheet">Done</button></div>`;
          if (c[4] || c[5]) confetti();
        } else {
          closeSheet();
          toast(`Sent ${bucks(sumC(c))} to ${nameOf(to)}`);
        }
      });
    });
  }

  /* trade */
  function openTrade(prefTo) {
    if (!guardWrite()) return;
    let to = null;
    const html = sheetHead('New trade', 'Pick what you give and what you want back.')
      + toFieldHTML('Trade with')
      + `<div id="t-body"></div>`
      + `<div class="field"><label for="t-note">Note (optional)</label><input id="t-note" type="text" maxlength="80" autocomplete="off" placeholder="Say something nice"></div>`
      + `<p class="err" id="t-err" hidden></p><button type="button" class="btn btn-grape btn-block mt" id="t-go">Send offer</button>`;
    openSheet('trade', html, () => {
      const body = $('#t-body');
      const draw = () => {
        if (!to) { body.innerHTML = ''; return; }
        body.innerHTML = `<div class="side-card"><h3>You give</h3>${stepperHTML('tg', availOf(uid), 'give')}<h3>Your items</h3>${itemPickHTML('tgi', availItemsOf(uid), uid)}</div>
          <div class="side-card"><h3>You get from ${esc(nameOf(to))}</h3>${stepperHTML('tw', availOf(to), 'ask for')}<h3>Their items</h3>${itemPickHTML('twi', availItemsOf(to), to)}</div>`;
      };
      wireTo(u => { to = u; draw(); }, prefTo);
      const err = $('#t-err');
      const fail = m => { err.textContent = m; err.hidden = false; };
      $('#t-go').addEventListener('click', () => {
        err.hidden = true;
        if (!guardWrite()) return;
        if (!to || !players[to]) return fail('Pick someone to trade with.');
        const gc = readSteps('tg'), wc = readSteps('tw'), gi = readPicks('tgi'), wi = readPicks('twi');
        if (sumC(gc) + gi.length < 1 || sumC(wc) + wi.length < 1) return fail('Add something to both sides.');
        const myAv = availOf(uid), theirAv = availOf(to);
        if (!gc.every((n, r) => n <= myAv[r])) return fail('You don’t have that many coins available.');
        if (!wc.every((n, r) => n <= theirAv[r])) return fail(`${nameOf(to)} doesn’t have that many coins.`);
        newEntry('offer', { to, gc, gi, wc, wi, n: $('#t-note').value.trim().slice(0, 80) });
        closeSheet();
        ui.tab = 'trades';
        render();
        toast(`Offer sent to ${nameOf(to)}`);
      });
    });
  }

  /* shop item */
  function openFarmItem(id) {
    const it = CAT[id];
    const draw = () => {
      const have = availOf(uid)[it.r], need = it.n - have, owned = ownedCount(uid, id);
      const using = (meDoc.farmEquip || {})[it.b] === id;
      const inShop = inShopAt(id, Date.now(), config.salt);
      let actions = owned ? `<button type="button" class="btn btn-lime btn-block mt" data-act="farm-use" data-id="${id}">${using ? 'Stop using it' : 'Use it on my farm'}</button>` : '';
      if (inShop) actions += `<button type="button" class="btn ${owned ? 'btn-ghost' : 'btn-grape'} btn-block mt" data-act="buy" data-id="${id}"${need > 0 || readOnly ? ' disabled' : ''}>${owned ? 'Buy another' : 'Buy'} for ${it.n} ${RN[it.r]}</button>`;
      $('#sheet-body').innerHTML = sheetHead(esc(it.name), `<span class="rc${it.r}">${RN[it.r]}</span> skin for your ${it.bname.toLowerCase()}`)
        + `<div class="fprev">${FSK.previewSVG(id)}</div><div class="price-row">${coinSVG(it.r, 30)}${it.n} ${RN[it.r]}</div>`
        + `<p class="small ${need > 0 && inShop ? 'err' : 'soft'}">${inShop ? (need > 0 ? `You need ${need} more ${RN[it.r]}. Trade with friends to get some.` : `You have ${fmtInt(have)} ${RN[it.r]} available.`) : 'This skin isn’t in today’s farm shop.'}${owned ? ` You own ${owned}.` : ''}</p>` + actions;
    };
    openSheet('item', '', draw, { refresh: draw });
  }
  function openItem(id) {
    const it = CAT[id];
    if (!it) return;
    if (it.farm) return openFarmItem(id);
    let back = it.slot === 'back';
    const draw = () => {
      const eq = equipIds(uid);
      if (it.slot !== 'emote') eq[it.slot] = id;
      const av = availOf(uid);
      const have = it.free ? Infinity : av[it.r];
      const owned = ownedCount(uid, id);
      const curInst = meDoc.equip && meDoc.equip[it.slot];
      const wearing = validInst(uid, curInst) && L.items[curInst].it === id;
      const ownInst = itemsOf(uid).find(x => x.it === id);
      const need = it.n - have;
      let actions = '';
      if (owned) {
        actions += it.slot === 'emote'
          ? `<button type="button" class="btn btn-lime btn-block mt" data-act="item-wear" data-id="${id}">${wearing ? 'This is your emote' : 'Make it my emote'}</button>`
          : `<button type="button" class="btn btn-lime btn-block mt" data-act="item-wear" data-id="${id}">${wearing ? 'Take it off' : 'Wear it'}</button>`;
      }
      actions += `<button type="button" class="btn ${owned ? 'btn-ghost' : 'btn-grape'} btn-block mt" data-act="buy" data-id="${id}"${need > 0 || readOnly ? ' disabled' : ''}>${owned ? 'Buy another' : 'Buy'} for ${it.n} ${RN[it.r]}</button>`;
      $('#sheet-body').innerHTML = sheetHead(esc(it.name), `<span class="rc${it.r}">${RN[it.r]}</span> ${{ hat: 'hat', hair: 'hair', eyes: 'eyewear', top: 'top', pants: 'pants', back: 'backpack', watch: 'watch', emote: 'emote' }[it.slot]}`)
        + `<div class="preview-av"><button type="button" class="stage-btn" id="item-av" data-act="item-emote" data-e="${it.emote || ''}" aria-label="${it.slot === 'emote' ? 'Play emote' : 'Avatar preview'}">${avatarSVG(meDoc.avatar, eq, { back, cls: 'big', label: 'Preview' })}</button></div>`
        + `${it.slot !== 'emote' ? `<div class="stage-tools"><span class="small soft">Trying it on</span><button type="button" class="link" data-act="item-turn">${back ? 'Face front' : 'Turn around'}</button></div>` : '<p class="small soft" style="text-align:center">Tap to play it.</p>'}`
        + `<div class="price-row">${coinSVG(it.r, 30)}${it.n} ${RN[it.r]}</div>`
        + `<p class="small ${need > 0 ? 'err' : 'soft'}">${need > 0 ? `You need ${need} more ${RN[it.r]}. Trade with friends to get some.` : `You have ${fmtInt(have)} ${RN[it.r]} available.`}${owned ? ` You own ${owned}.` : ''}</p>`
        + actions;
      if (it.slot === 'emote') setTimeout(() => playEmote($('#item-av .av'), it.emote), 250);
      void ownInst;
    };
    openSheet('item', '', draw, { refresh: draw, toggleBack: () => { back = !back; draw(); } });
  }

  function doBuy(id) {
    const it = CAT[id];
    if (!it || it.free || !guardWrite()) return;
    if (!inShopAt(id, Date.now(), config.salt)) { toast('That item has left the shop.'); return; }
    const av = availOf(uid);
    if (av[it.r] < it.n) { toast(`You need ${it.n - av[it.r]} more ${RN[it.r]}.`); return; }
    const e = newEntry('buy', { it: id, c: priceOf(it) });
    const inst = uid + ':' + e.i;
    if (it.farm) { meDoc.farmEquip = Object.assign({}, meDoc.farmEquip || {}); if (!meDoc.farmEquip[it.b]) { meDoc.farmEquip[it.b] = id; savePlayer(); } }
    else if (it.slot !== 'emote' && !validInst(uid, (meDoc.equip || {})[it.slot])) { meDoc.equip = Object.assign({}, meDoc.equip || {}); meDoc.equip[it.slot] = inst; savePlayer(); }
    toast(`You got the ${it.name}`);
    if (it.r >= 4) confetti();
  }

  function wearToggle(id) {
    const it = CAT[id];
    const cur = meDoc.equip && meDoc.equip[it.slot];
    const wearing = validInst(uid, cur) && L.items[cur].it === id;
    if (it.slot === 'emote') { if (!wearing) { const inst = itemsOf(uid).find(x => x.it === id); if (inst) doEquip('emote', inst.id); } return; }
    if (wearing) doEquip(it.slot, null);
    else { const inst = itemsOf(uid).find(x => x.it === id); if (inst) doEquip(it.slot, inst.id); }
  }

  /* profile */
  function openProfile(u) {
    if (!players[u] && u !== uid) return;
    const draw = () => {
      const p = P_(u);
      const bal = balOf(u);
      const its = uniqueItems(itemsOf(u));
      const me = u === uid;
      $('#sheet-body').innerHTML = sheetHead(esc(nameOf(u)), `Joined ${new Date(p.joinedAt || Date.now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}${u === L.issuer ? '. The bank.' : ''}`)
        + `<div class="preview-av"><button type="button" class="stage-btn" id="prof-av" data-act="prof-emote" data-e="${emoteOf(u)}" aria-label="Play their emote">${ava(u, { cls: 'big' })}</button></div>`
        + `<h3>Coins</h3>${sumC(bal) ? `<div class="chips">${coinChips(bal)}</div>` : '<p class="small soft">No coins yet.</p>'}`
        + `<h3>Items</h3>${its.length ? `<div class="chips">${its.map(x => `<span class="it-tag"><span class="tb">${thumbSVG(x.it, lookOf(u))}</span>${esc(CAT[x.it].name)}${x.count > 1 ? ' ×' + x.count : ''}</span>`).join('')}</div>` : '<p class="small soft">No items yet.</p>'}`
        + (me || readOnly ? '' : `<div class="row2 mt"><button type="button" class="btn btn-grape" data-act="send" data-u="${esc(u)}">Send</button><button type="button" class="btn btn-ghost" data-act="new-trade" data-u="${esc(u)}">Trade</button></div><button type="button" class="btn btn-ghost btn-block mt" data-act="dm-open" data-u="${esc(u)}">Message</button>`);
    };
    openSheet('profile', '', draw, { refresh: draw });
  }

  /* settings */
  function openSettings() {
    const owner = uid === L.issuer;
    const vault = balOf(L.issuer);
    const hasPhone = !!meDoc.phoneHash;
    const html = sheetHead('Settings', `Logged in as @${esc(meDoc.username)}`)
      + `<div class="field"><label for="st-phone">${hasPhone ? 'Change your phone number' : 'Add a phone number'}</label><input id="st-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(555) 555-0123"><p class="hint">${hasPhone ? 'Your number is on your account. Type a new one to replace it.' : 'Friends can find you by your number.'} ScobbBucks only stores a scrambled version of it.</p></div>`
      + `<p class="err" id="st-err" hidden></p><button type="button" class="btn btn-grape btn-block mt" id="st-save">Save number</button>`
      + (hasPhone ? `<button type="button" class="btn btn-ghost btn-block mt" id="st-remove">Remove my number</button>` : '')
      + `<button type="button" class="btn btn-ghost btn-block mt" data-act="edit-look">Edit your look</button>`
      + `<div class="side-card"><h3>Change password</h3><div class="field"><label for="pw-old">Current password</label><input id="pw-old" type="password" autocomplete="current-password"></div><div class="field"><label for="pw-new">New password</label><input id="pw-new" type="password" autocomplete="new-password"><p class="hint">At least 8 characters.</p></div><p class="err" id="pw-err" hidden></p><button type="button" class="btn btn-ghost btn-block mt" id="pw-go">Change password</button></div>`
      + `<div class="side-card"><h3>${owner ? 'You’re the bank' : 'How ScobbBucks work'}</h3>`
      + `<p class="small soft">${owner ? `${fmtInt(sumC(L.total) - sumC(vault))} of ${fmtInt(sumC(L.total))} are out with friends. Coins spent in the shop come back to your vault.` : `${esc(nameOf(L.issuer))} holds the vault and sends coins out. Every coin from the vault lands on a random rarity. Spend coins in the shop, or trade with friends for better ones.`}</p>`
      + `<div class="tbl">${L.total.map((n, r) => `<div>${coinSVG(r, 24)}<span class="rc${r}">${RN[r]}</span><b>${fmtInt(n)}</b>${owner ? `<b class="soft">${fmtInt(vault[r])} left</b>` : ''}</div>`).join('')}</div>`
      + `<p class="small soft" style="margin-top:8px">${owner ? 'The first number is how many exist. The second is how many are still in your vault.' : 'That’s how many of each rarity exist.'}</p></div>`
      + `<button type="button" class="btn btn-danger btn-block mt" data-act="logout">Log out</button>`;
    openSheet('settings', html, () => {
      const err = $('#st-err');
      const fail = m => { err.textContent = m; err.hidden = false; };
      $('#st-save').addEventListener('click', async () => {
        err.hidden = true;
        const digits = normPhone($('#st-phone').value);
        if (!digits) return fail('That doesn’t look like a phone number.');
        const hash = await phoneKey(digits);
        if (Object.keys(players).some(u => u !== uid && players[u] && players[u].phoneHash === hash)) return fail('Someone already uses that phone number.');
        meDoc.phoneHash = hash;
        savePlayer();
        closeSheet();
        recompute();
        toast('Phone number saved');
      });
      const rm = $('#st-remove');
      if (rm) rm.addEventListener('click', () => { meDoc.phoneHash = null; savePlayer(); closeSheet(); recompute(); toast('Phone number removed'); });
      $('#pw-go').addEventListener('click', async () => {
        const e2 = $('#pw-err');
        const f2 = m => { e2.textContent = m; e2.hidden = false; };
        e2.hidden = true;
        const oldP = $('#pw-old').value, newP = $('#pw-new').value;
        if (!oldP) return f2('Enter your current password.');
        if (newP.length < 8) return f2('Use at least 8 characters for the new password.');
        const btn = $('#pw-go');
        btn.disabled = true;
        try {
          await FB.reauthenticateWithCredential(auth.currentUser, FB.EmailAuthProvider.credential(uname + EMAIL_DOMAIN, oldP));
          await FB.updatePassword(auth.currentUser, newP);
          $('#pw-old').value = '';
          $('#pw-new').value = '';
          toast('Password changed');
        } catch (e) {
          const m = authMsg(e && e.code);
          f2(m === 'That username and password don’t match.' ? 'Your current password isn’t right.' : m);
        }
        btn.disabled = false;
      });
    });
  }

  /* mint more (bank only) */
  const ODDS_TEXT = joinWords(CAPS.map((n, r) => `${RN[r]} ${((n / SUPPLY) * 100).toFixed(1).replace('.0', '')}%`));
  function rollOdds(n) {
    const out = z();
    for (let k = 0; k < n; k++) {
      let x = Math.random() * SUPPLY;
      for (let r = 0; r < 6; r++) { if (x < CAPS[r] || r === 5) { out[r]++; break; } x -= CAPS[r]; }
    }
    return out;
  }
  function openMintMore() {
    if (!L || uid !== L.issuer || !guardWrite()) return;
    const html = sheetHead('Mint more ScobbBucks', `${fmtInt(sumC(L.total))} exist right now`)
      + `<div class="field"><label for="mm-amt">How many new coins</label><input id="mm-amt" type="text" inputmode="numeric" placeholder="0" data-autofocus><div class="qchips">${[100, 250, 500, 1000].map(n => `<button type="button" class="qchip" data-act="mm-q" data-v="${n}">${fmtInt(n)}</button>`).join('')}</div>`
      + `<p class="hint">Each new coin gets a random rarity with the same odds as the first 5,000: ${ODDS_TEXT}.</p></div>`
      + `<p class="small soft" style="margin-top:12px">New coins go into your vault. Minting can’t be undone, and more coins makes each one worth a little less.</p>`
      + `<p class="err" id="mm-err" hidden></p><button type="button" class="btn btn-grape btn-block mt" id="mm-go">Mint</button><div id="mm-result"></div>`;
    openSheet('mintmore', html, () => {
      const err = $('#mm-err');
      const fail = m => { err.textContent = m; err.hidden = false; };
      $('#mm-go').addEventListener('click', () => {
        err.hidden = true;
        if (!guardWrite()) return;
        const n = parseInt(($('#mm-amt').value || '').replace(/\D/g, ''), 10);
        if (!(n > 0)) return fail('Enter how many coins to mint.');
        if (n > 5000) return fail('You can mint up to 5,000 at a time.');
        const c = rollOdds(n);
        newEntry('mint', { c });
        $('#mm-go').hidden = true;
        $('#mm-amt').disabled = true;
        $('#mm-result').innerHTML = `<div class="result"><h3>You minted ${bucks(n)}</h3><div class="chips">${coinChips(c)}</div><button type="button" class="btn btn-grape btn-block mt" data-act="close-sheet">Done</button></div>`;
        if (c[4] || c[5]) confetti();
      });
    });
  }

  /* reveal */
  function openReveal() {
    const un = unopened();
    if (!un.count) return;
    const coins = [];
    un.list.forEach(ev => ev.c.forEach((n, r) => { for (let i = 0; i < n; i++) coins.push(r); }));
    shuffle(coins);
    const shown = coins.slice(0, 40);
    const total = z();
    coins.forEach(r => { total[r]++; });
    const keys = un.list.map(ev => ev.key);
    const notes = un.list.filter(ev => ev.n).map(ev => `<p class="note" style="margin-top:6px">${esc(nameOf(ev.a))}: “${esc(ev.n)}”</p>`).join('');
    const from = [...new Set(un.list.map(ev => ev.a))].map(nameOf);
    const html = sheetHead(`You got ${bucks(un.count)}`, `from ${esc(joinWords(from))}`) + notes
      + `<p class="small soft" style="margin-top:10px">Tap a coin to flip it.${coins.length > shown.length ? ` Showing ${shown.length} of ${fmtInt(coins.length)}.` : ''}</p>`
      + `<div class="rv-grid">${shown.map((r, i) => `<button type="button" class="rv r${r}" data-act="flip" data-i="${i}" aria-label="Flip coin ${i + 1}"><span class="face front">${mysterySVG()}</span><span class="face back">${coinSVG(r, 40)}</span></button>`).join('')}</div>`
      + `<div id="rv-sum"></div>`
      + `<button type="button" class="btn btn-ghost btn-block mt" id="rv-all">Flip all</button>`;
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      $('#rv-all').hidden = true;
      $('#rv-sum').innerHTML = `<div class="rv-sum"><h3>${total[5] ? 'A Mythic!' : total[4] ? 'A Legendary!' : 'Nice haul'}</h3><div class="chips">${coinChips(total)}</div><button type="button" class="btn btn-grape btn-block mt" data-act="close-sheet">Nice</button></div>`;
      if (total[3] || total[4] || total[5]) confetti(total[5] ? 90 : 50);
    };
    openSheet('reveal', html, () => {
      $('#rv-all').addEventListener('click', () => {
        $$('.rv').forEach((b, i) => setTimeout(() => b.classList.add('flipped'), i * 40));
        setTimeout(finish, shown.length * 40 + 450);
      });
    }, {
      flip: b => { b.classList.add('flipped'); if ($$('.rv:not(.flipped)').length === 0) setTimeout(finish, 450); },
      onClose: () => { priv.seen = (priv.seen || []).concat(keys).slice(-600); savePriv(); recompute(); }
    });
  }

  function confetti(n) {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const box = document.createElement('div');
    box.className = 'confetti';
    const cols = ['#FF4F8B', '#FFB347', '#5BE38A', '#3EC1FF', '#9B5CFF', '#FFE066'];
    for (let i = 0; i < (n || 50); i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = cols[i % cols.length];
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDelay = (Math.random() * 0.4) + 's';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2600);
  }

  let toastT = 0;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = true;
    void el.offsetWidth;
    el.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { el.hidden = true; }, 2800);
  }

  /* ================= events ================= */
  const ACT = {
    'tab': b => { if (b.dataset.tab === 'chats' && ui.tab === 'chats') ui.dmWith = null; ui.tab = b.dataset.tab; ui.dmScroll = ''; closeSheet(true); render(); if (!(ui.tab === 'chats' && ui.dmWith)) window.scrollTo(0, 0); },
    'settings': () => openSettings(),
    'send': b => openSend(b.dataset.u || null),
    'new-trade': b => openTrade(b.dataset.u || null),
    'reveal': () => openReveal(),
    'flip': b => { if (sheet && sheet.flip) sheet.flip(b); },
    'close-sheet': () => closeSheet(),
    'cat': b => { ui.shopCat = b.dataset.cat; render(); },
    'shop-cat': b => { ui.shopCat = b.dataset.cat; ui.tab = 'shop'; render(); window.scrollTo(0, 0); },
    'item': b => openItem(b.dataset.id),
    'buy': b => doBuy(b.dataset.id),
    'item-wear': b => wearToggle(b.dataset.id),
    'item-turn': () => { if (sheet && sheet.toggleBack) sheet.toggleBack(); },
    'item-emote': b => { if (b.dataset.e) playEmote($('#item-av .av'), b.dataset.e); },
    'equip': b => doEquip(b.dataset.slot, b.dataset.inst || null),
    'emote-pick': b => { const inst = b.dataset.inst; doEquip('emote', inst === 'wave' ? null : inst); const e = inst === 'wave' ? 'wave' : CAT[L.items[inst].it].emote; setTimeout(() => playEmote($('#closet-av .av'), e), 60); },
    'emote-me': () => playEmote($('#closet-av .av'), emoteOf(uid)),
    'turn': () => { ui.closetBack = !ui.closetBack; render(); },
    'edit-look': () => { closeSheet(true); ui.lookDraft = Object.assign({}, meDoc.avatar || DEFAULT_LOOK); ui.editingLook = true; render(); window.scrollTo(0, 0); },
    'look': b => { const k = b.dataset.k; let v = b.dataset.v; if (k === 'blush') v = v === 'true'; ui.lookDraft[k] = v; renderLook(); },
    'look-wave': () => playEmote($('.stage-btn .av'), 'wave'),
    'look-save': () => saveLook(),
    'look-cancel': () => { ui.editingLook = false; ui.lookDraft = null; render(); },
    'setup': () => doSetup(),
    'register': () => doRegister(),
    'login': () => doLogin(),
    'auth-mode': b => { ui.authMode = b.dataset.m; render(); },
    'logout': () => { closeSheet(true); if (FB && auth) FB.signOut(auth); },
    'profile': b => openProfile(b.dataset.u),
    'prof-emote': b => playEmote($('#prof-av .av'), b.dataset.e),
    'qamt': b => { const el = $('#s-amt'); if (el) el.value = b.dataset.v; },
    'shop-mode': b => { ui.shopMode = b.dataset.m; render(); },
    'dm-open': b => { ui.dmWith = b.dataset.u; ui.dmDraft = ''; ui.dmScroll = ''; ui.tab = 'chats'; closeSheet(true); render(); },
    'dm-back': () => { ui.dmWith = null; ui.dmDraft = ''; render(); window.scrollTo(0, 0); },
    'dm-send': () => doSendDM(),
    'shop-farm': () => { ui.shopMode = 'farm'; ui.tab = 'shop'; render(); window.scrollTo(0, 0); },
    'farm-equip': b => { if (!guardWrite()) return; meDoc.farmEquip = Object.assign({}, meDoc.farmEquip || {}); meDoc.farmEquip[b.dataset.b] = b.dataset.id || null; savePlayer(); recompute(); },
    'farm-use': b => { const it = CAT[b.dataset.id]; if (!it || !guardWrite()) return; meDoc.farmEquip = Object.assign({}, meDoc.farmEquip || {}); const on = meDoc.farmEquip[it.b] === it.id; meDoc.farmEquip[it.b] = on ? null : it.id; savePlayer(); recompute(); toast(on ? 'Back to the default look' : `Your ${it.bname.toLowerCase()} uses it now`); },
    'mint-more': () => openMintMore(),
    'swap': () => openSwap(),
    'swap-r': b => { ui.swapR = Number(b.dataset.r); ui.swapN = 1; if (sheet && sheet.refresh) sheet.refresh(); },
    'swap-n': b => {
      const av = availOf(uid), vault = availOf(L.issuer), r = ui.swapR;
      const maxN = Math.max(1, Math.min(1000, Math.floor(av[r] / SWAP[r]), vault[r + 1]));
      ui.swapN = b.dataset.d === 'max' ? maxN : Math.max(1, Math.min(maxN, (ui.swapN || 1) + Number(b.dataset.d)));
      if (sheet && sheet.refresh) sheet.refresh();
    },
    'swap-go': () => {
      const r = ui.swapR, n = ui.swapN || 1, av = availOf(uid), vault = availOf(L.issuer);
      if (av[r] < SWAP[r] * n) return toast(`You need ${fmtInt(SWAP[r] * n)} ${RN[r]}.`);
      if (vault[r + 1] < n) return toast(`The vault only has ${fmtInt(vault[r + 1])} ${RN[r + 1]}.`);
      newEntry('swap', { r, n });
      toast(`Upgraded ${fmtInt(SWAP[r] * n)} ${RN[r]} into ${fmtInt(n)} ${RN[r + 1]}`);
      ui.swapN = 1;
      if (sheet && sheet.refresh) sheet.refresh();
    },
    'mm-q': b => { const el = $('#mm-amt'); if (el) el.value = b.dataset.v; },
    'step': b => {
      const el = $('#' + b.dataset.p + '-' + b.dataset.r);
      if (!el) return;
      const max = Number(el.dataset.max) || 0;
      const v = (parseInt(el.value.replace(/\D/g, ''), 10) || 0) + Number(b.dataset.d);
      el.value = String(Math.max(0, Math.min(max, v)));
    },
    'ipick': b => b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')),
    'accept': b => {
      if (!guardWrite()) return;
      const o = L.offers[b.dataset.o];
      if (!o || o.status !== 'open' || o.to !== uid) return;
      const prob = offerProblem(o);
      if (prob) { toast(prob); return; }
      newEntry('accept', { o: o.key });
      toast(`Trade done with ${nameOf(o.from)}`);
    },
    'decline': b => { if (!guardWrite()) return; const o = L.offers[b.dataset.o]; if (o && o.status === 'open' && o.to === uid) { newEntry('decline', { o: o.key }); toast('Offer declined'); } },
    'cancel': b => { if (!guardWrite()) return; const o = L.offers[b.dataset.o]; if (o && o.status === 'open' && o.from === uid) { newEntry('cancel', { o: o.key }); toast('Offer cancelled'); } }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = ACT[b.dataset.act];
    if (fn) { e.preventDefault(); fn(b, e); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target && e.target.id) { if (e.target.id.startsWith('li-')) { e.preventDefault(); doLogin(); return; } if (e.target.id.startsWith('su-')) { e.preventDefault(); doRegister(); return; } }
    if ($('#sheet-root').hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); return; }
    if (e.key === 'Tab') {
      const f = $$('#sheet button:not([disabled]):not([hidden]), #sheet input:not([hidden])').filter(el => el.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === $('#sheet'))) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  $$('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  setInterval(() => { if (ui.screen === 'main' && !sheet && !document.hidden && (ui.tab === 'wallet' || ui.tab === 'feed')) render(); }, 60000);

  /* ================= boot ================= */
  const FB_VERSION = '12.15.0';
  async function loadFirebase() {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const mods = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(f => import(base + f)));
    return Object.assign({}, ...mods);
  }
  function onDbError(err) {
    ui.fatal = err && err.code === 'permission-denied' ? 'rules' : 'lost';
    render();
  }
  const docRef = path => ({ set: body => FB.setDoc(FB.doc(fs, path), body) });

  function endSession() {
    unsubs.forEach(fn => { try { fn(); } catch (e) { /* already stopped */ } });
    unsubs = [];
    authed = false; uid = null; uname = ''; isOwner = false;
    config = null; configLoaded = false; players = {}; playersLoaded = false;
    entriesSnap = {}; entriesLoaded = false; pendingEntries.clear();
    meDoc = null; creatingProfile = false; sessionSignup = null;
    dmFrom = {}; dmTo = {}; dmKnown = null; dmPending.clear(); ui.dmWith = null; ui.dmDraft = ''; ui.dmBlocked = false;
    priv = { seen: [] }; privLoaded = false; L = null;
    playerRef = null; privRef = null;
    if (ui.fatal === 'rules' || ui.fatal === 'lost') ui.fatal = '';
    ui.tab = 'wallet'; ui.editingLook = false; ui.lookDraft = null; ui.authMode = 'login';
    closeSheet(true);
  }

  function startSession(user) {
    if (authed && uid === user.uid) return;
    endSession();
    authed = true;
    uid = user.uid;
    uname = String(user.email || '').split('@')[0].toLowerCase();
    isOwner = uname === BANK;
    sessionSignup = pendingSignup && pendingSignup.username.toLowerCase() === uname ? pendingSignup : null;
    pendingSignup = null;
    playerRef = docRef('players/' + uid);
    privRef = docRef('private/' + uid);
    unsubs.push(FB.onSnapshot(FB.doc(fs, 'config/main'), snap => {
      config = snap.exists() ? clone(snap.data()) : null;
      configLoaded = true;
      ensurePhoneHash();
      recompute();
    }, onDbError));
    unsubs.push(FB.onSnapshot(FB.collection(fs, 'players'), qs => {
      const next = {};
      qs.forEach(d => { next[d.id] = d.data(); });
      players = next;
      if (next[uid] && !meDoc) meDoc = clone(next[uid]);
      playersLoaded = true;
      ensureProfile();
      ensurePhoneHash();
      recompute();
    }, onDbError));
    unsubs.push(FB.onSnapshot(FB.collection(fs, 'entries'), qs => {
      const next = {};
      qs.forEach(d => {
        const x = d.data({ serverTimestamps: 'estimate' });
        if (!x || typeof x.a !== 'string' || typeof x.i !== 'string') return;
        const e = Object.assign({}, x);
        e.t = x.st && typeof x.st.toMillis === 'function' ? x.st.toMillis() : (typeof x.ct === 'number' ? x.ct : 0);
        delete e.st;
        next[d.id] = e;
        pendingEntries.delete(d.id);
      });
      entriesSnap = next;
      entriesLoaded = true;
      recompute();
    }, onDbError));
    unsubs.push(FB.onSnapshot(FB.query(FB.collection(fs, 'dms'), FB.where('a', '==', uid)), qs => onDmSnap('from', qs), onDmError));
    unsubs.push(FB.onSnapshot(FB.query(FB.collection(fs, 'dms'), FB.where('to', '==', uid)), qs => onDmSnap('to', qs), onDmError));
    if (FARM_LIVE) unsubs.push(FB.onSnapshot(FB.collection(fs, 'farmResults'), qs => { const next = {}; qs.forEach(d => { next[d.id] = d.data(); }); farmResults = next; recompute(); }, () => {}));
    FB.getDoc(FB.doc(fs, 'private/' + uid)).then(snap => {
      if (snap.exists()) priv = Object.assign({ seen: [] }, clone(snap.data()));
      privLoaded = true;
      recompute();
    }).catch(() => { privLoaded = true; recompute(); });
    render();
  }

  async function boot() {
    render();
    let cfgMod = null;
    try { cfgMod = await import('./firebase-config.js'); } catch (e) { cfgMod = null; }
    const cfg = cfgMod && cfgMod.FIREBASE_CONFIG;
    const bank = String((cfgMod && cfgMod.BANK_USERNAME) || '').trim().replace(/^@/, '').toLowerCase();
    if (!cfg || !cfg.apiKey || /paste/i.test(cfg.apiKey) || !/^[a-z0-9_.]{3,16}$/.test(bank) || bank === 'change_me') { ui.fatal = 'notconfigured'; render(); return; }
    BANK = bank;
    FARM_LIVE = cfgMod.FARM_LIVE === true;
    try { FSK = await import('./farm-skins.js'); const st = document.createElement('style'); st.textContent = FSK.CSS; document.head.appendChild(st); } catch (e) { ui.fatal = 'noskins'; render(); return; }
    FARM_TESTERS = Array.isArray(cfgMod.FARM_TESTERS) ? cfgMod.FARM_TESTERS.map(x => String(x).trim().replace(/^@/, '').toLowerCase()) : [];
    try { FB = await loadFirebase(); } catch (e) { ui.fatal = 'offline'; render(); return; }
    const fbApp = FB.initializeApp(cfg);
    auth = FB.getAuth(fbApp);
    fs = FB.getFirestore(fbApp);
    FB.onAuthStateChanged(auth, user => {
      authReady = true;
      if (user) startSession(user);
      else { endSession(); render(); }
    });
  }

  boot();
</script>
</body>
</html>
