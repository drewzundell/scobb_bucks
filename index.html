<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScobbBucks</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #F3EEFF;
  --card: #FFFFFF;
  --card-2: #F6F1FF;
  --ink: #24113F;
  --soft: #6A5A86;
  --line: #E2D7F6;
  --grape: #6C2BD9;
  --grape-deep: #4A16A6;
  --grape-tint: #EBE1FF;
  --on-grape: #FFFFFF;
  --lime: #9BE33A;
  --lime-deep: #5C9A12;
  --on-lime: #1E3205;
  --tomato: #E9453C;
  --tomato-deep: #A52A23;
  --shadow: rgba(52, 22, 107, .16);
  --scrim: rgba(28, 10, 56, .46);
  --rt0: #5C6878; --rt1: #167F40; --rt2: #1C60C8; --rt3: #7429DB; --rt4: #A85B00; --rt5: #C8105A;
  --rb0: #C9D0DA; --rb1: #84DBA4; --rb2: #92BCFF; --rb3: #CDA8FF; --rb4: #FFC66B; --rb5: #FF8DB8;
  --font: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #150A29; --card: #22133F; --card-2: #2B1A4F; --ink: #F3ECFF; --soft: #B6A6D6; --line: #3B2868;
    --grape: #8C58FF; --grape-deep: #5A2FD0; --grape-tint: #33205E; --on-grape: #FFFFFF;
    --lime: #A6EC47; --lime-deep: #5C9A12; --on-lime: #1E3205;
    --tomato: #FF6A60; --tomato-deep: #B3332B;
    --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .62);
    --rt0: #B9C2CE; --rt1: #5BD98A; --rt2: #6EAAFF; --rt3: #C18FFF; --rt4: #FFBE57; --rt5: #FF72A6;
    --rb0: #5A6472; --rb1: #2E8F55; --rb2: #2F64B8; --rb3: #6B3BB8; --rb4: #A86C12; --rb5: #B8326A;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #150A29; --card: #22133F; --card-2: #2B1A4F; --ink: #F3ECFF; --soft: #B6A6D6; --line: #3B2868;
  --grape: #8C58FF; --grape-deep: #5A2FD0; --grape-tint: #33205E; --on-grape: #FFFFFF;
  --lime: #A6EC47; --lime-deep: #5C9A12; --on-lime: #1E3205;
  --tomato: #FF6A60; --tomato-deep: #B3332B;
  --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .62);
  --rt0: #B9C2CE; --rt1: #5BD98A; --rt2: #6EAAFF; --rt3: #C18FFF; --rt4: #FFBE57; --rt5: #FF72A6;
  --rb0: #5A6472; --rb1: #2E8F55; --rb2: #2F64B8; --rb3: #6B3BB8; --rb4: #A86C12; --rb5: #B8326A;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
[hidden] { display: none !important; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }
#app { max-width: 480px; margin: 0 auto; padding: 14px 18px 40px; }
body.has-tabs #app { padding-bottom: 120px; }
h1 { font-size: 32px; line-height: 1.05; font-weight: 800; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 20px; line-height: 1.2; font-weight: 800; margin: 26px 0 8px; }
h3 { font-size: 16px; line-height: 1.2; font-weight: 800; margin: 20px 0 8px; }
p { margin: 0; }
.soft { color: var(--soft); }
.small { font-size: 14px; line-height: 1.4; }
.mt { margin-top: 22px; }
.rc0 { color: var(--rt0); } .rc1 { color: var(--rt1); } .rc2 { color: var(--rt2); } .rc3 { color: var(--rt3); } .rc4 { color: var(--rt4); } .rc5 { color: var(--rt5); }
.ic { width: 22px; height: 22px; display: block; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 16px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 24px; padding: 16px; }
.link { border: 0; background: none; padding: 0; color: var(--grape); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

/* buttons: gummy */
.btn { border: 0; border-radius: 16px; height: 52px; padding: 0 20px; font: 800 17px/1 var(--font); transition: transform .08s ease, box-shadow .08s ease; margin-bottom: 5px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-grape { background: var(--grape); color: var(--on-grape); box-shadow: 0 5px 0 var(--grape-deep); }
.btn-lime { background: var(--lime); color: var(--on-lime); box-shadow: 0 5px 0 var(--lime-deep); }
.btn-ghost { background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn-danger { background: var(--tomato); color: #fff; box-shadow: 0 5px 0 var(--tomato-deep); }
.btn:active:not(:disabled) { transform: translateY(4px); }
.btn-grape:active:not(:disabled) { box-shadow: 0 1px 0 var(--grape-deep); }
.btn-lime:active:not(:disabled) { box-shadow: 0 1px 0 var(--lime-deep); }
.btn-ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn-danger:active:not(:disabled) { box-shadow: 0 1px 0 var(--tomato-deep); }
.btn-block { display: block; width: 100%; }
.btn-sm { height: 40px; padding: 0 14px; font-size: 15px; border-radius: 13px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.icon-btn { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--ink); }

/* message screens */
.msg { min-height: 72vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; padding: 0 10px; }
.msg h1 { font-size: 28px; }
.msg p { max-width: 34ch; color: var(--soft); }
.blob { width: 110px; height: 110px; }
.blob .av { width: 100%; height: 100%; }

/* forms */
.field { margin-top: 18px; }
.field > label, .field > .label { display: block; font-weight: 800; font-size: 15px; margin-bottom: 6px; }
.hint { font-size: 14px; color: var(--soft); margin-top: 6px; }
.err { font-size: 14px; color: var(--tomato); margin-top: 6px; font-weight: 700; }
.err[hidden] { display: none; }
input[type="text"], input[type="tel"], input[type="password"] { width: 100%; height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 17px; font-weight: 600; outline: none; }
input::placeholder { color: var(--soft); opacity: .75; font-weight: 500; }
input:focus { border-color: var(--grape); }
.at { position: relative; }
.at > span { position: absolute; left: 14px; top: 50%; transform: translateY(-52%); font-weight: 800; color: var(--soft); pointer-events: none; font-size: 18px; }
.at input { padding-left: 32px; }

/* setup */
.odds { margin-top: 16px; border-top: 2px solid var(--line); }
.odds div { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 2px solid var(--line); font-weight: 700; }
.odds div b { margin-left: auto; font-weight: 800; }
.odds div span.small { min-width: 52px; text-align: right; }

/* wallet */
.me-chip { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 14px 3px 3px; font-weight: 800; min-width: 0; }
.me-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb { flex: none; display: inline-block; border-radius: 50%; background: var(--card-2); overflow: hidden; }
.hb .av { width: 100%; height: 100%; display: block; }
.bal-label { font-weight: 800; color: var(--soft); }
.bal-num { font: 800 58px/1 var(--font); letter-spacing: -0.02em; margin: 6px 0 14px; display: flex; align-items: center; gap: 10px; }
.rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rcell { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 6px; row-gap: 2px; background: var(--card-2); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.rcell .rval { font-size: 19px; font-weight: 800; line-height: 1.1; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rcell .rn { grid-column: 1 / -1; font-size: 12.5px; font-weight: 800; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bal .small { margin-top: 10px; }
.banner { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 14px; padding: 14px; border-radius: 20px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; }
.banner.gift { background: var(--grape-tint); border-color: transparent; }
.banner .bt { flex: 1; min-width: 0; }
.banner .pill { flex: none; background: var(--grape); color: var(--on-grape); border-radius: 999px; padding: 6px 14px; font-weight: 800; box-shadow: 0 3px 0 var(--grape-deep); }
.farm-card { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 20px; background: linear-gradient(120deg, #DFF5C8, #FFF1B8); border: 2px solid #CDE8B0; color: #1F2A14; text-decoration: none; font-weight: 700; }
.farm-card .fe { font-size: 34px; line-height: 1; }
.farm-card .ft { flex: 1; min-width: 0; }
.farm-card .ft b { display: block; font-size: 18px; line-height: 1.2; }
.farm-card .ft span { font-size: 14px; color: #4E5E3E; }
.farm-card .go { flex: none; background: #6C2BD9; color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; box-shadow: 0 3px 0 #4A16A6; }
.scard .thumb .fsk, .wthumb .fsk, .it-tag .tb .fsk { width: 100%; height: 100%; display: block; }
.fprev svg { width: 100%; max-width: 320px; display: block; margin: 6px auto 0; border-radius: 18px; }
.dm-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; margin-top: 8px; color: var(--ink); font: inherit; }
.dm-row .dt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.dm-row .dt span { font-size: 14.5px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dm-row .dt .un { font-weight: 800; color: var(--ink); }
.dm-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.dm-dot { min-width: 20px; height: 20px; border-radius: 10px; background: var(--tomato); color: #fff; font-size: 12px; font-weight: 800; font-style: normal; display: grid; place-items: center; padding: 0 6px; }
.dm-pick { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink); min-width: 66px; padding: 4px; }
.dm-thread { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 4px 0 12px; min-height: calc(100vh - 250px); min-height: calc(100dvh - 250px); }
.bub { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; white-space: pre-wrap; }
.bub.them { align-self: flex-start; background: var(--card); border: 2px solid var(--line); border-bottom-left-radius: 6px; }
.bub.me { align-self: flex-end; background: var(--grape); color: var(--on-grape); border-bottom-right-radius: 6px; }
.bub.pend { opacity: .6; }
.dm-time { text-align: center; font-size: 12.5px; color: var(--soft); margin: 8px 0 2px; }
.dm-compose { position: sticky; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; padding: 8px 0; background: var(--bg); }
.dm-compose input { flex: 1; min-width: 0; }
.top-right { display: flex; gap: 8px; }
a.icon-btn { text-decoration: none; font-size: 22px; }
.wiggle-in { animation: wig .9s ease 1; }
@keyframes wig { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-3deg); } 40% { transform: rotate(3deg); } 60% { transform: rotate(-2deg); } 80% { transform: rotate(1deg); } }

/* lists */
.ev { display: flex; gap: 12px; padding: 12px 0; border-bottom: 2px solid var(--line); align-items: flex-start; }
.ev:last-child { border-bottom: 0; }
.ev .main { flex: 1; min-width: 0; }
.ev .t { font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.ev .t b { font-weight: 800; }
.ev .s { color: var(--soft); font-size: 14px; overflow-wrap: anywhere; }
.ev .note { margin-top: 2px; font-size: 15px; overflow-wrap: anywhere; }
.ev .when { flex: none; color: var(--soft); font-size: 13px; white-space: nowrap; padding-top: 2px; }
.ev.hot { background: linear-gradient(90deg, rgba(255, 45, 122, .10), transparent 70%); border-radius: 14px; padding-left: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.cc { display: inline-flex; align-items: center; gap: 4px; background: var(--card-2); border-radius: 999px; padding: 2px 10px 2px 2px; font-weight: 800; font-size: 14px; }
.cc .tok { flex: none; }
.it-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--card-2); border-radius: 999px; padding: 2px 10px 2px 2px; font-weight: 700; font-size: 14px; }
.it-tag .tb { width: 26px; height: 26px; border-radius: 50%; background: var(--card); overflow: hidden; }
.it-tag .tb .av { width: 100%; height: 100%; }
.empty { padding: 18px 0; color: var(--soft); }

/* shop */
.mini-bal { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -18px; padding-left: 18px; padding-right: 18px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.cat { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: 15px; color: var(--ink); }
.cat.on { background: var(--grape); border-color: var(--grape); color: var(--on-grape); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
.scard { position: relative; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 10px; border-radius: 20px; border: 2px solid var(--rb0); background: var(--card); color: var(--ink); }
.rb0 { border-color: var(--rb0); } .rb1 { border-color: var(--rb1); } .rb2 { border-color: var(--rb2); } .rb3 { border-color: var(--rb3); } .rb4 { border-color: var(--rb4); }
.rb5 { border-color: transparent; background: linear-gradient(var(--card), var(--card)) padding-box, linear-gradient(120deg, #FF4F8B, #FFB347, #5BE38A, #3EC1FF, #9B5CFF) border-box; }
.scard .thumb { position: relative; display: block; aspect-ratio: 1; border-radius: 14px; background: var(--card-2); overflow: hidden; }
.scard .thumb .av { width: 100%; height: 100%; display: block; }
.scard .nm { font-weight: 800; line-height: 1.15; margin-top: 4px; }
.scard .pr { display: flex; align-items: center; gap: 4px; font-weight: 800; }
.scard .pr .rt { font-size: 13px; }
.scard .own { position: absolute; top: 14px; right: 14px; background: var(--lime); color: var(--on-lime); border-radius: 999px; padding: 0 9px; font-size: 13px; font-weight: 800; }
.play { position: absolute; bottom: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--grape); color: #fff; display: grid; place-items: center; }
.play .ic { width: 14px; height: 14px; }

/* closet */
.stage { display: grid; place-items: center; }
.stage-btn { border: 0; padding: 6px 0 0; width: 100%; border-radius: 28px; background: radial-gradient(closest-side, var(--card) 0%, var(--card) 55%, transparent 100%); display: grid; place-items: center; }
.av.big { width: min(270px, 70vw); height: auto; display: block; }
.stage-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
.wchip { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 96px; padding: 8px 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 13.5px; line-height: 1.15; text-align: center; }
.wchip.on { border-color: var(--grape); box-shadow: inset 0 0 0 2px var(--grape); }
.wchip.none { justify-content: center; min-height: 104px; color: var(--soft); }
.wthumb { width: 64px; height: 64px; border-radius: 12px; background: var(--card-2); overflow: hidden; display: block; }
.wthumb .av { width: 100%; height: 100%; display: block; }
.echip { flex: none; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-weight: 800; color: var(--ink); }
.echip.on { background: var(--grape); border-color: var(--grape); color: var(--on-grape); }

/* trades */
.offer { margin-top: 12px; }
.offer-head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.offer-head .bt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.offer-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.offer-cols > div { background: var(--card-2); border-radius: 16px; padding: 10px; min-width: 0; }
.offer-cols .lbl { font-weight: 800; font-size: 14px; color: var(--soft); }
.offer .note { margin-top: 10px; overflow-wrap: anywhere; }
.offer .warn { margin-top: 10px; color: var(--tomato); font-weight: 700; font-size: 14px; }
.status { display: inline-block; border-radius: 999px; padding: 0 10px; font-size: 13px; font-weight: 800; background: var(--card-2); color: var(--soft); }
.status.done { background: var(--lime); color: var(--on-lime); }

/* feed */
.players { margin-top: 4px; }
.pl { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 74px; border: 0; background: none; padding: 0; color: var(--ink); font-weight: 700; font-size: 13px; }
.pl span:last-child { max-width: 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .hb { border: 2px solid var(--line); }

/* look editor */
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--card); background: var(--sw); box-shadow: 0 0 0 2px var(--line); padding: 0; }
.sw.on { box-shadow: 0 0 0 3px var(--grape); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-weight: 700; font-size: 14px; }
.opt.on { border-color: var(--grape); box-shadow: inset 0 0 0 2px var(--grape); }
.opt .face { width: 100%; aspect-ratio: 100 / 66; display: block; }
.opt .face .av { width: 100%; height: 100%; display: block; }

/* sheets */
.sheet-root { position: fixed; inset: 0; z-index: 40; }
.sheet-root[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fade .2s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 18px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 40px var(--shadow); animation: rise .3s cubic-bezier(.2, .9, .25, 1.05) both; outline: none; }
.grabber { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.sheet-head h2 { margin: 2px 0 0; font-size: 24px; overflow-wrap: anywhere; }
.sheet-head .sub { color: var(--soft); margin-top: 2px; }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; color: var(--ink); }
.x .ic { width: 18px; height: 18px; }
@keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.results { margin-top: 6px; }
.res { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 14px; background: none; text-align: left; color: var(--ink); }
.res:hover, .res:focus-visible { background: var(--card-2); }
.picked { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border: 2px solid var(--grape); border-radius: 16px; background: var(--card); }
.picked[hidden] { display: none; }

.rv .face .tok { width: 100%; height: 100%; }
.rv .back { transform: rotateY(180deg); }

.rv.flipped .back { transform: rotateY(0deg); }

  /* ================= ledger replay ================= */
  const okCoins = c => Array.isArray(c) && c.length === 6 && c.every(n => Number.isInteger(n) && n >= 0 && n <= 1000000);
  const okItems = a => Array.isArray(a) && a.length <= 24 && a.every(s => typeof s === 'string' && s.length < 160) && new Set(a).size === a.length;
  const str = n => (typeof n === 'string' ? n.slice(0, 120) : '');

  // Upgrade coins with the vault: SWAP[r] coins of rarity r buy 1 coin of rarity r + 1.
  const SWAP = [3, 3, 3, 4, 5];
  function replay(cfg, pl) {
    const issuer = cfg.issuer;
    const bal = Object.create(null);
    const get = u => bal[u] || (bal[u] = z());
    bal[issuer] = cfg.caps.slice();
    const total = cfg.caps.slice();
    const items = Object.create(null);
    const offers = Object.create(null);
    const events = [];
    const bad = Object.create(null);
    const all = [];
    for (const u of Object.keys(pl)) {
      const p = pl[u];
      if (!p || !Array.isArray(p.log)) continue;
      const seen = new Set();
      for (const e of p.log) {
        if (!e || typeof e.i !== 'string' || seen.has(e.i) || typeof e.t !== 'number' || typeof e.k !== 'string') continue;
        seen.add(e.i);
        all.push({ e, a: u, key: u + ':' + e.i });
      }
    }
    all.sort((x, y) => (x.e.t - y.e.t) || (x.a < y.a ? -1 : x.a > y.a ? 1 : 0) || ((x.e.q || 0) - (y.e.q || 0)));
    const has = (u, c) => { const b = get(u); return c.every((n, r) => b[r] >= n); };
    const move = (f, t, c) => { const bf = get(f), bt = get(t); c.forEach((n, r) => { bf[r] -= n; bt[r] += n; }); };
    const owns = (u, list) => list.every(id => items[id] && items[id].owner === u);
    let maxT = 0;
    for (const { e, a, key } of all) {
      if (e.t > maxT) maxT = e.t;
      if (e.k === 'send') {
        if (!pl[e.to] || e.to === a) { bad[key] = 'nobody'; continue; }
        if (!okCoins(e.c) || sumC(e.c) < 1) { bad[key] = 'shape'; continue; }
        if (!has(a, e.c)) { bad[key] = 'funds'; continue; }
        move(a, e.to, e.c);
        events.push({ k: 'send', key, a, to: e.to, c: e.c.slice(), n: str(e.n), t: e.t, drop: a === issuer });
      } else if (e.k === 'mint') {
        if (a !== issuer) { bad[key] = 'who'; continue; }
        if (!okCoins(e.c) || sumC(e.c) < 1 || sumC(e.c) > 5000) { bad[key] = 'shape'; continue; }
        const b = get(issuer);
        e.c.forEach((n, r) => { b[r] += n; total[r] += n; });
        events.push({ k: 'mint', key, a, c: e.c.slice(), t: e.t });
      } else if (e.k === 'swap') {
        if (a === issuer) { bad[key] = 'who'; continue; }
        const r = e.r, n = e.n;
        if (!Number.isInteger(r) || r < 0 || r > 4 || !Number.isInteger(n) || n < 1 || n > 1000) { bad[key] = 'shape'; continue; }
        const give = z(), got = z();
        give[r] = SWAP[r] * n; got[r + 1] = n;
        if (!has(a, give)) { bad[key] = 'funds'; continue; }
        if (!has(issuer, got)) { bad[key] = 'vault'; continue; }
        move(a, issuer, give);
        move(issuer, a, got);
        events.push({ k: 'swap', key, a, r, n, t: e.t });
      } else if (e.k === 'buy') {
        const it = CAT[e.it];
        if (!it || it.free) { bad[key] = 'item'; continue; }
        if (!inShopAt(e.it, e.t, cfg.salt)) { bad[key] = 'gone'; continue; }
        const price = priceOf(it);
        if (!okCoins(e.c) || !sameC(e.c, price)) { bad[key] = 'price'; continue; }
        if (!has(a, price)) { bad[key] = 'funds'; continue; }
        move(a, issuer, price);
        items[key] = { it: e.it, owner: a, t: e.t };
        events.push({ k: 'buy', key, a, it: e.it, t: e.t });
      } else if (e.k === 'offer') {
        if (!pl[e.to] || e.to === a) { bad[key] = 'nobody'; continue; }
        const gc = e.gc || z(), wc = e.wc || z(), gi = e.gi || [], wi = e.wi || [];
        if (!okCoins(gc) || !okCoins(wc) || !okItems(gi) || !okItems(wi)) { bad[key] = 'shape'; continue; }
        if (sumC(gc) + gi.length < 1 || sumC(wc) + wi.length < 1) { bad[key] = 'empty'; continue; }
        offers[key] = { key, from: a, to: e.to, gc: gc.slice(), wc: wc.slice(), gi: gi.slice(), wi: wi.slice(), n: str(e.n), t: e.t, status: 'open', end: 0, why: '' };
      } else if (e.k === 'cancel' || e.k === 'decline' || e.k === 'accept') {
        const o = offers[e.o];
        if (!o || o.status !== 'open') { bad[key] = 'closed'; continue; }
        if (e.k === 'cancel') {
          if (o.from !== a) { bad[key] = 'who'; continue; }
          o.status = 'cancelled'; o.end = e.t; continue;
        }
        if (o.to !== a) { bad[key] = 'who'; continue; }
        if (e.k === 'decline') { o.status = 'declined'; o.end = e.t; continue; }
        o.end = e.t;
        if (!has(o.from, o.gc)) { o.status = 'failed'; o.why = 'from-coins'; continue; }
        if (!has(o.to, o.wc)) { o.status = 'failed'; o.why = 'to-coins'; continue; }
        if (!owns(o.from, o.gi)) { o.status = 'failed'; o.why = 'from-items'; continue; }
        if (!owns(o.to, o.wi)) { o.status = 'failed'; o.why = 'to-items'; continue; }
        move(o.from, o.to, o.gc);
        move(o.to, o.from, o.wc);
        o.gi.forEach(id => { items[id].owner = o.to; });
        o.wi.forEach(id => { items[id].owner = o.from; });
        o.status = 'done';
        events.push({ k: 'trade', key, a: o.from, to: o.to, gc: o.gc, wc: o.wc, gi: o.gi.map(id => items[id].it), wi: o.wi.map(id => items[id].it), t: e.t });
      } else {

      }
    }

  /* ================= state ================= */

  /* ================= saving ================= */
  const wq = { chain: Promise.resolve(), queued: false };

  /* ================= phone ================= */
  function normPhone(s) {
    let d = String(s || '').replace(/\D/g, '');

  const phoneCache = new Map();
  async function phoneKey(digits) {
    if (phoneCache.has(digits)) return phoneCache.get(digits);
    const enc = new TextEncoder();
    const k = await crypto.subtle.importKey('raw', enc.encode(digits), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode('scobbbucks:' + config.salt), iterations: 60000 }, k, 128);
    const h = Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
    phoneCache.set(digits, h);
    return h;
  }

  async function findPeople(q) {

    if (/^[\d\s()+.\-]+$/.test(q)) {
      const d = normPhone(q);
      if (!d) return [];
      const h = await phoneKey(d);
      return others.filter(u => players[u].phoneHash === h).map(u => ({ u, phone: true }));

    const lq = q.replace(/^@/, '').toLowerCase();

    const inc = others.filter(u => !(players[u].uname || '').startsWith(lq) && (players[u].uname || '').includes(lq));
    return starts.concat(inc).slice(0, 6).map(u => ({ u }));

  const FARM_PRIZES = [25];
  const prizeKeys = new Set();
  function payPrizes() {
    if (!FARM_LIVE || !L || !meDoc || !config || uid !== L.issuer || readOnly) return;
    const mine = myEntries();
    let pool = availOf(uid);
    for (const rid of Object.keys(farmResults)) {
      const r = farmResults[rid];
      if (!r || r.by !== uid || !Array.isArray(r.places)) continue;
      r.places.slice(0, FARM_PRIZES.length).forEach((winner, i) => {
        const key = rid + ':' + i;
        if (prizeKeys.has(key) || mine.some(e => e.pz === key)) return;
        if (!winner || winner === uid || !players[winner]) { prizeKeys.add(key); return; }
        if (sumC(pool) < FARM_PRIZES[i]) return;
        prizeKeys.add(key);
        const c = drawRandom(FARM_PRIZES[i], pool);
        pool = pool.map((n, k) => n - c[k]);
        newEntry('send', { to: winner, c, n: `Scobb Farm round ${r.n || ''} prize, ${['1st', '2nd', '3rd'][i]} place`, pz: key });
        toast(`Paid ${nameOf(winner)} ${bucks(FARM_PRIZES[i])} for Scobb Farm`);
      });
    }
  }
  function drawRandom(n, pool) {
    const p = pool.slice(), out = z();
    for (let k = 0; k < n; k++) {
      const tot = sumC(p);
      if (!tot) break;
      let x = Math.random() * tot;
      for (let r = 0; r < 6; r++) { if (x < p[r]) { out[r]++; p[r]--; break; } x -= p[r]; }
    }
    return out;
  }
