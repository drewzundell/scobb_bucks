<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scobb Farm</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #EEF7E6; --card: #FFFFFF; --card-2: #F3F9EC; --ink: #1F2A14; --soft: #5E6E4E; --line: #D8E8C8;
  --grape: #6C2BD9; --grape-deep: #4A16A6; --tint: #E6F4D7; --on-grape: #FFFFFF;
  --lime: #8ED435; --lime-deep: #528A10; --on-lime: #1E3205;
  --tomato: #E9453C; --tomato-deep: #A52A23; --gold: #C98A00;
  --shadow: rgba(40, 70, 20, .16); --scrim: rgba(20, 35, 10, .46);
  --font: "Baloo 2", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101A0B; --card: #1A2912; --card-2: #22351A; --ink: #EDF6E3; --soft: #A9BE95; --line: #2F4724;
    --grape: #8C58FF; --grape-deep: #5A2FD0; --tint: #26401A; --lime: #9BE33A; --lime-deep: #528A10;
    --tomato: #FF6A60; --tomato-deep: #B3332B; --gold: #FFC44D; --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .62);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101A0B; --card: #1A2912; --card-2: #22351A; --ink: #EDF6E3; --soft: #A9BE95; --line: #2F4724;
  --grape: #8C58FF; --grape-deep: #5A2FD0; --tint: #26401A; --lime: #9BE33A; --lime-deep: #528A10;
  --tomato: #FF6A60; --tomato-deep: #B3332B; --gold: #FFC44D; --shadow: rgba(0, 0, 0, .45); --scrim: rgba(0, 0, 0, .62);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { -webkit-appearance: none; appearance: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
:focus-visible { outline: 3px solid var(--grape); outline-offset: 2px; }
#app { max-width: 520px; margin: 0 auto; padding: 12px 16px 120px; }
h1 { font-size: 30px; line-height: 1.05; font-weight: 800; margin: 0; }
h2 { font-size: 20px; font-weight: 800; margin: 22px 0 8px; }
h3 { font-size: 16px; font-weight: 800; margin: 16px 0 6px; }
p { margin: 0; }
.soft { color: var(--soft); }
.small { font-size: 14px; line-height: 1.4; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 14px; }
.mt { margin-top: 16px; }
.btn { border: 0; border-radius: 16px; height: 50px; padding: 0 18px; font: 800 16px/1 var(--font); transition: transform .08s ease, box-shadow .08s ease; margin-bottom: 5px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-grape { background: var(--grape); color: var(--on-grape); box-shadow: 0 5px 0 var(--grape-deep); }
.btn-lime { background: var(--lime); color: var(--on-lime); box-shadow: 0 5px 0 var(--lime-deep); }
.btn-ghost { background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }
.btn-danger { background: var(--tomato); color: #fff; box-shadow: 0 5px 0 var(--tomato-deep); }
.btn:active:not(:disabled) { transform: translateY(4px); }
.btn-block { display: block; width: 100%; }
.btn-sm { height: 38px; padding: 0 14px; font-size: 14.5px; border-radius: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.link { border: 0; background: none; padding: 0; color: var(--grape); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 0 10px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 13px; font-weight: 800; background: var(--gold); color: #fff; vertical-align: middle; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 10px 14px; font-weight: 700; }
.status b { font-size: 22px; font-variant-numeric: tabular-nums; }
.res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.res div { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 4px 6px; text-align: center; }
.res span { display: block; font-size: 11.5px; font-weight: 800; color: var(--soft); }
.res b { font-size: 17px; font-variant-numeric: tabular-nums; }
.alert { margin-top: 8px; background: var(--tomato); color: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { from { opacity: .85; } to { opacity: 1; } }
.notice { margin-top: 8px; background: var(--tint); border-radius: 14px; padding: 8px 12px; font-weight: 700; font-size: 14px; }

.village { display: block; width: 100%; height: auto; border-radius: 22px; margin-top: 12px; box-shadow: 0 6px 0 var(--line); }
.village .spin { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
.village .bob { animation: bob 1.6s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

.blist { margin-top: 10px; }
.brow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 2px solid var(--line); }
.brow:last-child { border-bottom: 0; }
.brow .main { flex: 1; min-width: 0; }
.brow .t { font-weight: 800; }
.brow .s { font-size: 13.5px; color: var(--soft); }
.cost { font-size: 13.5px; font-weight: 700; }
.bar { height: 10px; border-radius: 6px; background: var(--card-2); overflow: hidden; margin-top: 6px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--lime); border-radius: 6px; }
.prog { margin-top: 10px; background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.prog .t { font-weight: 800; display: flex; justify-content: space-between; gap: 8px; }

.plist .pcard { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 2px solid var(--line); }
.pcard .main { flex: 1; min-width: 0; }
.pcard .t { font-weight: 800; overflow-wrap: anywhere; }
.pcard .s { font-size: 13.5px; color: var(--soft); }
.hb { flex: none; display: inline-block; border-radius: 50%; overflow: hidden; background: var(--card-2); }
.hb svg { width: 100%; height: 100%; display: block; }
.ev { padding: 8px 0; border-bottom: 2px solid var(--line); font-size: 14.5px; }
.ev:last-child { border-bottom: 0; }
.ev .when { color: var(--soft); font-size: 12.5px; }
.win { color: var(--lime-deep); font-weight: 800; }
.lose { color: var(--tomato); font-weight: 800; }

.price { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.field { margin-top: 12px; }
.field > label { display: block; font-weight: 800; font-size: 14.5px; margin-bottom: 4px; }
input[type="text"] { width: 100%; height: 48px; padding: 0 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 17px; font-weight: 600; outline: none; }
input[type="text"]:focus { border-color: var(--grape); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 14px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--grape); border-color: var(--grape); color: #fff; }
.quote { margin-top: 6px; font-weight: 700; font-size: 14.5px; min-height: 1.4em; }
.err { color: var(--tomato); font-weight: 700; font-size: 14px; margin-top: 6px; }
.step { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.sb { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 22px; font-weight: 800; padding: 0; color: var(--ink); }
.sv { width: 80px; height: 44px; text-align: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); font: 800 18px/1 var(--font); }

.chat { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.msg { display: flex; gap: 8px; align-items: flex-start; }
.msg .bub { background: var(--card); border: 2px solid var(--line); border-radius: 4px 16px 16px 16px; padding: 6px 10px; max-width: 82%; overflow-wrap: anywhere; }
.msg.me { flex-direction: row-reverse; }
.msg.me .bub { background: var(--tint); border-radius: 16px 4px 16px 16px; }
.msg .who { font-size: 12.5px; font-weight: 800; color: var(--soft); }
.sendrow { display: flex; gap: 8px; margin-top: 12px; }
.sendrow input { flex: 1; }
.sendrow .btn { height: 48px; margin: 0; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 2px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; border: 0; background: none; padding: 4px 0; color: var(--soft); font-weight: 800; font-size: 12.5px; }
.tab .ib { font-size: 20px; line-height: 30px; width: 52px; border-radius: 999px; }
.tab[aria-current="page"] { color: var(--grape); }
.tab[aria-current="page"] .ib { background: var(--tint); }
.badge { position: absolute; top: 0; left: calc(50% + 10px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--tomato); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; }

.sheet-root { position: fixed; inset: 0; z-index: 40; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 540px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -12px 40px var(--shadow); animation: rise .28s cubic-bezier(.2, .9, .25, 1.05) both; outline: none; }
@keyframes rise { from { transform: translateY(100%); } to { transform: none; } }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sheet-head h2 { margin: 4px 0 0; }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 18px; font-weight: 800; padding: 0; color: var(--ink); }
.toast-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; justify-content: center; padding: 0 16px calc(92px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.toast { max-width: 420px; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 15px; padding: 11px 15px; border-radius: 16px; box-shadow: 0 10px 30px var(--shadow); }
.msgscreen { min-height: 70vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; }
.msgscreen p { max-width: 34ch; color: var(--soft); }
.podium { display: grid; gap: 8px; margin-top: 10px; }
.podium .pcard { border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; background: var(--card); }
.place { font-size: 22px; font-weight: 800; width: 34px; text-align: center; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row3 .btn { width: 100%; padding: 0 6px; }
.mapbar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.world { position: relative; margin-top: 8px; height: 62vh; overflow: auto; border-radius: 22px; border: 2px solid var(--line); background: #7CBF55; cursor: grab; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.world.drag { cursor: grabbing; user-select: none; }
.world svg { display: block; }
.world .base-hit { cursor: pointer; }
.world .base-hit:hover { fill: rgba(255, 255, 255, .12); }
.village .hit { cursor: pointer; }
.village .hit:hover { filter: brightness(1.1); }
.mini { width: 34px; height: 34px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 800; font-size: 18px; padding: 0; color: var(--ink); }
.mini:disabled { opacity: .4; }
.jobs .brow .ctl { display: flex; align-items: center; gap: 6px; flex: none; }
.ucard { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-bottom: 2px solid var(--line); }
.ucard:last-child { border-bottom: 0; }
.ucard .ui { flex: none; width: 56px; height: 56px; border-radius: 16px; background: var(--card-2); border: 2px solid var(--line); display: grid; place-items: center; }
.ucard .ui .usvg { width: 50px; height: 50px; }
.ucard .main { flex: 1; min-width: 0; }
.ucard .t { font-weight: 800; }
.stats { font-size: 13px; color: var(--soft); font-weight: 700; }
.lock { font-size: 13px; font-weight: 800; color: var(--tomato); margin-top: 4px; }
.armyrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.uchip { display: inline-flex; align-items: center; gap: 2px; border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px 1px 2px; background: var(--card); font-weight: 800; font-size: 14px; }
.uchip .usvg { width: 28px; height: 28px; }
.seg { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.seg .chip { padding: 2px 10px; font-size: 13px; }
.preview { margin-top: 12px; border-radius: 14px; padding: 10px 12px; background: var(--card); border: 2px solid var(--line); font-size: 14.5px; }
@media (prefers-reduced-motion: reduce) { .village .spin, .village .bob, .alert, .sheet { animation: none; } }
</style>
</head>
<body>
<div id="app"><div class="msgscreen"><h1>Loading Scobb Farm…</h1></div></div>

<nav class="tabs" id="tabs" hidden aria-label="Scobb Farm">
  <button type="button" class="tab" data-act="tab" data-tab="base"><span class="ib" aria-hidden="true">🏡</span><span>Base</span></button>
  <button type="button" class="tab" data-act="tab" data-tab="map"><span class="ib" aria-hidden="true">🗺️</span><span>Map</span></button>
  <button type="button" class="tab" data-act="tab" data-tab="army"><span class="ib" aria-hidden="true">⚔️</span><span>Army</span><i class="badge" id="bd-army" hidden></i></button>
  <button type="button" class="tab" data-act="tab" data-tab="market"><span class="ib" aria-hidden="true">💰</span><span>Market</span></button>
  <button type="button" class="tab" data-act="tab" data-tab="chat"><span class="ib" aria-hidden="true">💬</span><span>Chat</span><i class="badge" id="bd-chat" hidden></i></button>
</nav>

<div class="sheet-root" id="sheet-root" hidden>
  <div class="backdrop" data-act="close"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div id="sheet-body"></div></div>
</div>
<div class="toast-wrap"><div class="toast" id="toast" role="status" hidden></div></div>

<script type="module">
  /* ================= setup ================= */
  let ENV = 'farmPreview', LIVE = false, FSK = null;
  const FB_VERSION = '12.15.0';
  const EMAIL_DOMAIN = '@scobbbucks.example.com';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const clone = o => JSON.parse(JSON.stringify(o));
  const fmt = n => Math.floor(Math.max(0, n)).toLocaleString('en-US');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]); }
  function rid() { const a = new Uint32Array(2); crypto.getRandomValues(a); return (a[0].toString(36) + a[1].toString(36)).slice(0, 10); }
  const plural = (n, one, many) => `${fmt(n)} ${Math.floor(n) === 1 ? one : many}`;
  function clock(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }
  function secs(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return s >= 60 ? clock(ms) : s + 's'; }

  const BODY = { grape: '#A98BF5', bubblegum: '#F78FB3', ruby: '#E85A68', tangerine: '#F79B54', lemon: '#F6D25A', lime: '#ABDB5A', mint: '#7EDDB0', teal: '#3FBFBD', sky: '#7CC4F2', cocoa: '#A6714E', slate: '#6E7B8C', snow: '#ECEDF2' };
  const colorOf = look => BODY[(look && look.color) || 'grape'] || BODY.grape;

  function faceSVG(look) {
    const ink = '#1E1B24';
    let e;
    switch (look.eyes) {
      case 'happy': e = `<path d="M78 66Q85 57 92 66M108 66Q115 57 122 66" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`; break;
      case 'sleepy': e = `<path d="M78 63Q85 69 92 63M108 63Q115 69 122 63" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`; break;
      case 'wide': e = `<circle cx="85" cy="63" r="9" fill="#fff"/><circle cx="115" cy="63" r="9" fill="#fff"/><circle cx="86.5" cy="64.5" r="4.6" fill="${ink}"/><circle cx="116.5" cy="64.5" r="4.6" fill="${ink}"/>`; break;
      case 'angry': e = `<circle cx="85" cy="66" r="5.5" fill="${ink}"/><circle cx="115" cy="66" r="5.5" fill="${ink}"/><path d="M76 54L93 59M124 54L107 59" stroke="${ink}" stroke-width="4" stroke-linecap="round"/>`; break;
      case 'wink': e = `<circle cx="85" cy="64" r="5.5" fill="${ink}"/><path d="M108 65Q115 59 122 65" stroke="${ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`; break;
      default: e = `<circle cx="85" cy="64" r="5.5" fill="${ink}"/><circle cx="115" cy="64" r="5.5" fill="${ink}"/><circle cx="86.6" cy="62.2" r="1.6" fill="#fff"/><circle cx="116.6" cy="62.2" r="1.6" fill="#fff"/>`;
    }
    let m = '';
    switch (look.mouth) {
      case 'grin': m = `<path d="M87 80H113Q112 95 100 95Q88 95 87 80Z" fill="${ink}"/><path d="M90 81H110V85H90Z" fill="#fff"/>`; break;
      case 'o': m = `<ellipse cx="100" cy="86" rx="5.5" ry="6.5" fill="${ink}"/>`; break;
      case 'flat': m = `<path d="M92 85H108" stroke="${ink}" stroke-width="3.6" stroke-linecap="round"/>`; break;
      case 'tongue': m = `<path d="M90 82Q100 90 110 82" stroke="${ink}" stroke-width="3.6" fill="none" stroke-linecap="round"/><path d="M96 86Q96 94 101 94Q106 94 106 86Z" fill="#FF6F91"/>`; break;
      case 'none': break;
      default: m = `<path d="M90 82Q100 91 110 82" stroke="${ink}" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;
    }
    const blush = look.blush ? '<ellipse cx="72" cy="78" rx="7" ry="4.5" fill="#FF7FA0" fill-opacity=".45"/><ellipse cx="128" cy="78" rx="7" ry="4.5" fill="#FF7FA0" fill-opacity=".45"/>' : '';
    return e + m + blush;
  }
  function headSVG(look) {
    look = look || {};
    const c = colorOf(look);
    return `<svg viewBox="48 14 104 104" aria-hidden="true"><circle cx="100" cy="66" r="45" fill="${c}"/><ellipse cx="80" cy="41" rx="14" ry="8" fill="#fff" fill-opacity=".38" transform="rotate(-24 80 41)"/>${faceSVG(look)}</svg>`;
  }
  const hb = (u, s) => `<span class="hb" style="width:${s}px;height:${s}px">${headSVG(lookOf(u))}</span>`;
  const scobb = (x, y, col, s, cls) => `<g transform="translate(${x} ${y}) scale(${s || 1})"><g class="${cls || ''}" style="animation-delay:${((x * 7 + y) % 13) / 10}s"><ellipse cx="0" cy="13" rx="8" ry="2.4" fill="#000" opacity=".15"/><rect x="-6" y="0" width="12" height="12" rx="6" fill="${col}"/><circle cx="0" cy="-3" r="7" fill="${col}"/><circle cx="-2.5" cy="-4" r="1.2" fill="#1E1B24"/><circle cx="2.5" cy="-4" r="1.2" fill="#1E1B24"/><ellipse cx="-2" cy="-7.5" rx="2.4" ry="1.3" fill="#fff" opacity=".5"/></g></g>`;

  /* ================= game rules ================= */
  const G = {
    MATCH_MS: 15 * 60000, JOIN_LATE_MS: 5 * 60000,
    START_J: 150, START_C: 150,
    FARM_RATE: 1.0, MINE_RATE: 0.6, HALL_GOLD: 0.3, MILL_BONUS: 0.15,
    FARM_CAP: 900, MINE_CAP: 700, MAX_W: 5, MIL_W: 3,
    MARCH_MS: 25000, SHIELD_MS: 60000, VIL_J: 30, VIL_MS: 5000,
    REPLANT_C: 50, REPLANT_MS: 10000,
    SELL: 0.5, BUY: 0.65, MONO_MIN: 8, ROUNDS: 8, QMAX: 30
  };

  const toInt = (v, lo, hi) => { const n = Math.floor(Number(v)); return Number.isFinite(n) && n >= lo && n <= hi ? n : null; };

  // A battle runs in rounds. Attackers break the walls, then fight the defenders' troops, then hit their target.
  // Towers and defenders shoot back, and their damage lands on the attackers' front line first.
  function battle(att, def, army, lines, tgt) {
    const A = {}, D = {};
    for (const u in army) if (army[u] > 0) A[u] = army[u] * UNITS[u].hp * mul(att, 'hp');
    for (const u in def.army) if (def.army[u] > 0) D[u] = def.army[u] * UNITS[u].hp * mul(def, 'hp');

    let wall = def.wall * wallPer, obj = 0, rounds = 0;
    const alive = (P, side) => { const o = {}; for (const u in P) { const n = Math.ceil(P[u] / (UNITS[u].hp * mul(side, 'hp')) - 1e-6); if (n > 0) o[u] = n; } return o; };
    const comp = o => { const tot = sumObj(o) || 1, c = {}; for (const u in o) { const tg = UNITS[u].tag; c[tg] = (c[tg] || 0) + o[u] / tot; } return c; };
    const cm = (u, c) => { const vs = UNITS[u].vs || {}; let m = 1; for (const tg in vs) m += (vs[tg] - 1) * (c[tg] || 0); return m; };
    const farmsCan = Math.max(0, Math.min(2, farmsOf(def) - 1)), minesCan = Math.min(1, minesOf(def));
    const milCan = MIL.some(b => def[b] > 0) ? 1 : 0;
    const need = tgt === 'farm' ? farmsCan * 60 : tgt === 'mine' ? minesCan * 60 : tgt === 'loot' ? hallHp * 0.6 : tgt === 'defense' ? def.tower * towerHp : milCan * milHp;
    for (rounds = 1; rounds <= G.ROUNDS; rounds++) {
      const nA = alive(A, att), nD = alive(D, def);
      if (!Object.keys(nA).length) { rounds -= 1; break; }
      const cD = comp(nD), cA = comp(nA);
      let troopDmg = 0, structDmg = 0;
      for (const u in nA) {
        const U = UNITS[u], base = nA[u] * U.atk * mul(att, 'atk');
        troopDmg += base * cm(u, cD) * (U.tag === 'siege' && u !== 'mech' ? 0.4 : 1);
        structDmg += base * (U.sx || 1);
      }
      // While the wall stands, half the effort goes into the wall and the rest hits defenders at 75% strength.
      let f = 1, cover = 1;
      if (wall > 0) { const use = Math.min(wall, structDmg * 0.5); wall -= use; f = structDmg > 0 ? 1 - use / structDmg : 0; cover = wall > 0 ? 0.75 : 1; }
      const dTot = sumObj(D);
      if (f > 0 && dTot > 1e-6) { const dmg = troopDmg * f * cover, use = Math.min(dTot, dmg); for (const u in D) D[u] = Math.max(0, D[u] - use * D[u] / dTot); f = dmg > 0 ? f * (1 - use / dmg) : 0; }
      if (f > 0 && wall <= 0 && sumObj(D) <= 1e-6) obj += structDmg * f;
      const towersUp = tgt === 'defense' ? Math.max(0, def.tower - Math.floor(obj / towerHp)) : def.tower;
      let dd = towersUp * 12 * dm;
      const nD2 = alive(D, def);
      for (const u in nD2) dd += nD2[u] * UNITS[u].atk * mul(def, 'atk') * cm(u, cA);
      for (let ln = 0; ln < 3 && dd > 0; ln++) {
        const us = Object.keys(A).filter(u => A[u] > 0 && (lines && lines[u] != null ? lines[u] : UNITS[u].line) === ln);
        const tot = us.reduce((a, u) => a + A[u], 0);
        if (!tot) continue;
        const use = Math.min(tot, dd);
        for (const u of us) A[u] = Math.max(0, A[u] - use * A[u] / tot);

    for (const u in army) if (army[u] > 0) R.aLoss[u] = army[u] - (aliveA[u] || 0);
    for (const u in def.army) if (def.army[u] > 0) R.dLoss[u] = def.army[u] - (aliveD[u] || 0);

    if (tgt === 'farm') R.farms = Math.min(farmsCan, Math.floor(obj / 60));
    if (tgt === 'mine') R.mines = Math.min(minesCan, Math.floor(obj / 60));
    if (tgt === 'loot') { const cap = Object.keys(aliveA).some(u => UNITS[u].loot) ? 0.6 : 0.4; R.pct = Math.min(cap, obj / hallHp); if (R.pct < 0.05) R.pct = 0; }

  // Replays every move in the round, in server-time order, to get the state at `now`.
  function simulate(round, moves, now) {
    const S = { phase: 'lobby', startAt: 0, endAt: 0, players: {}, order: [], offers: {}, reports: [], marchMap: {}, marches: [], log: [], winner: null, reason: '', bad: {}, standings: [] };
    const mv = moves.slice().sort((x, y) => (x.t - y.t) || (x.a < y.a ? -1 : x.a > y.a ? 1 : 0) || ((x.q || 0) - (y.q || 0)));
    let startAt = round.t + round.lobbyMs;
    for (const m of mv) if (m.k === 'start' && m.a === round.by && m.t >= round.t && m.t < startAt) { startAt = m.t; break; }
    let endAt = startAt + round.matchMs;
    const P = S.players, ev = [];
    let tok = 0;
    const pushEv = e => { let i = ev.length; while (i > 0 && ev[i - 1].t > e.t) i--; ev.splice(i, 0, e); };
    let lastT = startAt;
    const adv = t => {
      const to = Math.min(t, endAt);
      if (to <= lastT) return;
      const dt = (to - lastT) / 1000;
      for (const u in P) {
        const p = P[u];
        for (const s of p.sites) {
          if (s.rp || s.left <= 0 || !s.w) continue;
          const got = Math.min(s.left, s.w * (s.k === 'farm' ? farmRate(p) : mineRate(p)) * dt);
          s.left -= got;
          if (s.k === 'farm') p.j += got; else p.c += got;
        }
        p.c += G.HALL_GOLD * p.age * dt;
      }
      lastT = to;
    };
    const checkWin = t => {
      const list = Object.values(P);
      if (S.winner || list.length < 2) return;
      const tot = list.reduce((a, p) => a + farmsOf(p), 0);
      const sorted = list.slice().sort((a, b) => farmsOf(b) - farmsOf(a));
      const top = farmsOf(sorted[0]), second = farmsOf(sorted[1]);
      if (top >= G.MONO_MIN && top * 2 >= tot && top >= second * 2) { S.winner = sorted[0].uid; S.reason = 'monopoly'; endAt = t; }
    };
    const startNext = (p, b, t) => {
      if (p.cur[b] || !p.q[b].length) return;
      const u = p.q[b].shift();
      tok += 1;
      p.cur[b] = { u, from: t, at: t + trainMs(p, b, u), tok };
      pushEv({ t: p.cur[b].at, k: 'trained', a: p.uid, b, tok });
    };
    const loseMil = (p, b) => { p[b] = 0; p.idle += p.milW[b]; p.milW[b] = 0; p.q[b] = []; p.cur[b] = null; };

    function onMove(m, t) {
      const bad = why => { S.bad[m.a + '_' + m.i] = why; };
      if (m.k === 'start') return;
      if (m.k === 'join') {
        if (P[m.a]) return bad('joined');
        if (t >= startAt + G.JOIN_LATE_MS) return bad('late');
        P[m.a] = newPlayer(m.a, Math.max(t, startAt));

        return;
      }
      const p = P[m.a];
      if (!p) return bad('not in');
      if (t < startAt) return bad('lobby');
      if (m.k === 'build') {
        const B = BUILDS[m.b];
        if (!B) return bad('shape');
        if (p.age < B.age) return bad('locked');
        if (p.build) return bad('busy');
        if (countOf(p, m.b) >= B.max[p.age - 1]) return bad('max');
        if (p.j < B.j || p.c < B.c) return bad('funds');
        p.j -= B.j; p.c -= B.c;
        p.build = { b: m.b, from: t, at: t + B.ms };
        return pushEv({ t: t + B.ms, k: 'built', a: p.uid, b: m.b });
      }
      if (m.k === 'age') {
        if (p.age >= 4) return bad('age');
        if (p.aging) return bad('busy');
        const A = AGE_UP[p.age];
        if (p.j < A.j || p.c < A.c) return bad('funds');
        p.j -= A.j; p.c -= A.c;
        p.aging = { from: t, at: t + A.ms };
        return pushEv({ t: t + A.ms, k: 'aged', a: p.uid });
      }
      if (m.k === 'tech') {
        const T = TECHS[m.tk];
        if (!T) return bad('shape');
        if (p.tech[m.tk]) return bad('owned');
        if (p.age < T.age) return bad('locked');
        if (p.j < T.j || p.c < T.c) return bad('funds');
        p.j -= T.j; p.c -= T.c;
        p.tech[m.tk] = true;
        for (const k in T.fx) p.fx[k] = (p.fx[k] || 1) * T.fx[k];

      }
      if (m.k === 'vtrain') {
        const n = toInt(m.n, 1, 20);
        if (!n) return bad('shape');
        if (p.q.hall.length + n > G.QMAX) return bad('queue');
        if (popOf(p) + n > capOf(p)) return bad('pop');
        if (p.j < n * G.VIL_J) return bad('funds');
        p.j -= n * G.VIL_J;
        for (let i = 0; i < n; i++) p.q.hall.push('vil');
        return startNext(p, 'hall', t);
      }
      if (m.k === 'assign') {

        if (MIL.includes(m.s)) {
          if (!p[m.s]) return bad('shape');
          if (n > G.MIL_W) return bad('full');
          const d = n - p.milW[m.s];
          if (d > p.idle) return bad('idle');

        }

        if (!s) return bad('gone');
        if (n > G.MAX_W) return bad('full');
        const d = n - s.w;
        if (d > p.idle) return bad('idle');
        p.idle -= d; s.w = n;
        return;
      }
      if (m.k === 'replant') {
        const s = p.sites.find(x => x.id === m.s);
        if (!s || s.k !== 'farm') return bad('gone');
        if (s.rp) return bad('busy');

        if (!TARGETS[m.tgt]) return bad('shape');
        const army = {}, lines = {};

          if (n === null) return bad('shape');
          if (!n) continue;
          if (UNITS[u].home) return bad('shape');

        p.awayN += tot; p.shield = 0;
        const id = m.a + '_' + m.i, ms = marchMs(army);
        S.marchMap[id] = { id, a: p.uid, to: d.uid, army, lines, tgt: m.tgt, sent: t, at: t + ms, ms, state: 'out' };
        return pushEv({ t: t + ms, k: 'arrive', id });
      }
      if (m.k === 'recall' || m.k === 'retarget') {
        const x = S.marchMap[m.id];
        if (!x || x.a !== p.uid || x.state !== 'out') return bad('gone');
        if (m.k === 'retarget') { if (!TARGETS[m.tgt]) return bad('shape'); x.tgt = m.tgt; return; }
        x.state = 'back'; x.from = t; x.at = t + (t - x.sent); x.recalled = true;
        return pushEv({ t: x.at, k: 'home', id: x.id });
      }
      if (m.k === 'sell') {
        const j = toInt(m.j, 1, 1e8);
        if (!j) return bad('shape');
        if (p.j < j) return bad('funds');
        p.j -= j; p.c += j * G.SELL;
        return;
      }
      if (m.k === 'buy') {
        const c = toInt(m.c, 1, 1e8);
        if (!c) return bad('shape');
        if (p.c < c) return bad('funds');
        p.c -= c; p.j += c / G.BUY;
        return;
      }
      if (m.k === 'offer') {
        const gj = toInt(m.gj || 0, 0, 1e8), gc = toInt(m.gc || 0, 0, 1e8), wj = toInt(m.wj || 0, 0, 1e8), wc = toInt(m.wc || 0, 0, 1e8);
        if (gj === null || gc === null || wj === null || wc === null) return bad('shape');
        const sellJelly = gj > 0 && wc > 0 && !gc && !wj, buyJelly = gc > 0 && wj > 0 && !gj && !wc;
        if (!sellJelly && !buyJelly) return bad('shape');
        if (p.j < gj || p.c < gc) return bad('funds');
        p.j -= gj; p.c -= gc;
        S.offers[m.a + '_' + m.i] = { id: m.a + '_' + m.i, a: p.uid, gj, gc, wj, wc, t, open: true };
        return;
      }
      if (m.k === 'take') {
        const o = S.offers[m.o];
        if (!o || !o.open || o.a === p.uid) return bad('closed');
        if (p.j < o.wj || p.c < o.wc) return bad('funds');
        const seller = P[o.a];
        p.j += o.gj - o.wj; p.c += o.gc - o.wc;
        seller.j += o.wj; seller.c += o.wc;
        o.open = false; o.by = p.uid; o.end = t;
        return;
      }
      if (m.k === 'cancel') {
        const o = S.offers[m.o];
        if (!o || !o.open || o.a !== p.uid) return bad('closed');
        p.j += o.gj; p.c += o.gc;
        o.open = false; o.cancelled = true; o.end = t;
        return;
      }
      bad('shape');
    }

    function onEv(e, t) {
      if (e.k === 'built') {
        const p = P[e.a];
        p.build = null;
        if (e.b === 'farm' || e.b === 'mine') addSite(p, e.b, 0); else p[e.b] += 1;
        if (e.b === 'farm') checkWin(t);
        return;
      }
      if (e.k === 'aged') { const p = P[e.a]; p.age += 1; p.aging = null; return; }
      if (e.k === 'trained') {
        const p = P[e.a], c = p.cur[e.b];
        if (!c || c.tok !== e.tok) return;
        p.cur[e.b] = null;
        if (e.b === 'hall') p.idle += 1; else p.army[c.u] = (p.army[c.u] || 0) + 1;
        return startNext(p, e.b, t);
      }
      if (e.k === 'replanted') {
        const p = P[e.a], s = p.sites.find(x => x.id === e.s);
        if (s && s.rp) { s.rp = 0; s.max = G.FARM_CAP * mul(p, 'cap'); s.left = s.max; }
        return;
      }
      if (e.k === 'home') {
        const x = S.marchMap[e.id];
        if (!x || x.state !== 'back') return;
        const p = P[x.a];
        for (const u in x.army) { p.army[u] = (p.army[u] || 0) + x.army[u]; p.awayN -= x.army[u]; }
        x.state = 'done';
        return;
      }
      if (e.k === 'arrive') {
        const x = S.marchMap[e.id];
        if (!x || x.state !== 'out') return;
        const p = P[x.a], d = P[x.to];
        const rep = { id: x.id, t, a: p.uid, d: d.uid, tgt: x.tgt, sent: Object.assign({}, x.army) };
        if (d.shield > t) {
          rep.shield = true;
        } else {
          const R = battle(p, d, x.army, x.lines, x.tgt);
          Object.assign(rep, R);
          for (const u in R.dLoss) d.army[u] -= R.dLoss[u];
          for (const u in R.aLoss) { x.army[u] -= R.aLoss[u]; p.awayN -= R.aLoss[u]; }
          d.wall = Math.max(0, d.wall - R.wallLost);
          d.tower = Math.max(0, d.tower - R.towers);
          for (let k = 0; k < R.farms + R.mines; k++) {
            const want = k < R.farms ? 'farm' : 'mine';
            let idx = -1;
            for (let i = d.sites.length - 1; i >= 0; i--) if (d.sites[i].k === want) { idx = i; break; }
            if (idx < 0) continue;
            const s = d.sites.splice(idx, 1)[0];
            d.idle += s.w; s.w = 0; s.rp = 0;
            p.sn += 1; s.id = (want === 'farm' ? 'f' : 'm') + p.sn;
            p.sites.push(s);
            if (want === 'farm') p.captured += 1;
          }
          if (R.pct) { rep.lj = d.j * R.pct; rep.lc = d.c * R.pct; d.j -= rep.lj; d.c -= rep.lc; p.j += rep.lj; p.c += rep.lc; }
          if (R.mil) loseMil(d, R.mil);
          if (R.win) { d.shield = t + G.SHIELD_MS; p.raids += 1; }
        }
        S.reports.push(rep);
        const left = sumObj(x.army);
        if (left > 0) { x.state = 'back'; x.from = t; x.at = t + x.ms; pushEv({ t: x.at, k: 'home', id: x.id }); }
        else x.state = 'done';
        if (rep.farms) checkWin(t);
      }
    }

    let mi = 0;
    while (true) {
      const e = ev[0], m = mv[mi];
      if (!e && !m) break;
      const useEv = !!e && (!m || e.t <= m.t);
      const t = useEv ? e.t : m.t;
      if (t > now || t >= endAt) break;
      if (t >= startAt) adv(t);
      if (useEv) { ev.shift(); onEv(e, t); } else { mi++; onMove(m, t); }
      if (S.winner) break;
    }
    if (!S.winner) adv(Math.min(now, endAt));
    S.startAt = startAt;
    S.endAt = endAt;
    S.phase = S.winner || now >= endAt ? 'over' : now < startAt ? 'lobby' : 'live';
    S.standings = Object.values(P).sort((a, b) => (farmsOf(b) - farmsOf(a)) || ((b.j + b.c) - (a.j + a.c)));
    if (S.phase === 'over' && !S.winner && S.standings.length) { S.winner = S.standings[0].uid; S.reason = 'time'; }
    S.marches = S.phase === 'live' ? Object.values(S.marchMap).filter(x => x.state === 'out' || x.state === 'back') : [];
    return S;
  }

  /* ================= state ================= */
  let FB = null, auth = null, fs = null, BANK = '', TESTERS = [];
  let uid = null, uname = '', authReady = false, authed = false;
  let players = {}, playersLoaded = false;
  let rounds = {}, roundsLoaded = false;
  let moveDocs = {}, movesLoaded = false;
  let chatDocs = {};
  const pending = new Map();
  let curId = null, roundUnsubs = [], unsubs = [];
  let skew = 0, myQ = 0;
  let S = null, sig = '';
  const seenBad = new Set();
  let chatSeen = 0;
  const ui = { tab: 'base', fatal: '', st: {}, zoom: 0.6, sheet: null, atk: null, visit: null };

  const P_ = u => players[u];
  const nameOf = u => (players[u] && players[u].username ? '@' + players[u].username : 'someone');
  const lookOf = u => (players[u] && players[u].avatar) || { color: 'grape', eyes: 'dots', mouth: 'smile', blush: true };
  const now = () => Date.now() + skew;
  const isBank = () => uname === BANK;
  const allowed = () => LIVE || isBank() || TESTERS.includes(uname);
  const round = () => (curId ? rounds[curId] : null);
  const me = () => (S && S.players[uid]) || null;

  function allMoves() {
    const m = new Map();
    for (const k in moveDocs) m.set(k, moveDocs[k]);
    for (const [k, v] of pending) if (!m.has(k)) m.set(k, v);
    return [...m.values()];
  }
  function sim() { const r = round(); S = r ? simulate(r, allMoves(), now()) : null; return S; }

  /* ================= writes ================= */
  function move(k, f) {
    if (!curId) return;
    myQ += 1;
    const e = Object.assign({ i: rid(), q: myQ, k, a: uid, rd: curId }, f || {});
    const id = uid + '_' + e.i;
    pending.set(id, Object.assign({}, e, { t: now() }));
    const body = Object.assign({}, e, { ct: Date.now(), st: FB.serverTimestamp() });
    FB.setDoc(FB.doc(fs, ENV + 'Moves/' + id), body).catch(err => {
      pending.delete(id);
      toast(err && err.code === 'permission-denied' ? 'The database refused that move. Check the Firestore rules step in the README.' : 'That move didn’t go through. Try again.');
      refresh(true);
    });
    refresh(true);
  }
  function sendChat(text) {
    if (!curId) return;
    const i = rid();
    const id = uid + '_' + i;
    chatDocs[id] = { id, a: uid, i, rd: curId, text, t: now(), pending: true };
    renderChatList();
    FB.setDoc(FB.doc(fs, ENV + 'Chat/' + id), { a: uid, i, rd: curId, text, ct: Date.now(), st: FB.serverTimestamp() }).catch(() => { delete chatDocs[id]; renderChatList(); toast('Your message didn’t send.'); });
  }
  async function openRound(lobbyMin) {
    const n = Object.keys(rounds).length + 1;
    const id = 'r' + Date.now().toString(36) + rid().slice(0, 4);
    try {
      await FB.setDoc(FB.doc(fs, ENV + 'Rounds/' + id), { n, by: uid, lobbyMs: lobbyMin * 60000, matchMs: G.MATCH_MS, st: FB.serverTimestamp() });
      toast(`Round ${n} is open. Players can join now.`);
    } catch (e) {
      toast(e && e.code === 'permission-denied' ? 'Only the bank can open rounds. Check the Firestore rules step in the README.' : 'That didn’t work. Try again.');
    }
  }

  /* ================= rendering ================= */
  const app = $('#app');
  function msg(title, text, extra) { return `<div class="msgscreen"><h1>${title}</h1>${text ? `<p>${text}</p>` : ''}${extra || ''}</div>`; }
  function route() {
    if (ui.fatal) return ui.fatal;
    if (!authReady) return 'loading';
    if (!authed) return 'login';
    if (!playersLoaded || !roundsLoaded) return 'loading';
    if (!players[uid] || !players[uid].avatar) return 'noprofile';
    if (!allowed()) return 'closed';
    return 'game';
  }

  function render() {
    const r = route();
    $('#tabs').hidden = r !== 'game';
    if (r === 'loading') { app.innerHTML = msg('Loading Scobb Farm…', ''); return; }
    if (r === 'notconfigured') { app.innerHTML = msg('Almost ready', 'Scobb Farm uses the same firebase-config.js as ScobbBucks. Upload it next to this page.'); return; }
    if (r === 'offline') { app.innerHTML = msg('Can’t reach Scobb Farm', 'Check your internet connection, then reload.'); return; }
    if (r === 'rules') { app.innerHTML = msg('Scobb Farm couldn’t load', 'The database turned the request down. Make sure you published the updated Firestore rules from the README.'); return; }
    if (r === 'login') { app.innerHTML = msg('Log in first', 'Log in on the ScobbBucks page, then come back here.', '<a class="btn btn-grape" style="display:inline-grid;place-items:center;text-decoration:none" href="./">Go to ScobbBucks</a>'); return; }
    if (r === 'noprofile') { app.innerHTML = msg('Finish your account', 'Make your ScobbBucks avatar first, then come back.', '<a class="btn btn-grape" style="display:inline-grid;place-items:center;text-decoration:none" href="./">Go to ScobbBucks</a>'); return; }
    if (r === 'noskins') { app.innerHTML = msg('Almost ready', 'Upload farm-skins.js next to this page. ScobbBucks and Scobb Farm both need it.'); return; }
    if (r === 'closed') { app.innerHTML = msg('Scobb Farm isn’t open yet', 'The bank is still testing it. Check back soon.'); return; }
    sim();
    sig = signature();
    renderGame();
  }

  const costText = (j, c) => [c ? `${fmt(c)} gold` : '', j ? `${fmt(j)} Jelly` : ''].filter(Boolean).join(' + ') || 'Free';
  const canAfford = (p, j, c) => p.j >= j && p.c >= c;
  const armyChips = (army, col) => { const ks = UNIT_ORDER.filter(u => (army[u] || 0) > 0); return ks.length ? `<div class="armyrow">${ks.map(u => `<span class="uchip" title="${UNITS[u].name}">${unitSVG(u, col)}${fmt(army[u])}</span>`).join('')}</div>` : '<p class="small soft">No troops.</p>'; };

  function header() {
    const r = round();
    let h = `<header class="top"><h1>Scobb Farm <span class="pill"${LIVE ? ' style="background:#3E9B2F"' : ''}>${LIVE ? 'Live' : 'Preview'}</span></h1><a class="link" href="./">ScobbBucks</a></header>`;
    if (!LIVE) h += `<p class="notice">Preview mode uses test data and pretend prizes. Real ScobbBucks aren’t touched.</p>`;
    if (!r || !S) return h;
    const label = S.phase === 'lobby' ? 'Starts in' : S.phase === 'live' ? 'Time left' : 'Round over';
    h += `<div class="status mt"><span>Round ${r.n}</span><span>${label} <b data-live="timer">${S.phase === 'over' ? '' : clock((S.phase === 'lobby' ? S.startAt : S.endAt) - now())}</b></span></div>`;
    const p = me();
    if (p && S.phase === 'live') {
      h += `<div class="res"><div><span>Jelly</span><b data-res="j">${fmt(p.j)}</b></div><div><span>Gold</span><b data-res="c">${fmt(p.c)}</b></div><div><span>Idle villagers</span><b>${p.idle}</b></div><div><span>Army</span><b>${fmt(sumObj(p.army))}</b></div><div><span>Farms</span><b>${farmsOf(p)}</b></div><div><span>Age</span><b style="font-size:14px">${AGES[p.age - 1]}</b></div></div>`;
      const inc = S.marches.filter(x => x.to === uid && x.state === 'out');
      if (inc.length) { const x = inc[0]; h += `<p class="alert">Incoming! ${esc(nameOf(x.a))} is sending ${fmt(sumObj(x.army))} troops at your ${TARGETS[x.tgt].toLowerCase()}. They arrive in <span data-cd="${x.at}">${secs(x.at - now())}</span></p>`; }
      if (p.shield > now()) h += `<p class="notice">You’re shielded for <span data-cd="${p.shield}">${secs(p.shield - now())}</span>. Attacking someone drops your shield.</p>`;
    }
    return h;
  }

  function renderGame() {
    $('#tabs').hidden = false;
    const r = round();
    const w = $('#world');
    if (w) ui.mapScroll = [w.scrollLeft, w.scrollTop];
    let body = header();
    if (!r || !S) body += noRoundView();
    else if (ui.tab === 'chat') body += chatView();
    else if (S.phase === 'lobby') body += lobbyView();
    else if (S.phase === 'over') body += overView();
    else if (!me()) body += spectatorView();
    else if (ui.tab === 'map') body += ui.visit && S.players[ui.visit] && ui.visit !== uid ? visitView(ui.visit) : mapView();
    else if (ui.tab === 'army') body += armyView();
    else if (ui.tab === 'market') body += marketView();
    else body += baseView();
    app.innerHTML = body;
    $$('.tab').forEach(b => { if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (ui.tab === 'chat') { renderChatList(); chatSeen = chatCount(); }
    updateBadges();
    wireView();
  }

  function noRoundView() {
    let h = `<h2>No round right now</h2>`;
    h += howTo();
    h += isBank() ? bankOpen() : `<p class="soft mt">Waiting for the bank to open a round.</p>`;
    return h;
  }
  function bankOpen() {
    return `<div class="card mt"><h3 style="margin-top:0">Open a round</h3><p class="small soft">Players get a lobby to join, then the 15-minute match starts. You can also start early.</p><div class="chips" id="lobby-len">${[1, 2, 5].map(n => `<button type="button" class="chip" data-act="lobby-len" data-v="${n}" aria-pressed="${n === lobbyLen}">${n} min lobby</button>`).join('')}</div><button type="button" class="btn btn-grape btn-block mt" data-act="open-round">Open a new round</button></div>`;
  }
  function howTo() {
    return `<div class="card mt"><h3 style="margin-top:0">How to play</h3>
      <p class="small">Train villagers at your Town Hall and put them to work. Farmers grow Jelly and miners dig gold. More workers means more money, but the farm or mine runs out faster.</p>
      <p class="small" style="margin-top:6px">Tap your Barracks to train spear, axe and gun scobbs. Build a Stable in the Town age for riders, and a Machine workshop in the Castle age for rams, cannons and mechs.</p>
      <p class="small" style="margin-top:6px">Each age unlocks new upgrades and troops. When you attack, you pick your troops, who goes in front, and what to hit.</p>
      <p class="small" style="margin-top:6px"><b>Win early</b> by owning half of all the farms, with at least ${G.MONO_MIN} of them and twice as many as anyone else. Otherwise, whoever owns the most farms after 15 minutes wins.</p></div>`;
  }
  function lobbyView() {
    const r = round();
    const joined = S.order;
    let h = `<h2>Lobby</h2><div class="card"><p class="small soft">${joined.length ? 'In this round:' : 'Nobody has joined yet.'}</p><div class="plist">${joined.map(u => `<div class="pcard">${hb(u, 36)}<div class="main"><div class="t">${esc(nameOf(u))}</div></div></div>`).join('')}</div>`;
    h += S.players[uid] ? `<p class="small mt" style="margin-top:10px">You’re in. Get ready!</p>` : `<button type="button" class="btn btn-lime btn-block mt" data-act="join">Join round ${r.n}</button>`;
    if (isBank() && r.by === uid) h += `<button type="button" class="btn btn-ghost btn-block mt" data-act="start"${joined.length < 1 ? ' disabled' : ''}>Start now</button>`;
    h += `</div>` + howTo();
    return h;
  }
  function spectatorView() {
    const lateOk = now() < S.startAt + G.JOIN_LATE_MS;
    let h = `<h2>You’re watching</h2>`;
    h += lateOk ? `<p class="small soft">You can still join for <span data-cd="${S.startAt + G.JOIN_LATE_MS}">${secs(S.startAt + G.JOIN_LATE_MS - now())}</span>.</p><button type="button" class="btn btn-lime btn-block mt" data-act="join">Join this round</button>` : `<p class="small soft">This round is too far along to join. Watch the chat and catch the next one.</p>`;
    return h + standingsHTML();
  }
  function standingsHTML() {
    return `<h2>Standings</h2><div class="podium">${S.standings.map((p, i) => `<div class="pcard"><span class="place">${i + 1}</span>${hb(p.uid, 36)}<div class="main"><div class="t">${esc(nameOf(p.uid))}${p.uid === uid ? ' (you)' : ''}</div><div class="s">${plural(farmsOf(p), 'farm', 'farms')}, ${AGES[p.age - 1]}, ${plural(sumObj(p.army) + p.awayN, 'troop', 'troops')}</div></div></div>`).join('')}</div>`;
  }
  function overView() {
    const w = S.winner;
    let h = `<h2>${w ? `${esc(nameOf(w))} wins!` : 'Round over'}</h2>`;
    h += w ? `<p class="small soft">${S.reason === 'monopoly' ? 'They took over half of all the farms. Scobb monopoly!' : 'They owned the most farms when time ran out.'}</p>` : '';
    h += `<div class="podium">${S.standings.slice(0, 10).map((p, i) => `<div class="pcard"><span class="place">${['🥇', '🥈', '🥉'][i] || i + 1}</span>${hb(p.uid, 36)}<div class="main"><div class="t">${esc(nameOf(p.uid))}</div><div class="s">${plural(farmsOf(p), 'farm', 'farms')}${i < PRIZES.length ? `. Prize: ${PRIZES[i]}${LIVE ? '' : ' pretend'} ScobbBucks` : ''}</div></div></div>`).join('')}</div>`;
    h += LIVE ? `<p class="small soft mt">The winner gets ${PRIZES[0]} real ScobbBucks from the bank’s vault. ${isBank() ? 'They go out automatically the next time you open ScobbBucks.' : 'They show up in the winner’s wallet once the bank opens the app.'}</p>` : `<p class="small soft mt">In preview, prizes are pretend. Once Scobb Farm goes live, the winner gets ${PRIZES[0]} real ScobbBucks from the bank.</p>`;
    h += isBank() ? bankOpen() : `<p class="soft mt">Waiting for the bank to open the next round.</p>`;
    return h;
  }

  /* ---- troop pictures ---- */
  const scobbBody = col => `<ellipse cx="0" cy="13" rx="8" ry="2.4" fill="#000" opacity=".15"/><rect x="-6" y="0" width="12" height="12" rx="6" fill="${col}"/><circle cx="0" cy="-3" r="7" fill="${col}"/><circle cx="-2.5" cy="-4" r="1.2" fill="#1E1B24"/><circle cx="2.5" cy="-4" r="1.2" fill="#1E1B24"/><ellipse cx="-2" cy="-7.5" rx="2.4" ry="1.3" fill="#fff" opacity=".5"/>`;
  const smallRider = col => `<g transform="translate(-2 -9) scale(.68)">${scobbBody(col)}</g>`;
  function unitArt(u, col) {
    switch (u) {
      case 'vil': return scobbBody(col) + `<path d="M-9 -8h18l-4 -4h-10z" fill="#E8C468"/>`;
      case 'spear': return scobbBody(col) + `<path d="M8 12L11 -14" stroke="#8B5A2B" stroke-width="1.8"/><path d="M9.6 -11.5L11.6 -17L12.8 -11Z" fill="#C9D2DC"/>`;
      case 'axe': return scobbBody(col) + `<path d="M8 12L10 -8" stroke="#8B5A2B" stroke-width="1.8"/><path d="M9 -10q7 -2 7 5q-4 -2 -6 0z" fill="#9AA5B1"/>`;

      else { const f = x.recalled ? Math.min(1, (x.from - x.sent) / x.ms) : 1; t0 = x.from; t1 = x.at; x1 = A.x + (D.x - A.x) * f; y1 = A.y + (D.y - A.y) * f; x2 = A.x; y2 = A.y; }
      const col = colorOf(lookOf(x.a)), enemy = x.to === uid && x.state === 'out';
      s += `<path d="M${A.x} ${A.y}L${D.x} ${D.y}" stroke="${enemy ? '#E9453C' : '#6C2BD9'}" stroke-width="3" stroke-dasharray="8 8" opacity=".55"/><g class="march" data-mv="${t0}:${t1}:${x1}:${y1}:${x2}:${y2}" transform="translate(${x1} ${y1})">${unitG(main, 0, 0, col, 1.4)}<g transform="translate(16 -22)"><rect x="-14" y="-11" width="28" height="18" rx="9" fill="${enemy ? '#E9453C' : '#1F2A14'}"/><text y="3" text-anchor="middle" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="12" fill="#fff">${fmt(sumObj(x.army))}</text></g></g>`;
    }
    return `<div class="mapbar"><span class="small soft">Drag to look around. Tap a base to visit it.</span><span style="margin-left:auto;display:flex;gap:6px"><button type="button" class="mini" data-act="zoom" data-d="-1" aria-label="Zoom out">−</button><button type="button" class="mini" data-act="zoom" data-d="1" aria-label="Zoom in">+</button><button type="button" class="btn btn-ghost btn-sm" style="margin:0" data-act="home-map">My base</button></span></div><div class="world" id="world" style="height:min(62vh, ${Math.round(L.H * z) + 4}px)"><svg width="${Math.round(L.W * z)}" height="${Math.round(L.H * z)}" viewBox="0 0 ${L.W} ${L.H}" role="img" aria-label="World map"><defs>${defs}</defs>${s}</svg></div>`;
  }
  function visitView(u) {
    const o = S.players[u], p = me(), t = now();
    const sh = o.shield > t;
    let h = `<div class="mapbar"><button type="button" class="btn btn-ghost btn-sm" style="margin:0" data-act="back-map">← Map</button><b style="margin-left:6px">${esc(nameOf(u))}’s base</b></div>`;
    h += villageSVG(o, colorOf(lookOf(u)), t, equipOf(u), false);
    h += `<div class="card mt"><p class="small">${plural(farmsOf(o), 'farm', 'farms')}, ${plural(minesOf(o), 'gold mine', 'gold mines')}, wall level ${o.wall}, ${plural(o.tower, 'tower', 'towers')}, ${AGES[o.age - 1]} age.${sh ? ` Shielded for <span data-cd="${o.shield}">${secs(o.shield - t)}</span>.` : ''}</p><h3>Troops at home</h3>${armyChips(o.army, colorOf(lookOf(u)))}</div>`;
    h += `<button type="button" class="btn btn-danger btn-block mt" data-act="attack" data-u="${esc(u)}"${sh || !UNIT_ORDER.some(k => !UNITS[k].home && (p.army[k] || 0) > 0) ? ' disabled' : ''}>Attack ${esc(nameOf(u))}</button>`;

  }

  /* ---- army tab ---- */
  function reportText(r) {
    const mine = r.a === uid, other = mine ? r.d : r.a;
    if (r.shield) return mine ? `Your troops bounced off ${esc(nameOf(other))}’s shield.` : `${esc(nameOf(other))}’s attack bounced off your shield.`;
    const lostA = sumObj(r.aLoss), lostD = sumObj(r.dLoss);
    const gains = [];
    if (r.farms) gains.push(plural(r.farms, 'farm', 'farms'));
    if (r.mines) gains.push(plural(r.mines, 'gold mine', 'gold mines'));
    if (r.lj || r.lc) gains.push(`${fmt(r.lj)} Jelly and ${fmt(r.lc)} gold`);
    if (r.towers) gains.push(plural(r.towers, 'tower', 'towers'));
    if (r.walls) gains.push(`${r.walls} wall levels`);
    if (r.mil) gains.push(`their ${BUILDS[r.mil].name.toLowerCase()}`);
    const g = gains.join(', ');
    if (mine) return r.win ? `<span class="win">You beat ${esc(nameOf(other))}!</span> Took ${g}. Lost ${plural(lostA, 'troop', 'troops')}, killed ${fmt(lostD)}.` : `<span class="lose">Your attack on ${esc(nameOf(other))} failed.</span> ${r.broke ? 'You broke in but ran out of time. ' : ''}Lost ${plural(lostA, 'troop', 'troops')}, killed ${fmt(lostD)}.`;
    return r.win ? `<span class="lose">${esc(nameOf(other))} beat you.</span> They took ${g}. You lost ${plural(lostD, 'troop', 'troops')}.` : `<span class="win">You held off ${esc(nameOf(other))}!</span> They lost ${plural(lostA, 'troop', 'troops')}.`;
  }
  function armyView() {
    const p = me(), t = now(), col = colorOf(lookOf(uid));
    let h = `<div class="card mt"><b>Troops at home</b>${armyChips(p.army, col)}<p class="small soft" style="margin-top:6px">${fmt(p.awayN)} out on attacks. Defense power about ${fmt(defenseOf(p))}.</p></div>`;
    h += `<h2>Train troops</h2><div class="card blist">`;
    for (const b of MIL) {
      const B = BUILDS[b], c = p.cur[b];
      const st = p[b] ? (c ? `Training, ${p.q[b].length + 1} in line` : 'Ready') : p.age < B.age ? `Unlocks in the ${AGES[B.age - 1]} age` : 'Not built yet';
      h += `<div class="brow"><div class="main"><div class="t">${B.name}</div><div class="s">${st}</div></div><button type="button" class="btn ${p[b] ? 'btn-grape' : 'btn-ghost'} btn-sm" data-act="open" data-k="${b}"${!p[b] && p.age < B.age ? ' disabled' : ''}>${p[b] ? 'Open' : 'Build'}</button></div>`;
    }
    h += `</div>`;
    const out = S.marches.filter(x => x.a === uid);
    if (out.length) {
      h += `<h2>Your attacks</h2>`;
      for (const x of out) {
        const go = x.state === 'out';
        h += `<div class="prog"><div class="t"><span>${go ? `Marching on ${esc(nameOf(x.to))}` : `Coming home from ${esc(nameOf(x.to))}`}</span><span data-cd="${x.at}">${secs(x.at - t)}</span></div><div class="bar"><i data-prog="${go ? x.sent : x.from}:${x.at}"></i></div>${armyChips(x.army, col)}`;
        if (go) h += `<p class="small soft" style="margin-top:8px">Target</p><div class="seg">${Object.keys(TARGETS).map(k => `<button type="button" class="chip" data-act="retarget" data-id="${esc(x.id)}" data-v="${k}" aria-pressed="${x.tgt === k}">${TARGETS[k]}</button>`).join('')}</div><button type="button" class="btn btn-ghost btn-sm mt" style="margin-bottom:0" data-act="recall" data-id="${esc(x.id)}">Call them back</button>`;
        h += `</div>`;
      }
    }
    h += `<h2>Players</h2><div class="card plist">`;
    const others = S.standings.filter(o => o.uid !== uid);
    if (!others.length) h += `<p class="small soft">Nobody else is in this round yet.</p>`;
    for (const o of others) {
      const sh = o.shield > t;
      h += `<div class="pcard">${hb(o.uid, 40)}<div class="main"><div class="t">${esc(nameOf(o.uid))}</div><div class="s">${plural(farmsOf(o), 'farm', 'farms')}, ${AGES[o.age - 1]}, defense about ${fmt(defenseOf(o))}${sh ? `, shielded <span data-cd="${o.shield}">${secs(o.shield - t)}</span>` : ''}</div></div><div style="display:grid;gap:6px"><button type="button" class="btn btn-danger btn-sm" data-act="attack" data-u="${esc(o.uid)}"${sh ? ' disabled' : ''}>Attack</button><button type="button" class="link" data-act="visit" data-u="${esc(o.uid)}">Visit</button></div></div>`;
    }
    h += `</div>`;
    const reps = S.reports.filter(r => r.a === uid || r.d === uid).slice(-12).reverse();
    h += `<h2>Battle reports</h2><div class="card">${reps.length ? reps.map(r => `<div class="ev">${reportText(r)} <span class="when">${clock(r.t - S.startAt)} in</span></div>`).join('') : '<p class="small soft">No battles yet.</p>'}</div>`;
    return h;
  }

  /* ---- market tab ---- */
  function marketView() {
    const p = me();
    let h = `<div class="card mt"><p class="small soft">Market prices never change</p><p class="price">Sell 1 Jelly → ${G.SELL} gold</p><p class="price" style="font-size:22px">Buy 1 Jelly for ${G.BUY} gold</p></div>`;
    h += `<div class="card mt"><h3 style="margin-top:0">Sell Jelly</h3><div class="field"><input id="m-sell" type="text" inputmode="numeric" placeholder="How much Jelly" aria-label="Jelly to sell"></div><div class="chips">${[25, 50, 100].map(v => `<button type="button" class="chip" data-act="pct" data-f="m-sell" data-v="${v}">${v === 100 ? 'All' : v + '%'}</button>`).join('')}</div><p class="quote" id="q-sell"></p><button type="button" class="btn btn-grape btn-block" data-act="sell">Sell</button></div>`;
    h += `<div class="card mt"><h3 style="margin-top:0">Buy Jelly</h3><div class="field"><input id="m-buy" type="text" inputmode="numeric" placeholder="How much gold to spend" aria-label="Gold to spend"></div><div class="chips">${[25, 50, 100].map(v => `<button type="button" class="chip" data-act="pct" data-f="m-buy" data-v="${v}">${v === 100 ? 'All' : v + '%'}</button>`).join('')}</div><p class="quote" id="q-buy"></p><button type="button" class="btn btn-ghost btn-block" data-act="buy">Buy</button></div>`;

      h += `<div class="pcard">${hb(o.a, 36)}<div class="main"><div class="t">${esc(nameOf(o.a))}</div><div class="s">${what} (${each.toFixed(2)} each)</div></div>${mine ? `<button type="button" class="btn btn-ghost btn-sm" data-act="cancel" data-o="${esc(o.id)}">Cancel</button>` : `<button type="button" class="btn btn-lime btn-sm" data-act="take" data-o="${esc(o.id)}"${can ? '' : ' disabled'}>Take</button>`}</div>`;
    }
    h += `</div><div class="card mt"><h3 style="margin-top:0">Post a deal</h3><div class="chips" id="d-side"><button type="button" class="chip" data-act="dside" data-v="sell" aria-pressed="${dealSide === 'sell'}">Sell Jelly</button><button type="button" class="chip" data-act="dside" data-v="buy" aria-pressed="${dealSide === 'buy'}">Buy Jelly</button></div>
      <div class="row2"><div class="field" style="margin:0"><label for="d-j">Jelly</label><input id="d-j" type="text" inputmode="numeric" placeholder="0"></div><div class="field" style="margin:0"><label for="d-c">For gold</label><input id="d-c" type="text" inputmode="numeric" placeholder="0"></div></div>
      <p class="small soft" style="margin-top:6px">What you offer is held until someone takes the deal or you cancel it.</p><button type="button" class="btn btn-grape btn-block mt" data-act="post">Post deal</button></div>`;
    return h;
  }

  /* ---- chat ---- */
  const chatList = () => Object.values(chatDocs).filter(m => m.rd === curId).sort((a, b) => a.t - b.t);
  const chatCount = () => chatList().length;
  function chatView() {
    return `<h2>Round chat</h2><div class="chat" id="chat"></div><div class="sendrow"><input id="c-text" type="text" maxlength="200" autocomplete="off" placeholder="Say something" aria-label="Message"><button type="button" class="btn btn-grape" data-act="chat-send">Send</button></div>`;
  }
  function renderChatList() {
    const box = $('#chat');
    if (!box) return;
    const list = chatList().slice(-100);
    box.innerHTML = list.length ? list.map(m => `<div class="msg${m.a === uid ? ' me' : ''}">${hb(m.a, 30)}<div class="bub"><div class="who">${esc(nameOf(m.a))}</div>${esc(m.text)}</div></div>`).join('') : '<p class="small soft">No messages yet. Talk some trash.</p>';
    if (ui.tab === 'chat') { chatSeen = chatCount(); updateBadges(); window.scrollTo(0, document.body.scrollHeight); }
  }
  function updateBadges() {
    const bc = $('#bd-chat'), bb = $('#bd-army');
    const unread = ui.tab === 'chat' ? 0 : Math.max(0, chatCount() - chatSeen);
    bc.hidden = !unread; bc.textContent = unread > 9 ? '9+' : String(unread);
    const inc = S && S.phase === 'live' ? S.marches.filter(x => x.to === uid && x.state === 'out').length : 0;
    bb.hidden = !inc; bb.textContent = String(inc);
  }

  /* ---- sheets ---- */
  function openSheet(draw) {
    ui.sheet = draw;
    $('#sheet-root').hidden = false;
    document.body.style.overflow = 'hidden';
    drawSheet();
    setTimeout(() => $('#sheet').focus({ preventScroll: true }), 40);
  }
  function drawSheet() {
    if (!ui.sheet) return;
    const html = ui.sheet();
    if (html == null) { closeSheet(); return; }
    const st = $('#sheet').scrollTop;
    $('#sheet-body').innerHTML = html;
    $('#sheet').scrollTop = st;
    liveTick();
  }
  function closeSheet() { ui.sheet = null; $('#sheet-root').hidden = true; $('#sheet-body').innerHTML = ''; document.body.style.overflow = ''; }
  const sheetHead = (t, sub) => `<div class="sheet-head"><div><h2 id="sheet-title">${t}</h2>${sub ? `<p class="small soft">${sub}</p>` : ''}</div><button type="button" class="x" data-act="close" aria-label="Close">✕</button></div>`;
  const stv = (k, d) => (ui.st[k] != null ? ui.st[k] : d);
  const stepper = (k, v, lo, hi, labelText) => `<div class="step"><button type="button" class="sb" data-act="st" data-k="${k}" data-d="-1" data-lo="${lo}" data-hi="${hi}" aria-label="One fewer">−</button><b class="sv" style="display:grid;place-items:center">${v}</b><button type="button" class="sb" data-act="st" data-k="${k}" data-d="1" data-lo="${lo}" data-hi="${hi}" aria-label="One more">+</button>${labelText ? `<span class="small soft">${labelText}</span>` : ''}</div>`;
  function unlocksAt(age) {
    const out = [];
    for (const b of BUILD_ORDER) if (BUILDS[b].age === age) out.push(BUILDS[b].name);
    for (const u of UNIT_ORDER) if (UNITS[u].age === age) out.push(UNITS[u].name);
    for (const k in TECHS) if (TECHS[k].age === age) out.push(TECHS[k].name);
    return out;
  }
  function hallSheet() {
    const p = me();
    if (!p) return null;
    const room = Math.max(0, capOf(p) - popOf(p)), maxN = Math.max(0, Math.min(20, room, Math.floor(p.j / G.VIL_J)));
    const n = Math.max(1, Math.min(stv('vn', 3), Math.max(1, maxN)));
    let h = sheetHead('Town Hall', `${AGES[p.age - 1]} age. Population ${popOf(p)}/${capOf(p)}.`);
    h += `<h3>Train villagers</h3><p class="small soft">${G.VIL_J} Jelly each, ${G.VIL_MS / 1000}s each. New villagers show up idle, so put them to work on the base.</p>${stepper('vn', n, 1, 20)}<button type="button" class="btn btn-grape btn-block mt" data-act="vtrain" data-n="${n}"${maxN ? '' : ' disabled'}>Train ${plural(n, 'villager', 'villagers')} for ${fmt(n * G.VIL_J)} Jelly</button>${maxN ? '' : `<p class="small err">${room ? 'Not enough Jelly.' : 'You’re at your population limit. The next age raises it.'}</p>`}`;
    if (p.age < 4) {
      const A = AGE_UP[p.age];
      h += `<h3>Next age: ${AGES[p.age]}</h3><p class="small soft">Unlocks ${unlocksAt(p.age + 1).join(', ')}. Population limit goes to ${POP[p.age]}.</p><button type="button" class="btn btn-lime btn-block mt" data-act="age"${p.aging || !canAfford(p, A.j, A.c) ? ' disabled' : ''}>${p.aging ? 'Upgrading…' : `Upgrade for ${costText(A.j, A.c)}`}</button>`;
    }
    h += `<h3>Upgrades</h3><div class="blist">`;
    for (const k in TECHS) {
      const T = TECHS[k], have = !!p.tech[k], locked = p.age < T.age;
      h += `<div class="brow"><div class="main"><div class="t">${T.name} <span class="small soft">${AGES[T.age - 1]}</span></div><div class="s">${T.what}</div><div class="cost">${have ? 'Done' : locked ? `Unlocks in the ${AGES[T.age - 1]} age` : costText(T.j, T.c)}</div></div>${have ? '<span class="win">✓</span>' : `<button type="button" class="btn btn-grape btn-sm" data-act="tech" data-t="${k}"${locked || !canAfford(p, T.j, T.c) ? ' disabled' : ''}>Buy</button>`}</div>`;
    }
    return h + `</div>`;
  }
  function siteSheet(id) {
    const p = me(), s = p && p.sites.find(x => x.id === id);
    if (!s) return null;
    const rate = s.k === 'farm' ? farmRate(p) : mineRate(p), what = s.k === 'farm' ? 'Jelly' : 'gold';
    const left = s.w && s.left > 0 && !s.rp ? s.left / (rate * s.w) * 1000 : 0;
    let h = sheetHead(siteName(p, s), `${fmt(s.left)} of ${fmt(s.max)} ${what} left`);
    h += `<div class="bar"><i style="width:${Math.max(0, Math.min(100, (s.left / s.max) * 100))}%;background:${s.k === 'farm' ? 'var(--lime)' : 'var(--gold)'}"></i></div>`;
    h += `<h3>Workers</h3><div class="jobs"><div class="brow"><div class="main"><div class="s">${s.w ? `${(rate * s.w).toFixed(1)} ${what} a second${left ? `, runs out in about ${secs(left)}` : ''}` : 'Nobody is working here'}. ${p.idle} idle villagers.</div></div>${workerCtl(s.id, s.w, G.MAX_W, p.idle)}</div></div>`;
    h += `<p class="small soft">More workers make ${what} faster, but the ${s.k === 'farm' ? 'farm' : 'mine'} runs out sooner.</p>`;
    if (s.k === 'farm') h += s.rp ? progRow('Replanting', s.rp - G.REPLANT_MS, s.rp) : `<button type="button" class="btn btn-lime btn-block mt" data-act="replant" data-s="${s.id}"${s.left > s.max * 0.5 || p.c < G.REPLANT_C ? ' disabled' : ''}>Replant for ${G.REPLANT_C} gold</button><p class="small soft">You can replant once a farm is half empty. It refills in ${G.REPLANT_MS / 1000}s.</p>`;
    else h += `<button type="button" class="btn btn-ghost btn-block mt" data-act="close-mine" data-s="${s.id}">Close this mine</button><p class="small soft">Closing it sends the miners back to idle. Build a new mine for fresh gold.</p>`;
    return h;
  }
  function buildSheet() {
    const p = me();
    if (!p) return null;
    let h = sheetHead('Build', p.build ? `Building a ${BUILDS[p.build.b].name.toLowerCase()} right now` : 'One building at a time');
    if (p.build) h += progRow(`Building a ${BUILDS[p.build.b].name.toLowerCase()}`, p.build.from, p.build.at);
    h += `<div class="blist">`;
    for (const k of BUILD_ORDER) {
      const B = BUILDS[k], max = B.max[p.age - 1], have = countOf(p, k);
      const why = p.age < B.age ? `Unlocks in the ${AGES[B.age - 1]} age` : have >= max ? (p.age < 4 ? 'Upgrade your Town Hall for more' : 'Maxed out') : p.build ? 'Busy building' : !canAfford(p, B.j, B.c) ? 'Not enough yet' : '';
      h += `<div class="brow"><div class="main"><div class="t">${B.name} <span class="soft small">${have}/${max}</span></div><div class="s">${B.what}. ${secs(B.ms)}</div><div class="cost">${costText(B.j, B.c)}${why ? ` <span class="soft">· ${why}</span>` : ''}</div></div><button type="button" class="btn btn-grape btn-sm" data-act="build" data-b="${k}"${why ? ' disabled' : ''}>Build</button></div>`;
    }
    return h + `</div>`;
  }
  function milSheet(b) {
    const p = me();
    if (!p) return null;
    const B = BUILDS[b], col = colorOf(lookOf(uid));
    if (!p[b]) {
      const why = p.age < B.age ? `Unlocks in the ${AGES[B.age - 1]} age` : p.build ? 'You’re busy building something else' : !canAfford(p, B.j, B.c) ? 'Not enough yet' : '';
      return sheetHead(B.name, B.what) + `<p class="small soft">Costs ${costText(B.j, B.c)} and takes ${secs(B.ms)}.</p><button type="button" class="btn btn-grape btn-block mt" data-act="build" data-b="${b}"${why ? ' disabled' : ''}>Build it</button>${why ? `<p class="small soft">${why}.</p>` : ''}`;
    }
    let h = sheetHead(B.name, `Population ${popOf(p)}/${capOf(p)}`);
    const c = p.cur[b];
    if (c) h += progRow(`Training a ${UNITS[c.u].name.toLowerCase()}${p.q[b].length ? `, ${p.q[b].length} more waiting` : ''}`, c.from, c.at);
    h += `<div class="jobs"><div class="brow"><div class="main"><div class="t">Workers</div><div class="s">Each one trains troops 25% faster. ${p.idle} idle.</div></div>${workerCtl(b, p.milW[b], G.MIL_W, p.idle)}</div></div>`;
    for (const u of UNIT_ORDER.filter(k => UNITS[k].b === b)) {
      const U = UNITS[u], locked = p.age < U.age;
      const room = Math.max(0, capOf(p) - popOf(p)), maxN = Math.max(0, Math.min(20, room, U.j ? Math.floor(p.j / U.j) : 20, U.c ? Math.floor(p.c / U.c) : 20));

    LIVE = cfg.FARM_LIVE === true;
    ENV = LIVE ? 'farm' : 'farmPreview';
    try { FSK = await import('./farm-skins.js'); const st = document.createElement('style'); st.textContent = FSK.CSS; document.head.appendChild(st); } catch (e) { ui.fatal = 'noskins'; render(); return; }
    TESTERS = Array.isArray(cfg.FARM_TESTERS) ? cfg.FARM_TESTERS.map(x => String(x).trim().replace(/^@/, '').toLowerCase()) : [];
    try { FB = await loadFirebase(); } catch (e) { ui.fatal = 'offline'; render(); return; }
    const fbApp = FB.initializeApp(fc);
    auth = FB.getAuth(fbApp);
    fs = FB.getFirestore(fbApp);
    FB.onAuthStateChanged(auth, user => { authReady = true; if (user) startSession(user); else endSession(); });
    setInterval(() => { if (route() === 'game') refresh(); }, 1000);
  }
  boot();
</script>
</body>
</html>
