<script>
// Runs before the game. If anything breaks, or the game files never load, show why instead of a blank screen.
(function () {
  function show(msg) {
    if (document.getElementById('fatal')) return;
    var d = document.createElement('div'); d.id = 'fatal'; d.className = 'err';
    d.innerHTML = '<div style="max-width:520px"><h2>Scobb Strike couldn\u2019t start</h2><p class="soft">' + String(msg).replace(/</g, '&lt;') + '</p><p class="small soft">In Safari, hold Option and Command and press R to reload fresh files. If it still fails, screenshot this and send it to whoever set up ScobbBucks.</p><p class="small soft" style="word-break:break-all">' + navigator.userAgent + '</p><a class="btn" style="display:inline-grid;place-items:center;text-decoration:none" href="./">Back to ScobbBucks</a></div>';
    document.body.appendChild(d);
  }
  window.__strikeFatal = show;
  window.addEventListener('error', function (e) { show((e.message || 'Unknown error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); });
  setTimeout(function () { if (!window.__strikeLoaded) show('The game files didn\u2019t finish loading. This usually means the browser is holding an old copy.'); }, 9000);
})();
</script>
