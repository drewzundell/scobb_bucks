<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scobb Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800;900&display=swap">
<style>
:root { --ink: #F2F4F7; --soft: #A9B0BC; --line: rgba(255,255,255,.14); --acc: #8E83FF; --red: #FF5A5F; --green: #4FCB96; --gold: #F2B356; --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #07080B; color: var(--ink); font: 400 16px/1.4 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#ui > * { pointer-events: auto; }
.shade { position: fixed; inset: 0; background: linear-gradient(90deg, rgba(5,6,10,.92) 0%, rgba(5,6,10,.7) 34%, rgba(5,6,10,0) 62%), linear-gradient(0deg, rgba(5,6,10,.6), transparent 30%); pointer-events: none !important; }
.side { position: fixed; left: 0; top: 0; bottom: 0; width: min(440px, 100vw); padding: calc(28px + env(safe-area-inset-top, 0px)) 30px 30px; overflow-y: auto; }
.logo { font-size: 46px; font-weight: 900; letter-spacing: -0.04em; line-height: .9; margin: 0; text-transform: uppercase; }
.logo span { color: var(--acc); display: block; }
.tag { color: var(--soft); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; margin-top: 8px; }
.nav { display: grid; gap: 4px; margin-top: 30px; }
.nav button { text-align: left; background: none; border: 0; padding: 10px 0 10px 14px; border-left: 3px solid transparent; font-size: 24px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; color: rgba(255,255,255,.78); }
.nav button:hover, .nav button.on { color: #fff; border-left-color: var(--acc); background: linear-gradient(90deg, rgba(142,131,255,.18), transparent); }
.nav button small { display: block; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: none; color: var(--soft); }
.nav button:disabled { opacity: .45; cursor: default; }
.card { background: rgba(14,16,22,.86); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.kd { display: flex; gap: 18px; margin-top: 22px; }
.kd div b { display: block; font-size: 26px; font-weight: 900; }
.kd div span { color: var(--soft); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 100vw); padding: calc(24px + env(safe-area-inset-top, 0px)) 22px 30px; overflow-y: auto; background: rgba(8,9,13,.92); border-left: 1px solid var(--line); }
.panel h2 { margin: 0 0 4px; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; }
.panel h3 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin: 20px 0 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 10px; padding: 7px 10px; font-weight: 700; font-size: 14px; text-align: left; }
.opt small { display: block; font-weight: 500; font-size: 11.5px; color: var(--soft); max-width: 210px; }
.opt[aria-pressed="true"] { background: #fff; color: #0B0C10; border-color: #fff; }
.opt[aria-pressed="true"] small { color: #3A3F4A; }
.opt.lock { opacity: .55; }
.opt .price { display: block; color: var(--gold); font-size: 11.5px; font-weight: 800; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; font-size: 12px; color: var(--soft); }
.stats div { background: rgba(255,255,255,.05); border-radius: 8px; padding: 6px 8px; }
.stats b { display: block; font-size: 15px; color: #fff; }
.btn { border: 0; border-radius: 12px; height: 50px; padding: 0 22px; font-weight: 800; font-size: 16px; background: #fff; color: #0B0C10; letter-spacing: .02em; }
.btn.ghost { background: rgba(255,255,255,.08); color: #fff; border: 1px solid var(--line); }
.btn.block { width: 100%; }
.soft { color: var(--soft); }
.small { font-size: 13.5px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14.5px; align-items: center; }
.keys kbd { display: inline-block; min-width: 28px; text-align: center; padding: 3px 8px; border-radius: 7px; background: rgba(255,255,255,.1); border: 1px solid var(--line); font: 800 13px var(--font); }
.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,6,10,.72); z-index: 20; }
.overlay .card { width: min(92vw, 460px); }
.rand { width: min(92vw, 760px); text-align: center; }
.rand h2 { font-size: 22px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; margin: 0 0 14px; }
.rwin { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: rgba(8,9,13,.9); padding: 14px 0; }
.rstrip { display: flex; gap: 10px; width: max-content; will-change: transform; }
.rcard { width: 170px; height: 104px; flex: none; border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: flex-end; font-weight: 800; font-size: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.rcard.won { outline: 3px solid #fff; }
.rmark { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: #fff; margin-left: -1px; box-shadow: 0 0 10px #fff; }
#hud { position: fixed; inset: 0; pointer-events: none; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
.ch { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.ch i { position: absolute; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,.8); }
.hit { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: 0; }
.hit::before, .hit::after { content: ""; position: absolute; left: 10px; top: -2px; width: 2px; height: 26px; background: #fff; transform: rotate(45deg); }
.hit::after { transform: rotate(-45deg); }
.hit.on { opacity: 1; }
.hit.kill::before, .hit.kill::after { background: var(--red); }
.hp { position: absolute; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 230px; }
.hp .bar { height: 8px; border-radius: 5px; background: rgba(255,255,255,.16); overflow: hidden; margin-top: 5px; }
.hp .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4FCB96, #9FF0C6); }
.prot { color: #9ED8FF; font-size: 13px; }
.inv { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
.slot { min-width: 118px; padding: 7px 10px; border-radius: 10px; background: rgba(8,9,13,.6); border: 1px solid var(--line); font-size: 12.5px; }
.slot b { display: block; font-size: 15px; }
.slot kbd { float: right; font: 800 11px var(--font); color: var(--soft); }
.slot.on { border-color: #B8B0FF; background: rgba(74,58,224,.75); }
.hp, .ammo { background: rgba(8,9,13,.5); padding: 6px 12px; border-radius: 12px; }
.ammo { position: absolute; right: 20px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: right; }
.ammo b { font-size: 36px; font-weight: 900; }
.ammo span { display: block; font-size: 13px; color: #ddd; }
.top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; background: rgba(8,9,13,.55); padding: 6px 14px; border-radius: 10px; font-size: 13.5px; }
.top b { font-size: 20px; display: block; }
.mini { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; width: 170px; height: 170px; border-radius: 14px; border: 1px solid var(--line); background: rgba(8,9,13,.6); }
.feed { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 14px; font-size: 13px; display: grid; gap: 4px; }
.feed div { background: rgba(8,9,13,.55); padding: 3px 8px; border-radius: 8px; }
.msg { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; font-size: 32px; font-weight: 900; transition: opacity .3s; }
.msg small { display: block; font-size: 16px; font-weight: 600; opacity: .85; }
.dmg { position: absolute; inset: 0; box-shadow: inset 0 0 120px 40px rgba(255, 40, 40, .55); opacity: 0; transition: opacity .35s; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.scope { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vmin, #000 34.3vmin); }
.scope::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #000; }
.scope::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #000; }
.board { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(92vw, 520px); background: rgba(8,9,13,.88); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; font-size: 14.5px; }
.board[hidden], .pause[hidden], .overlay[hidden], #hud[hidden], #ui[hidden], .panel[hidden] { display: none; }
.board table { width: 100%; border-collapse: collapse; }
.board th { text-align: left; color: var(--soft); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 6px; }
.board td { padding: 6px; border-top: 1px solid var(--line); }
.board tr.me td { color: #C9C2FF; }
.pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(5,6,10,.75); pointer-events: auto; }
.pause .card { width: min(92vw, 420px); }
.touch { position: absolute; inset: 0; pointer-events: none; }
.touch .stick { position: absolute; left: 24px; bottom: 110px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); pointer-events: auto; }
.touch .stick i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.35); }
.touch .tb { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; font-weight: 800; font-size: 12px; pointer-events: auto; }
.err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: #07080B; z-index: 50; }
@media (max-width: 720px) { .shade { background: rgba(5,6,10,.6); } .logo { font-size: 38px; } .slot { min-width: 0; padding: 5px 7px; } .slot b { font-size: 12.5px; } .mini { width: 120px; height: 120px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="hud" hidden></div>
<script type="module">
import { create } from './scobb3d.js';
const $ = s => document.querySelector(s);
const TEST = new URLSearchParams(location.search).has('test');

/* ================= weapons: 7 classes, 5 tiers each ================= */
const CLASSES = {
  ar: { name: 'Assault rifle', p: true, b: { dmg: 26, rpm: 650, mag: 30, reload: 2.0, hip: 0.035, adsS: 0.006, range: 40, recoil: 0.016, ads: 0.22, auto: true, zoom: 1.3, move: 1 }, names: ['Scobb AR', 'Jelly M4', 'Tidal ACR', 'Volt Rifle', 'Mythic Scar'] },
  smg: { name: 'SMG', p: true, b: { dmg: 20, rpm: 900, mag: 32, reload: 1.7, hip: 0.04, adsS: 0.012, range: 18, recoil: 0.011, ads: 0.16, auto: true, zoom: 1.15, move: 1.08 }, names: ['Jelly SMG', 'Buzz MP5', 'Viper Vector', 'Comet P90', 'Mythic Kriss'] },
  sg: { name: 'Shotgun', p: true, b: { dmg: 14, pellets: 9, rpm: 75, mag: 6, reload: 2.6, hip: 0.085, adsS: 0.06, range: 9, recoil: 0.06, ads: 0.2, auto: false, zoom: 1.1, move: 1 }, names: ['Pump Shotgun', 'Twin Barrel', 'Auto Spitter', 'Dragon Breath', 'Mythic Saiga'] },
  sn: { name: 'Sniper', p: true, b: { dmg: 95, rpm: 45, mag: 5, reload: 3.0, hip: 0.12, adsS: 0, range: 120, recoil: 0.08, ads: 0.36, auto: false, zoom: 4, move: 0.92, scope: true }, names: ['Longshot', 'Hunter Bolt', 'Ghost Rifle', 'Railgun', 'Mythic Hawk'] },
  lmg: { name: 'LMG', p: true, b: { dmg: 25, rpm: 620, mag: 75, reload: 4.2, hip: 0.06, adsS: 0.014, range: 35, recoil: 0.015, ads: 0.4, auto: true, zoom: 1.35, move: 0.88 }, names: ['Heavy LMG', 'Brick Saw', 'Thunder MG', 'Titan Belt', 'Mythic Minigun'] },
  dmr: { name: 'Marksman', p: true, b: { dmg: 45, rpm: 300, mag: 12, reload: 2.4, hip: 0.06, adsS: 0.003, range: 70, recoil: 0.034, ads: 0.28, auto: false, zoom: 2, move: 0.96 }, names: ['Marksman DMR', 'Ranger', 'Sentinel', 'Laser DMR', 'Mythic Eagle'] },
  pi: { name: 'Pistol', p: false, b: { dmg: 30, rpm: 420, mag: 12, reload: 1.4, hip: 0.03, adsS: 0.01, range: 20, recoil: 0.03, ads: 0.12, auto: false, zoom: 1.15, move: 1.05 }, names: ['Scobb 9', 'Big Iron', 'Desert Hawk', 'Twin Viper', 'Mythic Hand Cannon'] }
};
const WEAPONS = {};
for (const c in CLASSES) CLASSES[c].names.forEach((nm, t) => {
  const b = CLASSES[c].b;
  WEAPONS[c + t] = Object.assign({}, b, { id: c + t, cls: CLASSES[c].name, ck: c, tier: t, name: nm,
    dmg: Math.round(b.dmg * (1 + 0.07 * t)), recoil: b.recoil * (1 - 0.07 * t), reload: b.reload * (1 - 0.05 * t), hip: b.hip * (1 - 0.05 * t),
    mag: Math.round(b.mag * (1 + 0.06 * t)), range: b.range * (1 + 0.06 * t), ads: b.ads * (1 - 0.04 * t), move: b.move * (1 + 0.01 * t), rpm: Math.round(b.rpm * (1 + 0.03 * t)) });
});
const PRIM = Object.keys(CLASSES).filter(c => CLASSES[c].p);
// Gun skins, same list as ScobbBucks. [id, name, rarity, color, accent, pattern, animated]
const SKN = [
  ['sk00', 'Cherry Red', 0, '#E5484D', '#FFD5D6', 0, 0], ['sk01', 'Sky Blue', 0, '#4BA3F2', '#E3F1FF', 0, 0], ['sk02', 'Forest', 0, '#2F8F5B', '#CFF2DC', 0, 0], ['sk03', 'Sand', 0, '#D9C29A', '#5B4426', 0, 0], ['sk04', 'Snow', 0, '#EDEDF0', '#3A3A44', 0, 0], ['sk05', 'Charcoal', 0, '#33333B', '#F45B69', 0, 0],
  ['sk06', 'Mint Stripes', 1, '#7EDDB0', '#FFFFFF', 1, 0], ['sk07', 'Grape Dots', 1, '#7B4FE0', '#F1E8FF', 2, 0], ['sk08', 'Lemon Stripes', 1, '#F5CF4A', '#7A5B00', 1, 0], ['sk09', 'Ocean Camo', 1, '#2A6F97', '#8FD3E8', 3, 0],
  ['sk10', 'Neon Pink', 2, '#FF4FA3', '#FFD1EA', 4, 0], ['sk11', 'Volt', 2, '#C8FF2E', '#1B2A00', 4, 0], ['sk12', 'Ice Shard', 2, '#9EF6FF', '#1E4A6B', 3, 0], ['sk13', 'Jungle Camo', 2, '#3E7B3A', '#C9E7A0', 3, 0],
  ['sk14', 'Galaxy', 3, '#3B1E8C', '#9B7BFF', 4, 1], ['sk15', 'Lava Flow', 3, '#FF5A2A', '#FFD35A', 4, 1], ['sk16', 'Gold Plate', 3, '#F2B531', '#7A5200', 4, 0], ['sk17', 'Hologram', 3, '#7CFFE9', '#FF7CF0', 4, 1],
  ['sk18', 'Aurora', 4, '#35F2B4', '#7B5BFF', 4, 1], ['sk19', 'Crystal Tiger', 4, '#FFB347', '#FFFFFF', 1, 1],
  ['sk20', 'Scobb Prism', 5, '#FFFFFF', '#6B5BFF', 4, 1], ['sk21', 'Void Pulse', 5, '#0B0B14', '#FF2E88', 1, 1]
];
const skinInfo = id => SKN.find(x => x[0] === id) || null;
const hx = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mixHex = (a, b, k) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
// Every attachment helps something and costs something.
const ATT = {
  optic: [['Iron sights', {}, 'Fastest aim, no zoom', 0], ['Red dot', { zoom: 1.15, adsS: 0.85, ads: 1.05 }, '+ Tighter aim · − Slightly slower to aim', 1], ['Holo', { zoom: 1.35, adsS: 0.9, ads: 1.12 }, '+ More zoom · − Slower to aim', 2], ['4x scope', { zoom: 2.4, ads: 1.3, hip: 1.25, scope: 1 }, '+ Long range zoom · − Much slower aim, worse hip fire', 3]],
  barrel: [['Stock barrel', {}, 'Balanced', 0], ['Suppressor', { recoil: 0.88, range: 0.82, quiet: 1 }, '+ Quiet, less kick · − Shorter range', 1], ['Compensator', { recoil: 0.72, hip: 1.2 }, '+ Much less kick · − Worse hip fire', 2], ['Long barrel', { range: 1.4, ads: 1.12, move: 0.96 }, '+ Much more range · − Slower aim and movement', 3]],
  mag: [['Standard', {}, 'Balanced', 0], ['Fast mag', { reload: 0.7, mag: 0.85 }, '+ Faster reload · − Fewer rounds', 1], ['Extended', { mag: 1.5, reload: 1.15, move: 0.94 }, '+ 50% more ammo · − Slower reload and movement', 2], ['Drum', { mag: 2.0, reload: 1.35, move: 0.9, ads: 1.1 }, '+ Double ammo · − Heavy: slow reload, aim and movement', 3]],
  grip: [['None', {}, 'Balanced', 0], ['Light stock', { move: 1.06, ads: 0.85, recoil: 1.18 }, '+ Faster aim and movement · − More kick', 1], ['Laser', { hip: 0.65, loud: 1 }, '+ Great hip fire · − Enemies spot you sooner', 2], ['Vertical grip', { recoil: 0.78, ads: 1.1 }, '+ Much less kick · − Slower to aim', 3]]
};
const RN = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary', 'Mythic'];
const WPRICE = [null, [0, 12], [1, 8], [2, 5], [3, 3]], APRICE = [null, [0, 6], [1, 5], [2, 3]];
const priceText = pr => (pr ? `${pr[1]} ${RN[pr[0]]}` : 'Free');
const PERKS = [
  [['Lightweight', 'Move 8% faster · reload 15% slower'], ['Flak jacket', 'Half explosion damage · move 8% slower'], ['Scavenger', 'Restock on kills · health comes back slower']],
  [['Fast hands', 'Reload and swap 30% faster · hip fire 15% looser'], ['Hardline', 'Carry 2 lethals · swap 30% slower'], ['Steady aim', 'Tighter hip fire · move 8% slower']],
  [['Ninja', 'Enemies notice you later · your guns do 10% less'], ['Quick fix', 'Health comes back sooner · take 10% more damage'], ['Dead eye', 'Headshots hit 75% harder · body shots 10% weaker']]
];
const TACT = { stim: ['Stim shot', 'Heals you to full'], flash: ['Flashbang', 'Blinds anyone looking at it'], smoke: ['Smoke grenade', 'Blocks sight for 8 seconds'] };
const LETH = { frag: ['Frag grenade', 'Cook and throw. It can kill you too'], semtex: ['Semtex', 'Sticks to what it hits'], molotov: ['Molotov', 'Burns an area'], knife: ['Throwing knife', 'One hit kill if it lands'] };
const DEFAULT_LOADOUT = { primary: 'ar0', secondary: 'pi0', att: { optic: 0, barrel: 0, mag: 0, grip: 0 }, perks: [0, 0, 1], tac: 'stim', leth: 'frag', skin: '' };
let loadout = (() => { try { return Object.assign({}, DEFAULT_LOADOUT, JSON.parse(localStorage.getItem('scobbstrike-loadout2') || '{}')); } catch (e) { return Object.assign({}, DEFAULT_LOADOUT); } })();
const saveLoadout = () => { try { localStorage.setItem('scobbstrike-loadout2', JSON.stringify(loadout)); } catch (e) { /* private mode */ } };
let owned = new Set(), myLook = null, stats = {}, skinsOwned = new Set();
const ownsW = id => WEAPONS[id] && (WEAPONS[id].tier === 0 || owned.has('w:' + id));
const ownsA = (slot, i) => i === 0 || owned.has('a:' + slot + ':' + i);
function fixLoadout() {
  if (!WEAPONS[loadout.primary] || !CLASSES[WEAPONS[loadout.primary].ck].p) loadout.primary = 'ar0';
  if (!ownsW(loadout.primary)) loadout.primary = WEAPONS[loadout.primary].ck + '0';
  if (!WEAPONS[loadout.secondary] || WEAPONS[loadout.secondary].ck !== 'pi' || !ownsW(loadout.secondary)) loadout.secondary = 'pi0';
  loadout.att = Object.assign({ optic: 0, barrel: 0, mag: 0, grip: 0 }, loadout.att);
  if (loadout.skin && !skinsOwned.has(loadout.skin)) loadout.skin = '';
  for (const s in ATT) if (!ownsA(s, loadout.att[s] || 0)) loadout.att[s] = 0;
}
function gunStats(key, att) {
  const w = Object.assign({}, WEAPONS[key]);
  if (!att) return w;
  for (const slot in ATT) {
    const m = ATT[slot][att[slot] || 0][1];
    if (m.zoom) w.zoom = Math.max(w.zoom, m.zoom);
    if (m.scope) w.scope = true;
    for (const k of ['adsS', 'recoil', 'range', 'ads', 'reload', 'hip', 'move']) if (m[k]) w[k] *= m[k];
    if (m.mag) w.mag = Math.max(1, Math.round(w.mag * m.mag));
    if (m.quiet) w.quiet = true;
    if (m.loud) w.loud = true;
  }
  return w;
}

/* ================= maps ================= */
// Boxes are [x, y, z, halfX, halfY, halfZ, color, emissive]. y is the center height.
function stairs(x, z, dir, n, w, col) { const out = []; for (let i = 0; i < n; i++) { const h = 0.4 * (i + 1); out.push(dir === 'x' ? [x + i * 0.6, h / 2, z, 0.3, h / 2, w, col] : dir === '-x' ? [x - i * 0.6, h / 2, z, 0.3, h / 2, w, col] : dir === '-z' ? [x, h / 2, z - i * 0.6, w, h / 2, 0.3, col] : [x, h / 2, z + i * 0.6, w, h / 2, 0.3, col]); } return out; }
function walls(S, H, col) { return [[0, H / 2, -S, S, H / 2, 0.5, col], [0, H / 2, S, S, H / 2, 0.5, col], [-S, H / 2, 0, 0.5, H / 2, S, col], [S, H / 2, 0, 0.5, H / 2, S, col]]; }

let FB = null, fsdb = null, ME_UID = null;
async function initFirebase() {
  try {
    const cfg = await import('./firebase-config.js');
    const base = 'https://www.gstatic.com/firebasejs/12.15.0/';
    const [app, au, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    FB = Object.assign({}, app, au, fs);
    const a = FB.initializeApp(cfg.FIREBASE_CONFIG);
    const auth = FB.getAuth(a); fsdb = FB.getFirestore(a);
    FB.onAuthStateChanged(auth, u => {
      ME_UID = u ? u.uid : null;
      if (u) FB.onSnapshot(FB.doc(fsdb, 'fpsStats/' + u.uid), d => { stats = d.data() || {}; owned = new Set(stats.owned || []); skinsOwned = new Set(stats.skins || []); myLook = stats.look || null; fixLoadout(); if (view !== 'game') drawUI(); }, () => {});
      if (view !== 'game') drawUI();
    });
  } catch (e) { /* offline: practice still works with free gear */ }
}

/* ================= math and collision ================= */
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]], add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]], scl = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const len = a => Math.hypot(a[0], a[1], a[2]), nrm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const rand = (a, b) => a + Math.random() * (b - a);
function rayBox(o, d, bx, maxT) {
  let t0 = 0, t1 = maxT;
  for (let i = 0; i < 3; i++) {
    if (Math.abs(d[i]) < 1e-9) { if (o[i] < bx.min[i] || o[i] > bx.max[i]) return -1; continue; }
    let a = (bx.min[i] - o[i]) / d[i], b = (bx.max[i] - o[i]) / d[i];
    if (a > b) { const t = a; a = b; b = t; }
    t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    if (t0 > t1) return -1;
  }
  return t0;
}
function raySphere(o, d, c, r, maxT) { const oc = sub(o, c), b = oc[0] * d[0] + oc[1] * d[1] + oc[2] * d[2], cc = oc[0] * oc[0] + oc[1] * oc[1] + oc[2] * oc[2] - r * r, h = b * b - cc; if (h < 0) return -1; const t = -b - Math.sqrt(h); return t >= 0 && t <= maxT ? t : -1; }
function worldHit(o, d, maxT) { let best = maxT; for (const bx of M.solid) { const t = rayBox(o, d, bx, best); if (t >= 0 && t < best) best = t; } return best; }
function smokeBlocks(o, d, maxT) { return smokes.some(s => raySphere(o, d, s.p, 3.2, maxT) >= 0); }
