<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scobb Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800;900&display=swap">
<style>
:root { --bg: #0E1014; --card: #181B21; --card2: #20242B; --ink: #F2F4F7; --soft: #9AA1AD; --line: #2A2F37; --acc: #8E83FF; --red: #FF5A5F; --green: #4FCB96; --gold: #F2B356; --font: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 16px/1.4 var(--font); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
#menu { position: fixed; inset: 0; overflow-y: auto; padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 40px; background: radial-gradient(120% 80% at 50% 0%, #262A44 0%, #0E1014 60%); }
#menu > * { max-width: 760px; margin-left: auto; margin-right: auto; }
.brand { display: flex; align-items: center; justify-content: space-between; }
.brand h1 { font-size: 34px; font-weight: 900; letter-spacing: -0.03em; margin: 0; }
.brand h1 span { color: var(--acc); }
.brand a { color: var(--soft); text-decoration: none; font-weight: 600; }
h2 { font-size: 18px; margin: 26px 0 10px; font-weight: 700; }
.soft { color: var(--soft); }
.small { font-size: 14px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 20px; padding: 16px; }
.mode b { display: block; font-size: 19px; }
.mode.hero { background: linear-gradient(135deg, #4A3AE0, #8E3AE0); border: 0; box-shadow: 0 18px 30px -16px rgba(110, 70, 255, .7); }
.mode.hero span { color: rgba(255,255,255,.8); }
.mode:disabled { opacity: .55; cursor: default; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.opt { border: 1px solid var(--line); background: var(--card2); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 14.5px; }
.opt[aria-pressed="true"] { background: var(--ink); color: #0E1014; border-color: var(--ink); }
.opt small { display: block; font-weight: 400; font-size: 12px; opacity: .75; }
.lbl { font-size: 13px; color: var(--soft); font-weight: 600; margin: 14px 0 6px; text-transform: none; }
.btn { border: 0; border-radius: 14px; height: 50px; padding: 0 20px; font-weight: 700; font-size: 16px; background: var(--ink); color: #0E1014; }
.btn.ghost { background: var(--card2); color: var(--ink); border: 1px solid var(--line); }
.btn.block { width: 100%; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; font-size: 13px; }
.stats div { background: var(--card2); border-radius: 10px; padding: 6px 8px; }
.stats b { display: block; font-size: 15px; }
.maps { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.mapc { border-radius: 14px; padding: 12px; border: 1px solid var(--line); text-align: left; min-height: 74px; }
.mapc b { display: block; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.mapc span { font-size: 12.5px; color: rgba(255,255,255,.85); }
#game { position: fixed; inset: 0; background: #000; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: absolute; inset: 0; pointer-events: none; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.ch { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.ch i { position: absolute; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,.8); }
.hit { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px; opacity: 0; transition: opacity .15s; }
.hit::before, .hit::after { content: ""; position: absolute; left: 10px; top: -2px; width: 2px; height: 26px; background: #fff; transform: rotate(45deg); }
.hit::after { transform: rotate(-45deg); }
.hit.on { opacity: 1; transition: none; }
.hit.kill::before, .hit.kill::after { background: var(--red); }
.hp { position: absolute; left: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 220px; }
.hp .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 4px; }
.hp .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4FCB96, #8EE8B9); }
.ammo { position: absolute; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: right; }
.ammo b { font-size: 34px; font-weight: 900; }
.ammo .eq { font-size: 13px; color: #ddd; margin-top: 2px; }
.top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; background: rgba(14,16,20,.55); padding: 6px 14px; border-radius: 12px; font-size: 14px; }
.top b { font-size: 20px; display: block; }
.board { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; background: rgba(14,16,20,.55); border-radius: 12px; padding: 8px 10px; font-size: 13px; min-width: 150px; }
.board div { display: flex; justify-content: space-between; gap: 10px; }
.board .me { color: #C9C2FF; }
.feed { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 14px; font-size: 13px; display: grid; gap: 4px; }
.feed div { background: rgba(14,16,20,.55); padding: 3px 8px; border-radius: 8px; }
.msg { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; font-size: 30px; font-weight: 900; }
.msg small { display: block; font-size: 16px; font-weight: 600; opacity: .85; }
.dmg { position: absolute; inset: 0; box-shadow: inset 0 0 120px 40px rgba(255, 40, 40, .55); opacity: 0; transition: opacity .35s; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
.scope { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle at 50% 50%, transparent 0 34vmin, #000 34.3vmin); }
.scope::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #000; }
.scope::after { content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #000; }
.pause[hidden] { display: none; }
.pause { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(14,16,20,.7); pointer-events: auto; }
.pause .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; width: min(92vw, 380px); text-align: center; }
.touch { position: absolute; inset: 0; pointer-events: none; }
.touch .stick { position: absolute; left: 24px; bottom: 90px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2); pointer-events: auto; }
.touch .stick i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.35); }
.touch .tb { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.12); color: #fff; font-weight: 800; font-size: 13px; pointer-events: auto; }
</style>
</head>
<body>
<div id="menu"></div>
<div id="game" hidden><canvas id="cv"></canvas><div id="hud"></div></div>
<script type="module">
import { create } from './scobb3d.js';
const $ = s => document.querySelector(s);
const TEST = new URLSearchParams(location.search).has('test');

/* ================= weapons, attachments, perks, items ================= */
const WEAPONS = {
  ar: { name: 'Scobb AR', cls: 'Assault rifle', dmg: 26, rpm: 650, mag: 30, reload: 2.0, hip: 0.035, adsS: 0.006, range: 40, recoil: 0.016, ads: 0.22, auto: true, zoom: 1.3, move: 1 },
  smg: { name: 'Jelly SMG', cls: 'SMG', dmg: 20, rpm: 900, mag: 32, reload: 1.7, hip: 0.04, adsS: 0.012, range: 18, recoil: 0.011, ads: 0.16, auto: true, zoom: 1.15, move: 1.08 },
  shotgun: { name: 'Pump Shotgun', cls: 'Shotgun', dmg: 14, pellets: 9, rpm: 75, mag: 6, reload: 2.6, hip: 0.085, adsS: 0.06, range: 9, recoil: 0.06, ads: 0.2, auto: false, zoom: 1.1, move: 1 },
  sniper: { name: 'Longshot', cls: 'Sniper', dmg: 95, rpm: 45, mag: 5, reload: 3.0, hip: 0.12, adsS: 0, range: 120, recoil: 0.08, ads: 0.36, auto: false, zoom: 4, move: 0.92, scope: true },
  lmg: { name: 'Heavy LMG', cls: 'LMG', dmg: 25, rpm: 620, mag: 75, reload: 4.2, hip: 0.06, adsS: 0.014, range: 35, recoil: 0.015, ads: 0.4, auto: true, zoom: 1.35, move: 0.88 },
  dmr: { name: 'Marksman DMR', cls: 'Marksman', dmg: 45, rpm: 300, mag: 12, reload: 2.4, hip: 0.06, adsS: 0.003, range: 70, recoil: 0.034, ads: 0.28, auto: false, zoom: 2, move: 0.96 },
  pistol: { name: 'Scobb 9', cls: 'Pistol', dmg: 30, rpm: 420, mag: 12, reload: 1.4, hip: 0.03, adsS: 0.01, range: 20, recoil: 0.03, ads: 0.12, auto: false, zoom: 1.15, move: 1.05 },
  revolver: { name: 'Big Iron', cls: 'Pistol', dmg: 55, rpm: 150, mag: 6, reload: 2.6, hip: 0.03, adsS: 0.007, range: 28, recoil: 0.07, ads: 0.15, auto: false, zoom: 1.2, move: 1.04 },
  mp: { name: 'Machine Pistol', cls: 'Pistol', dmg: 17, rpm: 1000, mag: 20, reload: 1.5, hip: 0.05, adsS: 0.02, range: 12, recoil: 0.012, ads: 0.12, auto: true, zoom: 1.1, move: 1.06 }
};
const PRIMARY = ['ar', 'smg', 'shotgun', 'sniper', 'lmg', 'dmr'], SECONDARY = ['pistol', 'revolver', 'mp'];
const ATT = {
  optic: [['Iron sights', {}, 'Default'], ['Red dot', { zoom: 1.15, adsS: 0.85 }, 'Cleaner aim'], ['Holo', { zoom: 1.3 }, 'More zoom'], ['4x scope', { zoom: 2.4, ads: 1.25, scope: 1 }, 'Long range']],
  barrel: [['Stock barrel', {}, 'Default'], ['Suppressor', { recoil: 0.85, range: 0.9, quiet: 1 }, 'Quiet, less kick'], ['Long barrel', { range: 1.35, ads: 1.1 }, 'More range'], ['Compensator', { recoil: 0.7 }, 'Much less kick']],
  mag: [['Standard', {}, 'Default'], ['Extended', { mag: 1.5, reload: 1.15 }, '+50% ammo'], ['Fast mag', { reload: 0.7 }, 'Faster reload']],
  grip: [['None', {}, 'Default'], ['Vertical grip', { recoil: 0.8 }, 'Less kick'], ['Laser', { hip: 0.65 }, 'Better hip fire'], ['Light stock', { move: 1.05, ads: 0.85 }, 'Faster aim and move']]
};
const PERKS = [
  [['Lightweight', 'Move 8% faster'], ['Flak jacket', 'Half damage from explosions'], ['Scavenger', 'Refill ammo and lethal on kills']],
  [['Fast hands', 'Reload and swap 30% faster'], ['Hardline', 'Carry 2 lethals'], ['Steady aim', '30% tighter hip fire']],
  [['Ninja', 'Bots notice you later'], ['Quick fix', 'Health comes back sooner'], ['Dead eye', 'Headshots hit harder']]
];
const TACT = { stim: ['Stim shot', 'Heals you to full'], flash: ['Flashbang', 'Blinds anyone looking at it'], smoke: ['Smoke grenade', 'Blocks sight for 8 seconds'] };
const LETH = { frag: ['Frag grenade', 'Cook and throw. Careful, it can kill you too'], semtex: ['Semtex', 'Sticks to what it hits'], molotov: ['Molotov', 'Burns an area'], knife: ['Throwing knife', 'One hit kill if it lands'] };
const DEFAULT_LOADOUT = { primary: 'ar', secondary: 'pistol', att: { optic: 1, barrel: 0, mag: 0, grip: 1 }, perks: [0, 0, 1], tac: 'stim', leth: 'frag' };
let loadout = (() => { try { return Object.assign({}, DEFAULT_LOADOUT, JSON.parse(localStorage.getItem('scobbstrike-loadout') || '{}')); } catch (e) { return Object.assign({}, DEFAULT_LOADOUT); } })();
const saveLoadout = () => { try { localStorage.setItem('scobbstrike-loadout', JSON.stringify(loadout)); } catch (e) { /* private mode */ } };
function gunStats(key, att) {
  const w = Object.assign({}, WEAPONS[key]);
  if (!att) return w;
  for (const slot in ATT) {
    const m = ATT[slot][att[slot] || 0][1];
    if (m.zoom) w.zoom = Math.max(w.zoom, m.zoom);
    if (m.scope) w.scope = true;
    for (const k of ['adsS', 'recoil', 'range', 'ads', 'reload', 'hip', 'move']) if (m[k]) w[k] *= m[k];
    if (m.mag) w.mag = Math.round(w.mag * m.mag);
    if (m.quiet) w.quiet = true;
  }
  return w;
}

/* ================= maps ================= */
// Boxes are [x, y, z, halfX, halfY, halfZ, color, emissive]. y is the center height.
function stairs(x, z, dir, n, w, col) { const out = []; for (let i = 0; i < n; i++) { const h = 0.4 * (i + 1); out.push(dir === 'x' ? [x + i * 0.6, h / 2, z, 0.3, h / 2, w, col] : [x, h / 2, z + i * 0.6, w, h / 2, 0.3, col]); } return out; }
function walls(S, H, col) { return [[0, H / 2, -S, S, H / 2, 0.5, col], [0, H / 2, S, S, H / 2, 0.5, col], [-S, H / 2, 0, 0.5, H / 2, S, col], [S, H / 2, 0, 0.5, H / 2, S, col]]; }
const MAPS = [
  { name: 'Jelly Factory', blurb: 'Indoor warehouse with crates and a catwalk', sky: '#C9D3E6', ground: '#6B7180', fog: ['#9AA3B5', 0.006], floor: '#5E636E', S: 26, tint: 'linear-gradient(135deg,#5B6475,#2A2F37)',
    boxes: [...walls(26, 9, '#A9AFBC'), [0, 3, 0, 6, 0.2, 2, '#5C6370'], [-6.2, 1.5, 0, 0.2, 1.5, 2, '#5C6370'], [6.2, 1.5, 0, 0.2, 1.5, 2, '#5C6370'], ...stairs(-12.4, -1, 'x', 7, 1, '#6E7684'),
      [-14, 1, -12, 1.2, 1, 1.2, '#C58A4E'], [-11, 0.7, -10, 0.8, 0.7, 0.8, '#B97A3E'], [12, 1, 10, 1.2, 1, 1.2, '#C58A4E'], [15, 1.6, -14, 2, 1.6, 1, '#4A90E2'], [-16, 1.6, 14, 1, 1.6, 2, '#E25A4A'], [3, 1, -13, 3, 1, 0.6, '#C58A4E'], [-3, 1, 13, 3, 1, 0.6, '#C58A4E'], [18, 1, 0, 0.6, 1, 4, '#8A6BE0'], [-20, 1, -3, 0.6, 1, 3, '#8A6BE0'], [10, 2, -5, 1.5, 2, 1.5, '#7D838F'], [-9, 2, 6, 1.5, 2, 1.5, '#7D838F']],
    spawns: [[-22, 0, -22], [22, 0, 22], [-22, 0, 22], [22, 0, -22], [0, 0, -22], [0, 0, 22], [-22, 0, 0], [22, 0, 4]] },
  { name: 'Rooftops', blurb: 'City roofs at sunset with long sightlines', sky: '#FFD2A6', ground: '#6B4E5E', fog: ['#F2A98A', 0.006], floor: '#55505A', S: 30, tint: 'linear-gradient(135deg,#F2A98A,#6B4E7A)',
    boxes: [...walls(30, 4, '#3E3A44'), [-14, 3, -14, 8, 3, 8, '#B5523B'], [14, 2, 14, 8, 2, 8, '#8E98A3'], [14, 4, -14, 7, 4, 7, '#D9B97A'], [-14, 1.5, 14, 7, 1.5, 7, '#7A8C6E'], [0, 3.9, -14, 6, 0.15, 1, '#5C6370'], [-14, 2.9, 0, 1, 0.15, 6, '#5C6370'],
      ...stairs(-8, 18, 'x', 4, 1.2, '#6E6670'), ...stairs(4, 4, 'z', 5, 1.2, '#6E6670'), ...stairs(-4, -4, 'x', 8, 1.2, '#6E6670'), [20, 4.8, -14, 0.6, 0.8, 3, '#C9A06A'], [-14, 6.5, -10, 2, 0.5, 0.5, '#9C4535'], [0, 1, 0, 2, 1, 2, '#3E3A44']],
    spawns: [[-14, 6.1, -14], [14, 4.1, 14], [14, 8.1, -14], [-14, 3.1, 14], [0, 0, 0], [26, 0, 0], [-26, 0, 0], [0, 0, 26]] },
  { name: 'Desert Temple', blurb: 'Sandy ruins around a stepped pyramid', sky: '#FFE6B8', ground: '#C9A46B', fog: ['#F0D9A8', 0.005], floor: '#D9B97A', S: 28, tint: 'linear-gradient(135deg,#E8C27A,#A87A3E)',
    boxes: [...walls(28, 3, '#C9A46B'), [0, 0.5, 0, 7, 0.5, 7, '#C9A46B'], [0, 1.5, 0, 5, 0.5, 5, '#BF9A5E'], [0, 2.5, 0, 3, 0.5, 3, '#B58F52'], [0, 3.5, 0, 1.2, 0.5, 1.2, '#E3B341'],
      ...[-16, -8, 8, 16].flatMap(x => [[x, 2.5, -16, 0.7, 2.5, 0.7, '#E2C48A'], [x, 2.5, 16, 0.7, 2.5, 0.7, '#E2C48A']]), [-18, 1.2, 0, 0.6, 1.2, 4, '#B58F52'], [18, 1.2, 0, 0.6, 1.2, 4, '#B58F52'], [0, 1, -20, 5, 1, 0.6, '#B58F52'], [0, 1, 20, 5, 1, 0.6, '#B58F52'], [-10, 0.8, 9, 1.5, 0.8, 1, '#A87A3E'], [11, 0.8, -9, 1, 0.8, 1.5, '#A87A3E']],
    spawns: [[-24, 0, -24], [24, 0, 24], [-24, 0, 24], [24, 0, -24], [0, 4.1, 0], [-24, 0, 0], [24, 0, 0], [0, 0, 24]] },
  { name: 'Frozen Harbor', blurb: 'Icy docks stacked with shipping containers', sky: '#E6F2FF', ground: '#8FA8C0', fog: ['#DCE8F5', 0.008], floor: '#E8F0F8', S: 30, tint: 'linear-gradient(135deg,#BFD9F2,#5D7C9C)',
    boxes: [...walls(30, 3, '#9FB4C8'), [-12, 1.3, -10, 1.3, 1.3, 6, '#D9443B'], [-12, 3.9, -10, 1.3, 1.3, 6, '#2F74E8'], [12, 1.3, 10, 1.3, 1.3, 6, '#23A26F'], [8, 1.3, -14, 6, 1.3, 1.3, '#E39424'], [-8, 1.3, 15, 6, 1.3, 1.3, '#7C4DEB'], [0, 1.3, 0, 1.3, 1.3, 4, '#D9443B'],
      [18, 1.3, -4, 1.3, 1.3, 5, '#2F74E8'], [-20, 1.3, 4, 1.3, 1.3, 5, '#23A26F'], ...stairs(-15.5, -16.5, 'z', 6, 1.2, '#8FA8C0'), [20, 4, 18, 0.5, 4, 0.5, '#F2C14E'], [20, 7.8, 14, 0.4, 0.3, 4.5, '#F2C14E']],
    spawns: [[-26, 0, -26], [26, 0, 26], [-26, 0, 26], [26, 0, -26], [0, 0, -24], [0, 0, 24], [-12, 5.3, -10], [24, 0, 0]] },
  { name: 'Neon Arcade', blurb: 'Tight dark corridors lit by neon', sky: '#3A2E6E', ground: '#140F24', fog: ['#120E22', 0.018], floor: '#1B1730', S: 22, tint: 'linear-gradient(135deg,#FF4F8B,#3A2EAE)',
    boxes: [...walls(22, 5, '#221C3A'), [0, 2, -8, 8, 2, 0.4, '#2A2347'], [0, 2, 8, 8, 2, 0.4, '#2A2347'], [-8, 2, 0, 0.4, 2, 5, '#2A2347'], [8, 2, 0, 0.4, 2, 5, '#2A2347'], [0, 3.7, -7.55, 8, 0.08, 0.05, '#FF4F8B', 1], [0, 3.7, 7.55, 8, 0.08, 0.05, '#3EC1FF', 1],
      [-15, 1.2, -15, 1, 1.2, 0.8, '#5A3FD9'], [-12, 1.2, -15, 1, 1.2, 0.8, '#D93F8E'], [15, 1.2, 15, 1, 1.2, 0.8, '#3FD9C0'], [12, 1.2, 15, 1, 1.2, 0.8, '#5A3FD9'], [15, 1.2, -12, 0.8, 1.2, 1, '#D93F8E'], [-15, 1.2, 12, 0.8, 1.2, 1, '#3FD9C0'], [0, 0.05, 0, 3, 0.05, 3, '#FFC233', 1], [-21.4, 2.5, 0, 0.05, 0.08, 10, '#5BE38A', 1], [21.4, 2.5, 0, 0.05, 0.08, 10, '#FF7A1A', 1]],
    spawns: [[-18, 0, -18], [18, 0, 18], [-18, 0, 18], [18, 0, -18], [0, 0, -15], [0, 0, 15], [-15, 0, 0], [15, 0, 0]] }
];
for (const m of MAPS) {
  m.solid = m.boxes.map(b => ({ min: [b[0] - b[3], b[1] - b[4], b[2] - b[5]], max: [b[0] + b[3], b[1] + b[4], b[2] + b[5]], b }));
  m.solid.push({ min: [-m.S, -1, -m.S], max: [m.S, 0, m.S], b: [0, -0.5, 0, m.S, 0.5, m.S, m.floor] });
  m.way = m.spawns.concat(m.boxes.filter(b => !b[7] && b[4] < 2.6 && b[3] > 1).map(b => [b[0], b[1] + b[4], b[2]]));
}

/* ================= menu ================= */
const menu = $('#menu');
let view = 'home', pickMap = -1;
const opt = (act, val, on, label, sub) => `<button type="button" class="opt" data-act="${act}" data-v="${val}" aria-pressed="${on}">${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
function drawMenu() {
  const P = WEAPONS[loadout.primary], g = gunStats(loadout.primary, loadout.att);
  let h = `<div class="brand"><h1>Scobb <span>Strike</span></h1><a href="./">Back to ScobbBucks</a></div>`;
  if (view === 'home') {
    h += `<p class="soft">First person free for all. Best of 3 rounds, first to 10 kills or most kills when time runs out. 100 health each.</p>`;
    h += `<div class="modes"><button type="button" class="mode hero" data-act="practice"><b>Practice</b><span>Free for all against 5 bots. No coins.</span></button><button type="button" class="mode" disabled><b>Wager match</b><span class="soft">1v1 with a ScobbBucks bet. Coming next.</span></button></div>`;

/* ================= HUD ================= */

function say(a, b, stay) { hudEls.msg.innerHTML = `${a}<small>${b || ''}</small>`; hudEls.msg.style.opacity = '1'; clearTimeout(say.t); if (!stay) say.t = setTimeout(() => { hudEls.msg.style.opacity = '0'; }, 2600); }

function updateHud() {

  hudEls.time.textContent = match.phase === 'live' ? `${Math.floor(match.t / 60)}:${String(Math.floor(match.t % 60)).padStart(2, '0')}` : '';

/* ================= input ================= */
document.addEventListener('keydown', e => {

  if (e.code === 'Digit1') swap(me, 0);

document.addEventListener('keyup', e => {

});

const cv = $('#cv');
cv.addEventListener('mousedown', e => { if (!running) return; if (!TEST && document.pointerLockElement !== cv) { cv.requestPointerLock(); return; } if (e.button === 0) mouse.l = true; if (e.button === 2) mouse.r = true; });

let touchMove = [0, 0], touchFire = false, touchAds = false;
function wireTouch() {

  document.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === sid) { const r = st.getBoundingClientRect(); const dx = (t.clientX - r.left - 60) / 50, dy = (t.clientY - r.top - 60) / 50; const l = Math.min(1, Math.hypot(dx, dy)) / (Math.hypot(dx, dy) || 1); touchMove = [dx * l, dy * l]; knob.style.transform = `translate(${touchMove[0] * 40}px, ${touchMove[1] * 40}px)`; }

    }

  }, { passive: false });
  document.addEventListener('touchend', e => { for (const t of e.changedTouches) { if (t.identifier === sid) { sid = null; touchMove = [0, 0]; knob.style.transform = ''; } if (t.identifier === lid) lid = null; } });

    b.addEventListener('touchstart', e => { e.preventDefault(); const k = b.dataset.t; if (k === 'fire') touchFire = true; if (k === 'ads') touchAds = !touchAds; if (k === 'jump' && me.ground) me.v[1] = 7; if (k === 'reload') reload(me); if (k === 'swap') swap(me, me.cur ? 0 : 1); if (k === 'tac' && me.tac > 0 && me.alive) useTac(); if (k === 'leth' && me.leth > 0 && me.alive) { me.leth--; throwNade(me, me.lo.leth, me.lo.leth === 'frag' ? 1 : 0); } }, { passive: false });

function quit() { running = false; paused = false; if (document.exitPointerLock) document.exitPointerLock(); window.removeEventListener('resize', onResize); if (G) { G.destroy(); G = null; } $('#game').hidden = true; $('#menu').hidden = false; drawMenu(); }

/* ================= main loop ================= */
function frame(now) {

}
function step(dt) {

function drawGunWorld(e) {
  const f = dirOf(e.yaw, 0), r = [Math.cos(e.yaw), 0, Math.sin(e.yaw)];
  const c = add(add(e.p, [0, 0.72, 0]), add(scl(f, 0.5), scl(r, 0.22)));
  G.box(c[0], c[1], c[2], 0.06, 0.07, 0.28, 0.02, '#2B2F38', { ry: -e.yaw, rx: e.pitch * 0.6, spec: 0.9 });
  if (e.flashMuzzle > 0) { const m = add(c, scl(dirOf(e.yaw, e.pitch), 0.35)); G.sphere(m[0], m[1], m[2], 0.12, '#FFD86B', { emit: 1 }); }
}
function drawViewmodel() {

function render() {
  G.begin();

  const s = me.guns[me.cur].s;
  const fov = 75 / (1 + (s.zoom - 1) * me.ads);
  G.view(eye, me.yaw, me.pitch + me.recoil * 0.3, fov, 0.05, 300);
  for (const bx of M.solid) { const b = bx.b; G.box(b[0], b[1], b[2], b[3], b[4], b[5], Math.min(0.12, b[3], b[4], b[5]), b[6], { spec: b[7] ? 0.2 : 0.25, shiny: 20, emit: b[7] ? 1 : 0 }); }

    const squash = 1 + Math.sin(performance.now() / 120 + e.p[0]) * 0.03;
    G.sphere(e.p[0], e.p[1] + 0.72, e.p[2], 0.55, e.col, { ky: squash, spec: 0.9, shiny: 60 });

    if (e.hp < 100) { const hp = add(e.p, [0, 1.55, 0]); G.box(hp[0], hp[1], hp[2], 0.4 * e.hp / 100, 0.035, 0.01, 0.01, e.hp > 50 ? '#4FCB96' : '#FF5A5F', { emit: 1, ry: -me.yaw }); }

drawMenu();
